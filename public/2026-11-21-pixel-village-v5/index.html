function mkCloud(w,seed){const h=18,a=new Uint8Array(w*h);let s=seed;const r=()=>(s=(s*16807)%2147483647)/2147483647;const blobs=[];const n=3+(w>>4);

 for(let x=0;x<w;x++){let bot=-1;for(let y=h-1;y>=0;y--)if(a[y*w+x]){bot=y;break}if(bot>0){a[bot*w+x]=C.cls;if(bot>1&&a[(bot-1)*w+x]&&(x+bot)%3)a[(bot-1)*w+x]=C.cls}}
 return{w,h,a}}

  if(inn)a[y*w+x]=lt?C.grL:(y>h*.62||x>w*.72?C.grD:C.gr)}
 for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const v=a[y*w+x];if(v===C.gr&&hsh(x,y+seed)%9===0)a[y*w+x]=C.grD;if(v===C.gr&&hsh(x+3,y)%13===0)a[y*w+x]=C.grL}
 if(apples)for(const[ax,ay]of apples){a[ay*w+ax]=C.roR;a[ay*w+ax+1]=C.roR;a[(ay+1)*w+ax]=C.roD;a[(ay+1)*w+ax+1]=C.roR}
 const o=a.slice();for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(a[y*w+x])continue;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<w&&yy<h&&a[yy*w+xx]){o[y*w+x]=C.ink;break}}}
