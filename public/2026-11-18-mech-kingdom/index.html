near=null;let nd=21;for(let s of sites){let d=dist(s,player);if(d<nd){nd=d;near=s}}if(near){let type=near.type<0?selected:near.type,cost=near.type<0?types[type].cost:Math.ceil(types[type].cost*1.5);$('prompt').classList.add('on');$('prompt').textContent=near.level>=2?'已升级至最高等级':`${near.type<0?'建造 '+types[type].name:'升级 '+types[type].name} · ${cost} 齿轮  ${buildProgress?Math.floor(buildProgress*100)+'%':'长按空格'}`;if((buildHeld||keys.Space)&&near.level<2&&coins>=cost){buildProgress+=dt/1.1;if(Math.random()<.35)burst(near.x,near.z,0,palettes.gold,1,.2);if(buildProgress>=1){coins-=cost;near.type=type;near.level++;near.maxhp=near.type===0?100+near.level*65:100+near.level*35;near.hp=near.maxhp;near.build=0;burst(near.x,near.z,2,palettes.gold,16);buildProgress=0}}else buildProgress=Math.max(0,buildProgress-dt*2)}else{$('prompt').classList.remove('on');buildProgress=0}
if(demo && demoBuilds<2 && t>1+demoBuilds*3.2){let s=sites[demoBuilds===0?2:6];s.type=demoBuilds===0?1:2;s.level=1;s.build=0;s.hp=s.maxhp=135;demoBuilds++;announce(demoBuilds===1?'机枪塔组装':'加农炮组装','机械零件逐一锁定');}
for(let d of debris){d.x+=d.vx*dt;d.z+=d.vz*dt;d.rot+=dt*5;d.life-=dt}debris=debris.filter(d=>d.life>0);
for(let s of sites){let old=s.build;s.build=Math.min(1,s.build+dt*.65);for(let k=0;k<8;k++){let lock=(1.05+k*.085)/1.7;if(old<lock&&s.build>=lock){burst(s.x+Math.cos(k*2.4)*5,s.z+Math.sin(k*2.4)*5,7,palettes.gold,4,.35);shake=.45}}if(old<1&&s.build>=1){burst(s.x,s.z,9,palettes.gold,16,.8);shake=1.2;}s.hit=Math.max(0,s.hit-dt);s.cool-=dt;if(s.type<0)continue;if(s.type===3&&phase==='day'&&s.cool<=0){coins+=s.level;s.cool=8;burst(s.x,s.z,14,palettes.gold,3,.3)}if(s.type===4&&s.cool<=0){for(let b of sites)if(b.type>=0&&dist(s,b)<50)b.hp=Math.min(b.maxhp,b.hp+3*s.level);core=Math.min(100,core+.5*s.level);s.cool=2}if((s.type===1||s.type===2)&&s.cool<=0&&s.build>.8){let range=s.type===1?88:105,target=null,best=1e9;for(let e of enemies){let d=dist(s,e);if(d<range&&d<best){best=d;target=e}}if(target)fire(s,target)}}
if(phase==='night'){spawn-=dt;if(spawn<=0){let kind=night===3&&spawned===5?'boss':(spawned%5===4?'drone':spawned%3===2?'spring':'bug');spawnEnemy(kind,spawned%4);spawned++;spawn=Math.max(.65,2.5-night*.4)}}
for(let e of enemies){e.hit=Math.max(0,e.hit-dt);e.attack-=dt;let target={x:0,z:0},best=1e9;if(e.kind!=='drone')for(let s of sites){if(s.type!==0||s.build<.7)continue;let d=dist(e,s);if(d<15&&d<best){target=s;best=d}}let d=dist(e,target);if(d>(target===undefined?0:target.maxhp?10:13)){e.x+=(target.x-e.x)/d*e.speed*dt;e.z+=(target.z-e.z)/d*e.speed*dt}else if(e.attack<=0){e.attack=e.kind==='boss'?.55:1;let hit=e.kind==='boss'?9:3;if(target.maxhp){target.hp-=hit;target.hit=.15;burst(target.x,target.z,7,palettes.wood,5);if(target.hp<=0){burst(target.x,target.z,8,palettes.steel,20);let pts=clouds[target.type===0?(target.level>1?'wall2':'wall'):['wall','gun','cannon','mine','repair'][target.type]];for(let i=0;i<8;i++){let piece=pts.filter(p=>((p[0]>0?1:0)+(p[2]>0?2:0)+(p[1]>8?4:0))===i);debris.push({points:piece,x:target.x,z:target.z,vx:rand(-20,20),vz:rand(-20,20),rot:0,life:.9})}target.type=-1;target.level=0}}else{core-=hit*.7;shake=1;burst(0,0,10,palettes.gold,5);if(core<=0){core=0;over=true;$('endTitle').textContent='营地失守';$('endText').textContent='调整防线，再试一次。';$('end').style.display='grid'}}}}
for(let s of shots){if(!enemies.includes(s.target)||s.target.hp<=0){s.dead=true;continue}let d=dist(s,s.target),step=s.speed*dt;if(d<step+3){if(s.big){for(let e of enemies)if(dist(e,s.target)<24)damage(e,s.damage);burst(s.target.x,s.target.z,5,palettes.gold,20,1.4);shake=2}else damage(s.target,s.damage);s.dead=true}else{s.x+=(s.target.x-s.x)/d*step;s.z+=(s.target.z-s.z)/d*step}}
shots=shots.filter(s=>!s.dead);enemies=enemies.filter(e=>e.hp>0);for(let p of particles){p.x+=p.vx*dt;p.z+=p.vz*dt;p.y+=p.vy*dt;p.vy-=38*dt;p.life-=dt}particles=particles.filter(p=>p.life>0&&p.y>=0);if(particles.length>400)particles.splice(0,particles.length-400);shake=Math.max(0,shake-dt*5);noticeTime-=dt;$('notice').style.opacity=noticeTime>0?1:0;$('coins').textContent=Math.floor(coins);$('health').textContent=Math.ceil(core)+'%';$('phase').textContent=(phase==='day'?'白昼':'夜晚')+' · '+(phase==='day'?'DAY ':'NIGHT ')+String(night).padStart(2,'0');$('timer').textContent=Math.ceil(remaining)+'s';$('timebar').style.width=(remaining/(phase==='day'?(demo?10:60):(demo?22:40))*100)+'%';}
let joyX=0,joyY=0;function joyMove(e){let r=$('joy').getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/(r.width*.35),y=(e.clientY-r.top-r.height/2)/(r.height*.35),d=Math.hypot(x,y);joyX=x/Math.max(1,d);joyY=y/Math.max(1,d);$('stick').style.transform=`translate(${joyX*r.width*.25}px,${joyY*r.height*.25}px)`}let joy=$('joy');joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))joyMove(e)});function joyEnd(){joyX=joyY=0;$('stick').style.transform=''}joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);$('hold').addEventListener('pointerdown',e=>{e.preventDefault();$('hold').setPointerCapture(e.pointerId);buildHeld=true});$('hold').addEventListener('pointerup',()=>buildHeld=false);$('hold').addEventListener('pointercancel',()=>buildHeld=false);
window.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(/^Digit[1-5]$/.test(e.code))select(+e.code.slice(-1)-1)});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('blur',()=>{keys={};buildHeld=false;joyEnd()});$('startBtn').onclick=()=>{playing=true;$('start').style.display='none'};
if(demo){playing=true;player.x=-30;player.z=62;$('start').style.display='none';phase='day';remaining=5;coins=45;[1,5,9,13].forEach((n,i)=>{let s=sites[n];s.type=i%2?2:1;s.level=2;s.maxhp=s.hp=160;s.cool=0});[0,4,8,12].forEach(n=>{let s=sites[n];s.type=0;s.level=2;s.maxhp=s.hp=230});announce('王国的守夜人','齿轮转动，炮塔已就位')}
let last=performance.now(),frames=0,elapsed=0;function loop(now){let realDt=(now-last)/1000,dt=Math.min(.05,realDt);last=now;update(dt);draw();frames++;elapsed+=realDt;if(elapsed>=3){let fps=frames/elapsed;if(fps<32)slow++;else slow=Math.max(0,slow-1);if(slow>=2){quality=Math.min(3,quality+1);slow=0}else if(fps>55&&quality>1)quality--;frames=0;elapsed=0}requestAnimationFrame(loop)}requestAnimationFrame(loop);window.__debug=()=>({phase,night,remaining,coins,core,enemies:enemies.length,player,sites:sites.map(s=>({type:s.type,level:s.level,hp:s.hp})),quality,playing});
