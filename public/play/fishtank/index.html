<div class="cnt">今日喂了<br><b id="n">0</b> 口<br><span id="r">鱼鱼还很苗条</span></div></div>
<script>
const W=1200,H=675;
const META={"fish":[[150,108,101.0,47.8,147],[153,104,103.7,49.5,150],[154,111,104.9,54.1,151],[157,116,104.6,59.6,154],[149,109,100.0,48.2,146],[152,104,102.7,50.0,149],[153,110,104.5,54.0,150],[157,116,104.4,59.2,154],[160,120,106.0,59.2,157],[165,121,107.1,59.9,162],[170,127,108.8,62.8,167],[172,134,110.5,68.4,170],[150,102,104.2,47.3,147],[149,103,101.1,50.7,146],[152,110,100.8,53.8,149],[156,116,102.4,59.0,153]],"kit":{"w":339,"h":340,"ground":338.4,"hx":145.6,"paw":[[28.1,254.0],[21.7,194.5],[11.3,170.4],[0.8,163.2],[0.8,151.1],[17.7,208.2],[20.9,253.2],[27.3,254.0],[21.7,254.0],[24.1,252.4],[7.2,205.0],[21.7,254.0],[15.3,252.4],[15.3,253.2],[16.9,253.2],[12.9,253.2]]},"fx":[[231,418],[296,309],[338,346],[234,195],[244,244],[232,198],[395,383],[192,190]],"bg":[1672,941]};
const SRC={bg:'bg.webp',kit:'kit.webp'};
for(let i=0;i<16;i++)SRC['f'+i]='fish_'+i+'.webp';
for(let i=0;i<8;i++)SRC['x'+i]='fx_'+i+'.webp';
const IMG={};
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;
const wrap=document.getElementById('wrap');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H)*.98;wrap.style.transform=`scale(${s}) translate(-50%,-50%)`;}
addEventListener('resize',fit);fit();
const R=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,hyp=Math.hypot,lerp=(a,b,t)=>a+(b-a)*t;
// tank geometry (canvas px, measured on the painted background)
const TK={x0:124,x1:806,surf:244,bot:470,glassBot:538,top:178};
const SW={x0:TK.x0+70,x1:TK.x1-70,y0:TK.surf+46,y1:TK.bot-30};
// ---------- audio
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,dur=.2,type='sine',vol=.07,when=0,slide=0){const a=AC;if(!a||a.state!=='running')return;const t=a.currentTime+when;
 const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+dur);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
const sfx={
 plop:()=>{tone(R(700,900),.12,'sine',.06,0,.45)},
 chomp:()=>{tone(R(420,520),.07,'square',.03);tone(R(620,700),.07,'square',.025,.07)},
 knock:()=>{tone(150,.16,'triangle',.16,0,.6);tone(170,.14,'triangle',.12,.11,.6)},
 pop:()=>{tone(R(1100,1500),.06,'sine',.06,0,1.8)},
 up:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.05,i*.07))},
 burp:()=>{tone(130,.32,'sawtooth',.04,0,.7)},
 boing:()=>{tone(300,.25,'sine',.07,0,2.2)}};
// ---------- state
let T=0,ptr={x:-99,y:-99,in:false,t:-99},fed=0,lastInput=0,kitHover=0;
const fish=[],food=[],bubbles=[],parts=[],rings=[],knocks=[],texts=[],flying=[];
const NAMES=['团子','汤圆','麻薯'];
function newFish(i){return {i,name:NAMES[i],x:R(SW.x0+60,SW.x1-60),y:R(SW.y0+40,SW.y1-40),vx:R(-40,40),vy:0,fat:[0.1,0.9,0.4][i],dir:1,turn:1,
 tx:0,ty:0,tt:0,scare:0,scareRot:0,mouth:0,pop:0,sleepy:0,full:0,ph:R(0,6.28),sc:[.98,.9,.84][i],tint:i}}
for(let i=0;i<3;i++){const f=newFish(i);pickWander(f);fish.push(f)}
function stage(f){return f.fat<.8?0:f.fat<1.6?1:f.fat<2.4?2:3}
function pickWander(f){f.tx=R(SW.x0,SW.x1);f.ty=R(SW.y0,SW.y1-(f.fat>2.4?60:0));f.tt=R(2.5,5)}
// plants: [fx index, x, root y, display height, behind?]
const plants=[{k:0,x:200,y:TK.bot+22,h:230,back:1},{k:2,x:398,y:TK.bot+20,h:130,back:1},{k:1,x:700,y:TK.bot+24,h:150,back:1},{k:0,x:752,y:TK.bot+30,h:175,back:0}]
 .map(p=>({...p,ang:0,av:0,ph:R(0,6.28)}));
const castle={x:560,y:TK.bot+26,h:118};
// kit
const KS=.86,kit={x:922,y:526,frame:12,seq:null,si:0,st:0,blinkT:R(2,4),bounce:0,jump:0};
const SEQ={feed:{f:[0,1,2,3,4,3,4,5,7],d:.11},knock:{f:[8,9,10,9,10,11],d:.13},startle:{f:[14,14,14,15,15,15],d:.12},
 happy:{f:[6,6,6,7,7],d:.14},laugh:{f:[15,15,15,11,11],d:.14}};
function play(name,onFrame){kit.seq=SEQ[name];kit.name=name;kit.si=0;kit.st=0;kit.on=onFrame}
function pawPos(){const p=META.kit.paw[kit.frame];return {x:kit.x+(p[0]-META.kit.hx)*KS,y:kit.y+(p[1]-META.kit.ground)*KS+kit.jump}}
// ---------- actions
function feedAt(x){x=clamp(x,TK.x0+30,TK.x1-30);lastInput=T;
 const n=4;for(let i=0;i<n;i++)later(()=>launchFood(x+R(-34,34)),i*90+(kit.name==='feed'&&kit.seq?0:300));
 if(!(kit.seq&&kit.name==='feed'))play('feed')}
function launchFood(x){const p=pawPos();flying.push({x0:p.x,y0:p.y,x1:x,y1:TK.surf+2,t:0,d:R(.45,.6),r:R(0,6),k:Math.floor(R(0,3))})}
function knockAt(x,y,byKit){lastInput=T;sfx.knock();knocks.push({x,y,t:0});texts.push({x,y:y-30,s:'咚！',t:0,c:'#fff'});
 for(const f of fish){const d=hyp(f.x-x,f.y-y),k=clamp(1.25-d/520,.25,1);const a=Math.atan2(f.y-y,f.x-x);
  f.vx+=Math.cos(a)*520*k;f.vy+=Math.sin(a)*380*k;f.scare=.75+.5*k;f.sleepy=0;f.full=0;f.scareRot=R(-.5,.5)}
 for(const p of plants)p.av+=(p.x<x?-1:1)*1.2;for(const b of bubbles){b.vx+=(b.x<x?-1:1)*60}
 for(let i=0;i<4;i++)spawnBubble(x+R(-40,40),y+R(-20,20),R(5,10));
 if(!byKit){play('startle');kit.jump=-1}else later(()=>play('laugh'),350)}
function spawnBubble(x,y,r){bubbles.push({x,y,r:r||R(6,14),vx:0,vy:-R(40,70),ph:R(0,6.28),t:0})}
const TQ=[];function later(fn,ms){TQ.push({t:T+(ms||0)/1000,fn})}
function burst(x,y,k,n,sp=1){for(let i=0;i<n;i++){const a=R(-Math.PI,0),v=R(70,200)*sp;parts.push({k,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-50,r:R(0,6.28),vr:R(-5,5),s:R(.5,.9),life:R(.9,1.5),t:0})}}
function heart(x,y){parts.push({k:5,x:x+R(-12,12),y,vx:R(-20,20),vy:R(-90,-55),r:R(-.3,.3),vr:0,s:R(.55,.8),life:1.5,t:0,g:-10})}
function updCnt(){document.getElementById('n').textContent=fed;const m=Math.max(...fish.map(stage));
 document.getElementById('r').textContent=['鱼鱼还很苗条','有点圆了','圆滚滚！','变成球啦！'][m]}
// ---------- input
function loc(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function onKit(x,y){return x>kit.x-120&&x<kit.x+150&&y>kit.y-300&&y<kit.y}
function click(x,y){ac();lastInput=T;
 for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];if(hyp(b.x-x,b.y-y)<b.r+10){popBubble(i);return}}
 if(onKit(x,y)){if(!(kit.seq&&kit.name==='knock')){kit.bounce=1;sfx.boing();heart(kit.x-10,kit.y-270);
   play('knock',fi=>{if(fi===2)knockAt(TK.x1-26,R(330,420),true)})}return}
 if(x>TK.x0&&x<TK.x1&&y>TK.top-20&&y<TK.surf+50){feedAt(x);return}
 if(x>TK.x0&&x<TK.x1&&y>=TK.surf+50&&y<TK.glassBot){knockAt(x,y,false);return}
 // outside the tank: a little sparkle
 burst(x,y,7,4,.6)}
function popBubble(i){const b=bubbles[i];bubbles.splice(i,1);sfx.pop();burst(b.x,b.y,7,3,.5);rings.push({x:b.x,y:b.y,t:0,r:b.r,k:1})}
cv.addEventListener('pointerdown',e=>{const p=loc(e);click(p.x,p.y)});
cv.addEventListener('pointermove',e=>{const p=loc(e);look(p.x,p.y)});
cv.addEventListener('pointerleave',()=>leave());
function look(x,y){ptr.x=x;ptr.y=y;ptr.in=true;ptr.t=T;kitHover=onKit(x,y)?1:0}
function leave(){ptr.in=false;kitHover=0}
window.__api={click,look,leave,feed:feedAt};
// ---------- simulation
function nearestFood(f){let best=null,bd=1e9;for(const p of food){if(p.eaten)continue;const d=hyp(p.x-f.x,p.y-f.y)+(p.claim&&p.claim!==f?120:0);if(d<bd){bd=d;best=p}}return best}
function stepFish(f,dt){
 const st=stage(f),maxV=150-st*24;f.mouth=Math.max(0,f.mouth-dt);f.pop=Math.max(0,f.pop-dt*2.2);
 f.fat=Math.max(0,f.fat-dt*.012);
 let tx=f.tx,ty=f.ty,want=maxV*.45,chasing=false;
 if(f.scare>0){f.scare-=dt;want=0}
 else{const p=nearestFood(f);
  if(p){p.claim=p.claim||f;tx=p.x;ty=p.y;want=maxV*1.15;chasing=true;f.sleepy=0;
   if(hyp(p.x-(f.x+f.dir*48*f.sc),p.y-(f.y-4))<34){eat(f,p)}}
  else if(ptr.in&&ptr.x>TK.x0&&ptr.x<TK.x1&&ptr.y>TK.surf&&ptr.y<TK.glassBot&&T-ptr.t<4){ // curious about the finger on the glass
   const o=[-70,0,70][f.i];tx=ptr.x+o;ty=clamp(ptr.y+o*.4,SW.y0,SW.y1);want=maxV*.7}
  else{f.tt-=dt;if(f.tt<0||hyp(f.tx-f.x,f.ty-f.y)<20)pickWander(f);
   if(st>=2&&f.full>3)f.sleepy=Math.min(1,f.sleepy+dt*.5);
   if(f.sleepy>.5){want=maxV*.15;ty=SW.y0+20}}
  f.full+=dt}
 if(!chasing&&f.sleepy<.5)f.full=Math.min(f.full,6);
 const dx=tx-f.x,dy=ty-f.y,d=hyp(dx,dy)||1;
 if(f.scare<=0){const ax=dx/d*want-f.vx,ay=dy/d*want-f.vy;const k=chasing?3.2:1.4;f.vx+=ax*k*dt;f.vy+=ay*k*dt}
 // separation
 for(const g of fish)if(g!==f){const ex=f.x-g.x,ey=f.y-g.y,e=hyp(ex,ey);if(e<105&&e>0){f.vx+=ex/e*150*dt;f.vy+=ey/e*110*dt}}
 // buoyancy: very fat fish float up a little
 if(st>=3&&!chasing)f.vy-=14*dt;
 const drag=f.scare>0?1.8:0.9;f.vx*=1-drag*dt;f.vy*=1-drag*1.3*dt;
 f.x+=f.vx*dt;f.y+=f.vy*dt;
 if(f.x<SW.x0){f.x=SW.x0;f.vx=Math.abs(f.vx)*.6}if(f.x>SW.x1){f.x=SW.x1;f.vx=-Math.abs(f.vx)*.6}
 if(f.y<SW.y0){f.y=SW.y0;f.vy=Math.abs(f.vy)*.5}if(f.y>SW.y1){f.y=SW.y1;f.vy=-Math.abs(f.vy)*.5}
 if(Math.abs(f.vx)>14&&f.scare<=0)f.dir=Math.sign(f.vx);if(chasing&&Math.abs(dx)>8)f.dir=Math.sign(dx);
 f.turn+=clamp(f.dir-f.turn,-dt*7,dt*7);
 // plants get pushed when a fish swims through
 for(const p of plants){if(Math.abs(f.x-p.x)<40&&f.y>p.y-p.h&&f.y<p.y)p.av+=f.vx*.0009}
 if(Math.random()<dt*.25)spawnBubble(f.x+f.dir*30,f.y-6,R(3,6));
}
function eat(f,p){p.eaten=1;fed++;const s0=stage(f);f.fat+=.45;f.mouth=.28;f.full=0;sfx.chomp();
 burst(p.x,p.y,7,2,.4);spawnBubble(f.x+f.dir*40,f.y-10,R(4,7));const s1=stage(f);
 if(s1>s0){f.pop=1;sfx.up();for(let i=0;i<3;i++)heart(f.x,f.y-30);texts.push({x:f.x,y:f.y-60,s:['','圆了一点','圆滚滚！','变成球啦！'][s1],t:0,c:'#fff3d6'});
  later(()=>{if(!kit.seq)play('happy')},200)}
 else if(f.fat>3.2){f.fat=3.05;sfx.burp();texts.push({x:f.x+f.dir*40,y:f.y-40,s:'嗝~',t:0,c:'#e8fbff'});
  for(let i=0;i<5;i++)spawnBubble(f.x+f.dir*44+R(-6,6),f.y-6+R(-8,8),R(4,9));f.pop=.6}
 updCnt()}
function step(dt){T+=dt;
 for(let i=TQ.length-1;i>=0;i--)if(T>=TQ[i].t){const q=TQ[i];TQ.splice(i,1);q.fn()}
 // kit
 if(kit.seq){kit.st+=dt;if(kit.st>=kit.seq.d){kit.st-=kit.seq.d;kit.si++;if(kit.on)kit.on(kit.si);if(kit.si>=kit.seq.f.length){kit.seq=null;kit.on=null}}}
 if(kit.seq)kit.frame=kit.seq.f[kit.si]??12;
 else{kit.blinkT-=dt;if(kit.blinkT<0){kit.blinkT=R(2.2,4.5)}kit.frame=kitHover?6:(kit.blinkT<.14?13:12)}
 if(kit.name==='startle'&&kit.seq){kit.jump=-Math.sin(clamp(kit.si*kit.seq.d+kit.st,0,.42)/.42*Math.PI)*28}else kit.jump=0;
 kit.bounce=Math.max(0,kit.bounce-dt*2.5);
 // food
 for(let i=flying.length-1;i>=0;i--){const q=flying[i];q.t+=dt;if(q.t>=q.d){flying.splice(i,1);
   food.push({x:q.x1,y:TK.surf+3,vx:0,vy:0,t:0,r:q.r,vr:R(-1,1),k:q.k,ph:R(0,6.28)});rings.push({x:q.x1,y:TK.surf+2,t:0,r:4,k:0});sfx.plop()}}
 for(let i=food.length-1;i>=0;i--){const p=food[i];p.t+=dt;if(p.eaten){food.splice(i,1);continue}
  if(p.t<.7){p.y=TK.surf+3+Math.sin(p.t*9)*1.5}else if(p.y<TK.bot+4){p.y+=24*dt;p.x+=Math.sin(p.t*2.2+p.ph)*16*dt;p.r+=p.vr*dt}
  else if(p.t>16){food.splice(i,1)}}
 for(const f of fish)stepFish(f,dt);
 // bubbles from castle & pebbles
 if(Math.random()<dt*1.1)spawnBubble(castle.x+R(-8,8),castle.y-30,R(4,9));
 if(Math.random()<dt*.5)spawnBubble(R(TK.x0+40,TK.x1-40),TK.bot+4,R(3,7));
 for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];b.t+=dt;b.ph+=dt*3;b.vx*=1-2*dt;b.x+=(Math.sin(b.ph)*14+b.vx)*dt;b.y+=b.vy*dt*(1+b.r/30);
  if(b.y<TK.surf+b.r*.5){bubbles.splice(i,1);rings.push({x:b.x,y:TK.surf+2,t:0,r:b.r*.6,k:0})}}
 for(const p of plants){p.av+=(-p.ang*14-p.av*2.2)*dt;p.ang+=p.av*dt}
 for(const L of [parts,rings,knocks,texts])for(let i=L.length-1;i>=0;i--){const p=L[i];p.t+=dt;
  if(L===parts){p.vy+=(p.g??260)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;if(p.t>p.life)L.splice(i,1)}
  else if(p.t>(L===texts?1.2:L===knocks?.7:1))L.splice(i,1)}
 // autopilot when nobody plays
 if(!window.__noIdle&&T-lastInput>9){lastInput=T;Math.random()<.65?feedAt(R(TK.x0+80,TK.x1-80)):click(kit.x,kit.y-120)}
}
// ---------- drawing
function img(n,x,y,w,h){const I=IMG[n];if(I)cx.drawImage(I,x,y,w,h)}
function drawPlant(p){const m=META.fx[p.k],s=p.h/m[1];const sway=Math.sin(T*1.1+p.ph)*.05+Math.sin(T*2.3+p.ph*2)*.02;
 cx.save();cx.translate(p.x,p.y);cx.rotate(p.ang+sway);img('x'+p.k,-m[0]*s/2,-m[1]*s,m[0]*s,m[1]*s);cx.restore()}
function drawFish(f){const st=stage(f);let k=st;
 if(f.scare>0)k=8+st;else if(f.mouth>0)k=4+st;else if(f.sleepy>.5)k=12+st;
 const m=META.fish[k],I=IMG['f'+k];if(!I)return;
 const sw=Math.min(1,hyp(f.vx,f.vy)/90);const wig=Math.sin(T*(6+sw*10)+f.ph)*(.035+sw*.05);
 let s=f.sc*(1+Math.sin(f.pop*Math.PI*2.5)*f.pop*.22);
 const tremble=f.scare>0?Math.sin(T*60)*2.2:0;
 const tilt=clamp(f.vy/(Math.abs(f.vx)+60),-.45,.45)*(f.turn>0?1:-1)+(f.scare>0?f.scareRot*f.scare:0);
 cx.save();cx.translate(f.x+tremble,f.y+Math.sin(T*2+f.ph)*2.5);cx.rotate(tilt+wig*.5);
 cx.scale(f.turn*s*(1-Math.abs(wig)*.6),s*(1+Math.abs(wig)*.4));
 cx.drawImage(I,-m[2],-m[3],m[0],m[1]);cx.restore()}
function drawFood(p){const m=META.fx[3],s=.11;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);
 cx.globalAlpha=p.t>14?clamp(16-p.t,0,1)/2:1;img('x3',-m[0]*s/2,-m[1]*s/2,m[0]*s,m[1]*s);cx.restore()}
function draw(){
 cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,W,H);
 if(IMG.bg)cx.drawImage(IMG.bg,0,0,W,H);
 // inside the tank
 cx.save();cx.beginPath();cx.rect(TK.x0,TK.surf-6,TK.x1-TK.x0,TK.glassBot-TK.surf+6);cx.clip();
 // drifting light rays
 cx.globalCompositeOperation='lighter';
 for(let i=0;i<5;i++){const x=TK.x0+80+i*140+Math.sin(T*.3+i)*40;const g=cx.createLinearGradient(0,TK.surf,0,TK.bot);g.addColorStop(0,'rgba(255,250,220,.10)');g.addColorStop(1,'rgba(255,250,220,0)');
  cx.fillStyle=g;cx.beginPath();cx.moveTo(x,TK.surf);cx.lineTo(x+46,TK.surf);cx.lineTo(x+100,TK.bot);cx.lineTo(x+20,TK.bot);cx.fill()}
 cx.globalCompositeOperation='source-over';
 for(const p of plants)if(p.back)drawPlant(p);
 {const m=META.fx[6],s=castle.h/m[1];img('x6',castle.x-m[0]*s/2,castle.y-m[1]*s,m[0]*s,m[1]*s)}
 for(const p of food)drawFood(p);
 const order=[...fish].sort((a,b)=>a.fat-b.fat);for(const f of order)drawFish(f);
 for(const p of plants)if(!p.back)drawPlant(p);
 for(const b of bubbles){const m=META.fx[4],d=b.r*2*(1+Math.sin(b.ph*1.3)*.05);cx.globalAlpha=.8;img('x4',b.x-d/2,b.y-d/2,d,d*(1-Math.sin(b.ph*1.3)*.05))}
 cx.globalAlpha=1;
 // surface ripples
 for(const r of rings){const k=r.t;cx.strokeStyle=`rgba(255,255,255,${.7*(1-k)})`;cx.lineWidth=2;cx.beginPath();
  if(r.k===1)cx.arc(r.x,r.y,r.r+k*22,0,7);else cx.ellipse(r.x,r.y,r.r+k*42,(r.r+k*42)*.18,0,0,7);cx.stroke()}
 cx.restore();
 // flying food
 for(const q of flying){const u=q.t/q.d,x=lerp(q.x0,q.x1,u),y=lerp(q.y0,q.y1,u)-Math.sin(u*Math.PI)*90;const m=META.fx[3],s=.11;
  cx.save();cx.translate(x,y);cx.rotate(q.r+u*6);img('x3',-m[0]*s/2,-m[1]*s/2,m[0]*s,m[1]*s);cx.restore()}
