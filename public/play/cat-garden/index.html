<script>

function burst(x,y,kind,n,sp=1){for(let i=0;i<n;i++){const a=R(-Math.PI,0),v=R(80,240)*sp;
 parts.push({k:kind,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,r:R(0,6.28),vr:R(-6,6),s:R(.6,1),life:R(1.1,1.9),t:0})}}
function heart(x,y){parts.push({k:7,x:x+R(-10,10),y,vx:R(-20,20),vy:R(-90,-60),r:R(-.3,.3),vr:0,s:R(.7,1),life:1.4,t:0,float:1})}
// ---------- kit watering
function water(tx,ty){ac();kit.queue.push({tx,ty});if(kit.play<0)startPour()}
function startPour(){const q=kit.queue.shift();if(!q)return;kit.play=0;kit.ft=0;kit.tgt=q;kit.hit=false;kit.emitted=0}
function spoutPos(k){const K=META.kit,s=kit.hgt/K.h,p=K.spout[k]||K.spout[3];return {x:kit.x-K.w*s/2+p[0]*s,y:kit.y-K.ground*s+p[1]*s-kit.bounce}}
function emitDrop(){const sp=spoutPos(kit.f),q=kit.tgt,tf=R(.5,.62);
 const tx=q.tx+R(-10,10),ty=q.ty+R(-4,4),g=900;
 drops.push({x:sp.x,y:sp.y,vx:(tx-sp.x)/tf,vy:(ty-sp.y)/tf-.5*g*tf,g,t:0,tf,tx,ty,first:kit.emitted===0,q});kit.emitted++}
function land(d){parts.push({k:4,x:d.tx,y:d.ty,vx:0,vy:0,r:0,vr:0,s:R(.13,.17),life:.42,t:0,splash:1});
 if(!d.first)return;tone(PENTA[Math.floor(R(0,4))]/2,.18,'sine',.06,0,1.6);
 const q=d.q;let best=null,bd=1e9;
 for(const f of flowers){const e=eyePos(f);const dd=Math.min(hyp(q.tx-f.x,q.ty-f.y),hyp(q.tx-e.x,q.ty-e.y));if(dd<bd){bd=dd;best=f}}
 if(best&&bd<55){best.happy=1.1;best.pop=1;best.grow=Math.min(1.35,best.grow+.08);best.av+=R(-1.5,1.5);const e=eyePos(best);for(let i=0;i<3;i++)later(()=>heart(e.x,e.y-e.r),i*160);
  tone(PENTA[5],.3,'triangle',.06);tone(PENTA[7],.3,'triangle',.05,.09);return}
 for(const s of sprouts)if(hyp(q.tx-s.x,q.ty-s.y)<45){s.speed=Math.min(3,s.speed+.8);return}
 if(inBed(q.tx,q.ty)&&!flowers.some(f=>hyp(f.x-q.tx,(f.y-q.ty)*1.6)<62)){
  sprouts.push({x:q.tx,y:q.ty,t:0,k:0,pop:1,speed:1,type:ftype++%4});tone(PENTA[0],.2,'sine',.07)}
}
// ---------- input
function look(x,y){ptr.x=x;ptr.y=y;ptr.t=T;ptr.in=true}
function hitFlower(x,y){let best=null,bd=1e9;for(const f of flowers){const e=eyePos(f),r=e.r*2.1;const d=hyp(x-e.x,y-e.y);if(d<r&&d<bd){bd=d;best=f}}return best}
function poke(f,x){ac();f.closed=.4;f.pop=1;f.av+=(x<f.x?1:-1)*3.2;const e=eyePos(f);
 const pk=(f.type===1||f.type===3)?6:5;burst(e.x,e.y,pk,7,.9);tone(PENTA[3+f.type],.22,'triangle',.07);tone(PENTA[3+f.type]*1.5,.18,'sine',.04,.06);
 lookOverride={x:e.x,y:e.y,until:T+1.2};
 for(const g of flowers)if(g!==f){const d=hyp(g.x-f.x,g.y-f.y);if(d<330)later(()=>{g.closed=Math.max(g.closed,.16);g.av+=(g.x<f.x?-1:1)*.6},d*1.6)}}
function click(x,y){ac();look(x,y);
 const K=META.kit,ks=kit.hgt/K.h;
 if(x>kit.x-K.w*ks*.35&&x<kit.x+K.w*ks*.3&&y>kit.y-kit.hgt&&y<kit.y){kit.bounce=1;lookOverride={x:kit.x+10,y:kit.y-kit.hgt*.6,until:T+1.5};for(let i=0;i<4;i++)later(()=>heart(kit.x+R(-30,30),kit.y-kit.hgt*.8),i*120);tone(PENTA[4],.25,'triangle',.07);tone(PENTA[6],.25,'triangle',.06,.1);return}
 const f=hitFlower(x,y);if(f){poke(f,x);return}
 water(x,y)}
function evp(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
cv.addEventListener('pointermove',e=>{const [x,y]=evp(e);look(x,y)});
cv.addEventListener('pointerleave',()=>{ptr.in=false});
cv.addEventListener('pointerdown',e=>{const [x,y]=evp(e);click(x,y)});
// ---------- update
function update(dt){T+=dt;for(let i=TQ.length-1;i>=0;i--)if(TQ[i].t<=T){const q=TQ.splice(i,1)[0];q.fn()}
 // look target
 let tgt=null;
 if(lookOverride&&T<lookOverride.until)tgt=lookOverride;
 else if(drops.length)tgt=drops[drops.length-1];
 else if(ptr.in&&T-ptr.t<5)tgt=ptr;
 else {const k=Math.floor(T/3.2)%3;tgt=k===0?{x:kit.x+20,y:kit.y-kit.hgt*.65}:{x:600+Math.sin(T*.4)*500,y:200+Math.cos(T*.53)*120}}
 // sync blink wave every ~9s
 if(Math.floor((T-dt)/9)!==Math.floor(T/9)&&T>2){const ox=R(200,1000);for(const f of flowers)later(()=>{f.closed=Math.max(f.closed,.14)},Math.abs(f.x-ox)*1.2)}
 for(const f of flowers){
  const e=eyePos(f);let dx=tgt.x-e.x,dy=tgt.y-e.y;const d=hyp(dx,dy)||1;const max=e.r*.42;const k=Math.min(1,d/220)*max;
  const txo=dx/d*k/e.r,tyo=dy/d*k/e.r;f.px+=(txo-f.px)*Math.min(1,dt*f.lag);f.py+=(tyo-f.py)*Math.min(1,dt*f.lag);
  // shy when the pointer is right on the face
  const near=ptr.in&&T-ptr.t<5&&hyp(ptr.x-e.x,ptr.y-e.y)<e.r*1.7;f.shy+=((near?1:0)-f.shy)*Math.min(1,dt*8);
  const leanT=near?(ptr.x<e.x?.22:-.22):0;
  f.blinkT-=dt;if(f.blinkT<0){f.blinkT=R(2,6);f.closed=Math.max(f.closed,.13);if(Math.random()<.2)later(()=>f.closed=Math.max(f.closed,.12),220)}
  f.closed=Math.max(0,f.closed-dt);f.happy=Math.max(0,f.happy-dt);f.pop=Math.max(0,f.pop-dt*2.2);
  if(f.wake>0)f.wake-=dt;
  const wind=Math.sin(T*1.3+f.phase+f.x*.004)*.035+Math.sin(T*.47+f.phase)*.02;
  const goal=wind+leanT;f.av+=((goal-f.ang)*55-f.av*6.5)*dt;f.ang+=f.av*dt;f.ang=clamp(f.ang,-.6,.6);
 }
 for(let i=sprouts.length-1;i>=0;i--){const s=sprouts[i];s.t+=dt*s.speed;s.pop=Math.max(0,s.pop-dt*3);
  const k=Math.min(7,Math.floor(s.t/.36));if(k!==s.k){s.k=k;s.pop=1;tone(PENTA[k]*.5,.12,'sine',.05)}
  if(s.t>7*.36+.45){sprouts.splice(i,1);const f=addFlower(s.x,s.y,s.type,{grow:.85,wake:.5});f.closed=.5;f.pop=1;
   const e=eyePos(f);later(()=>{burst(e.x,e.y,(f.type===1||f.type===3)?6:5,8);for(let j=0;j<3;j++)later(()=>heart(e.x,e.y-e.r),j*140);[0,2,4,7].forEach((n,j)=>tone(PENTA[n],.35,'triangle',.06,j*.08))},500)}}
 // kit
 if(kit.play>=0){kit.ft+=dt;const fr=Math.floor(kit.ft*10);
  if(fr>7){kit.play=-1;kit.f=0;if(kit.queue.length)startPour()}else{kit.f=fr;
   if(fr>=3&&fr<=5){kit.emitAcc=(kit.emitAcc||0)+dt;while(kit.emitAcc>.028){kit.emitAcc-=.028;emitDrop()}}}}
 else {kit.blinkT-=dt;if(kit.blinkT<0){kit.blinkT=R(2.5,5);kit.blink=.14}kit.blink=Math.max(0,kit.blink-dt);kit.f=kit.blink>0?7:0}
 kit.bounce=Math.max(0,kit.bounce-dt*2.2);
 for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.t+=dt;d.vy+=d.g*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;if(d.t>=d.tf){drops.splice(i,1);land(d)}}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>p.life){parts.splice(i,1);continue}
  if(p.float){p.x+=p.vx*dt+Math.sin(p.t*6)*.4;p.y+=p.vy*dt}else if(!p.splash){p.vy+=260*dt;p.vx*=1-dt*1.5;p.vy*=1-dt*1.2;p.x+=p.vx*dt+Math.sin(p.t*5+p.r)*.6;p.y+=p.vy*dt;p.r+=p.vr*dt}}
 if(!window.__noIdle){if(T-Math.max(ptr.t,kit.lastAuto||0)>7&&kit.play<0&&flowers.length+sprouts.length<26){kit.lastAuto=T;const b=BEDS[Math.floor(R(0,3))],a=R(0,6.28);water(b.cx+Math.cos(a)*b.rx*.8,b.cy+Math.sin(a)*b.ry*.5)}}
}
// ---------- draw
function drawFlower(f){const m=f.m,s=f.s*f.grow;const sq=1+Math.sin(f.pop*Math.PI)*.12*(f.pop>0?1:0);
 cx.save();cx.translate(f.x,f.y);cx.rotate(f.ang);cx.scale(s/sq**.5,s*sq);
 // tiny soil shadow
 const closed=f.closed>0||f.happy>0||f.wake>0||f.shy>.5;
 cx.drawImage(IMG[(closed?'fc':'fo')+f.type],-m.bx,-m.h);
 if(!closed){const ex=m.ex-m.bx,ey=m.ey-m.h,r=m.er;cx.save();cx.beginPath();
  // eyelid squint as the pointer gets close (rigid clip, no warp)
  cx.ellipse(ex,ey,r-1.5,(r-1.5)*(1-f.shy*.45),0,0,Math.PI*2);cx.clip();
  const ir=r*.74,ox=f.px*r,oy=f.py*r;const im=IMG['x'+f.iris];cx.drawImage(im,ex+ox-ir,ey+oy-ir,ir*2,ir*2);cx.restore()}
 cx.restore()}
function drawSprout(s){const G=META.grow,sc=fh(s.y)/META.flower[0].h*1.02;const sq=1+s.pop*.16;
 cx.save();cx.translate(s.x,s.y+6);cx.scale(sc/sq**.5,sc*sq);cx.drawImage(IMG.grow,s.k*G.w,0,G.w,G.h,-G.bx,-G.h,G.w,G.h);cx.restore()}
function drawKit(){const K=META.kit,s=kit.hgt/K.h;const b=kit.bounce,jump=Math.sin(b*Math.PI)*28;const br=1+Math.sin(T*2.2)*.008;
 cx.save();cx.translate(kit.x,kit.y-jump);cx.scale(br,1/br);cx.drawImage(IMG.kit,kit.f*K.w,0,K.w,K.h,-K.w*s/2,-K.ground*s,K.w*s,K.h*s);cx.restore()}
function draw(){cx.setTransform(DPR,0,0,DPR,0,0);cx.drawImage(IMG.bg,0,0,W,H);
 const L=[...flowers.map(f=>({y:f.y,d:()=>drawFlower(f)})),...sprouts.map(s=>({y:s.y,d:()=>drawSprout(s)})),{y:kit.y,d:drawKit}];
 L.sort((a,b)=>a.y-b.y);
 for(const o of L){ // soft contact shadow
  o.d()}
 for(const p of parts){const im=IMG['x'+p.k],[w,h]=META.fx[p.k];const a=p.splash?1-p.t/p.life:Math.min(1,(p.life-p.t)*2.5);
  const sc=p.splash?p.s*(.6+p.t/p.life*.8):p.k===7?p.s*.09:p.s*.075;
  cx.save();cx.globalAlpha=a;cx.translate(p.x,p.y);cx.rotate(p.r);cx.drawImage(im,-w*sc/2,p.splash?-h*sc*.8:-h*sc/2,w*sc,h*sc);cx.restore()}
 for(const d of drops){const im=IMG.x3,[w,h]=META.fx[3],sc=.072;cx.save();cx.translate(d.x,d.y);cx.rotate(Math.atan2(d.vy,d.vx)-Math.PI/2+Math.PI);cx.drawImage(im,-w*sc/2,-h*sc/2,w*sc,h*sc);cx.restore()}
}
let last=0;
function frame(ts){const dt=Math.min(.05,last?(ts-last)/1000:1/60);last=ts;update(dt);draw();requestAnimationFrame(frame)}
let left=Object.keys(SRC).length;
for(const k in SRC){const im=new Image();im.onload=()=>{if(--left===0)start()};im.src=SRC[k];IMG[k]=im}
function start(){
 const seed=[[300,322,0],[560,318,1],[860,324,2],[200,412,3],[470,418,2],[760,410,0],[1020,416,1],[380,552,1],[700,560,3],[960,548,0]];
 for(const [x,y,t] of seed)addFlower(x,y,t);
 window.__api={click,look,water,flowers,kit,leave:()=>{ptr.in=false}};requestAnimationFrame(frame)}
