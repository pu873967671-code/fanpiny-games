<div id="wrap"><canvas id="c"></canvas>
<div class="tag"><b>狐兔小魔法</b><i>点草地或天空施法 · 数字键 1–5 换法术</i></div>
<div class="bar" id="bar"></div></div>
<script>
const W=1200,H=675,HOR=402,GND=660;
const META={"cast":{"w":447,"h":392,"ground":389,"nose":351,"rel":[[393,234],[426,150],[425,109]]},"grow":[[316,380],[285,387],[365,391],[300,253],[351,366],[302,324],[310,404],[307,356]],"fx":[[398,375],[198,193],[402,286],[388,262],[183,271],[266,235],[243,264],[255,239]]};
const SRC={bg:'bg.webp',kit:'kit_cast.webp'};
for(let i=0;i<8;i++){SRC['g'+i]='grow_'+i+'.webp';SRC['f'+i]='fx_'+i+'.webp';}
const IMG={};
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;
const wrap=document.getElementById('wrap');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H)*.98;wrap.style.transform=`scale(${s}) translate(-50%,-50%)`;}
addEventListener('resize',fit);fit();
const R=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ds=y=>.62+.5*(clamp(y,HOR,H)-HOR)/(H-HOR);   // depth scale
const SPELLS=[
 {id:'flower',name:'开花',icon:'g0'},{id:'star',name:'星星',icon:'f0'},{id:'mush',name:'蘑菇',icon:'g4'},
 {id:'rain',name:'彩雨',icon:'f3'},{id:'bubble',name:'泡泡',icon:'f2'}];
let spell=0;
// ---------- audio (synth chimes, created on first gesture)
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function chime(f,dur=.35,type='sine',vol=.12,when=0){const a=AC;if(!a||a.state!=='running')return;const t=a.currentTime+when;
 const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.01,t+dur);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0005,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05)}
const PENTA=[523,587,659,784,880,1047,1175,1319];
const ping=(i,v=.1)=>chime(PENTA[(i%8+8)%8],.4,'sine',v);
// ---------- world
const plants=[],stars=[],bubbles=[],clouds=[],drops=[],parts=[],bolts=[],rings=[];
let T=0;
const kit={x:250,y:612,face:1,cast:-1,ct:0,target:null,idle:0,hs:1,hv:0};
const KS=250/META.cast.h;
function spring(o,k,key,vkey,tgt,dt,stiff=170,damp=11){o[vkey]+=((tgt-o[key])*stiff-o[vkey]*damp)*dt;o[key]+=o[vkey]*dt}
function groundY(x,y){return y>HOR+18?clamp(y,HOR+22,GND):R(HOR+60,GND-40)}
// plants -----------------------------------------------------------
const PDEF={0:{h:120,kind:'flower'},1:{h:118,kind:'flower'},2:{h:135,kind:'flower'},3:{h:62,kind:'sprout'},
 4:{h:105,kind:'mush'},5:{h:92,kind:'mush'},6:{h:130,kind:'mush'},7:{h:84,kind:'mush'},};
function addPlant(g,x,y,delay=0,big=1){
 const d=PDEF[g],sz=META.grow[g];const p={g,kind:d.kind,x,y,sc:0,sv:0,st:big,rot:0,rv:0,q:0,qv:0,ph:R(0,6),wet:0,born:T+delay,lvl:0,
  hh:d.h*ds(y)};p.ww=p.hh*sz[0]/sz[1];plants.push(p);plants.sort((a,b)=>a.y-b.y);
 setTimeout(()=>{},0);return p}
function popPlant(p,force=1){p.sv+=3.2*force;p.rv+=R(-2,2)*force;p.qv+=6*force}
function plantTop(p){return p.y-p.hh*p.sc}
function petals(x,y,n,col){for(let i=0;i<n;i++){const a=R(-Math.PI*.95,-Math.PI*.05),v=R(60,190);
 parts.push({img:col||'f5',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:120,drag:1.2,life:R(1.4,2.4),age:0,sz:R(10,17),rot:R(0,6),vr:R(-5,5),flut:R(2,4)})}}
function sparkle(x,y,n,spd=150,sz=[10,22]){for(let i=0;i<n;i++){const a=R(0,Math.PI*2),v=R(.3,1)*spd;
 parts.push({img:'f6',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:-10,drag:2.5,life:R(.5,1.0),age:0,sz:R(sz[0],sz[1]),rot:0,vr:R(-3,3),tw:1})}}
function dust(x,y,n,col='#fff6d8'){for(let i=0;i<n;i++){const a=R(Math.PI*1.05,Math.PI*1.95),v=R(40,120);
 parts.push({dot:col,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v*.5,g:60,drag:2,life:R(.4,.8),age:0,sz:R(2,5)})}}
function ring(x,y,col,r=60){rings.push({x,y,col,r,age:0,life:.6})}
function growFlower(x,y){
 // if clicked on a sprout -> bloom it
 const sp=plants.find(p=>p.kind==='sprout'&&Math.abs(p.x-x)<p.ww*.6&&Math.abs(p.y-y)<30);
 if(sp){bloom(sp);return}
 const n=Math.random()<.5?1:2;
 for(let i=0;i<n;i++){const gx=x+(i?R(-55,55):0),gy=clamp(y+(i?R(-14,14):0),HOR+22,GND);
  const p=addPlant([0,1,2][Math.floor(R(0,3))],gx,gy,i*.12);setTimeout(()=>{},0);
  p.onborn=()=>{petals(p.x,p.y-p.hh*.6,6,'f5');ping(4+i,.08)}}
 ring(x,y,'#ffc6d8');dust(x,y,10)}
function bloom(sp){const g=[0,1,2][Math.floor(R(0,3))];sp.g=g;sp.kind='flower';const d=PDEF[g],sz=META.grow[g];
 sp.hh=d.h*ds(sp.y);sp.ww=sp.hh*sz[0]/sz[1];sp.sc=.35;sp.sv=4;sp.st=1;petals(sp.x,sp.y-sp.hh*.7,8);sparkle(sp.x,sp.y-sp.hh*.6,8);ping(6,.1);ping(3,.06)}
function growMush(x,y){
 const m=plants.find(p=>p.kind==='mush'&&Math.abs(p.x-x)<p.ww*.55&&y>plantTop(p)-10&&y<p.y+20);
 if(m){waterMush(m,1.6);return}
 const p=addPlant([4,5,6,7][Math.floor(R(0,4))],x,y);p.onborn=()=>{dust(p.x,p.y,14,'#f3e2c8');ping(1,.1)};ring(x,y,'#e8c8f4')}
function waterMush(m,k=1){m.lvl+=k;m.st=Math.min(1.75,1+m.lvl*.13);popPlant(m,.7);
 if(m.lvl>=5){m.lvl=0;m.st=1.15;spores(m)}}
function spores(m){ping(5,.1);ping(7,.07);const top=plantTop(m);
 for(let i=0;i<10;i++)parts.push({img:'f7',x:m.x+R(-20,20),y:top+R(0,15),vx:R(-120,120),vy:R(-260,-140),g:140,drag:.6,life:2.4,age:0,sz:R(10,18),rot:0,vr:R(-2,2),flut:1});
 const n=2+Math.floor(R(0,2));for(let i=0;i<n;i++){const s=i%2?1:-1;const gx=clamp(m.x+s*R(55,110),40,W-40),gy=clamp(m.y+R(-25,25),HOR+22,GND);
  const p=addPlant(Math.random()<.5?7:5,gx,gy,.75+i*.2,.62);p.onborn=()=>{dust(p.x,p.y,8,'#efd9f5');ping(2+i,.06)}}}
// stars ------------------------------------------------------------
function castStars(x,y){const n=7;ping(5,.1);ping(7,.06,.08);
 for(let i=0;i<n;i++){const a=-Math.PI/2+R(-1.1,1.1),v=R(220,420);const big=i===0;
  stars.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,rot:R(0,6),vr:R(-6,6),sz:big?54:R(24,36),img:big?'f0':'f1',
   floor:y>HOR+18?clamp(y+R(-10,50),HOR+22,GND):R(HOR+50,GND-20),bounces:0,life:0,bub:null,sq:0})}
 sparkle(x,y,14,220,[12,26]);ring(x,y,'#ffe39a',70)}
// rain -------------------------------------------------------------
const RAINC=['#9fd3f3','#ffb3c9','#ffe08a','#b9e6a8','#d2b8f3'];
function castRain(x,y){const cy=Math.min(y-40,HOR-150);clouds.push({x,y:Math.max(95,cy),vx:R(-12,12),age:0,life:5,sc:0,sv:0,q:0,qv:0,acc:0,ci:0});ping(2,.1);chime(392,.6,'triangle',.05)}
// bubbles ----------------------------------------------------------
function castBubbles(x,y){for(let i=0;i<6;i++){const r=R(20,40);
 bubbles.push({x:x+R(-30,30),y:y+R(-20,20),vx:R(-60,60),vy:R(-110,-50),r,ph:R(0,6),age:0,life:R(5,8),q:0,qv:0,cargo:null,born:i*.07})}
 ping(3,.08);ping(6,.06)}
function popBubble(b){b.dead=1;sparkle(b.x,b.y,8,120,[8,16]);ring(b.x,b.y,'#ffffff',b.r*1.3);ping(7,.05);
 for(let i=0;i<8;i++){const a=i/8*Math.PI*2;parts.push({dot:'#ffffffcc',x:b.x+Math.cos(a)*b.r,y:b.y+Math.sin(a)*b.r,vx:Math.cos(a)*90,vy:Math.sin(a)*90,g:0,drag:4,life:.35,age:0,sz:3})}
 if(b.cargo){const s=b.cargo;s.bub=null;s.vx=R(-60,60);s.vy=-60;s.floor=R(HOR+60,GND-20)}}
// spells -----------------------------------------------------------
function doSpell(id,x,y){
 if(id==='flower')growFlower(x,groundY(x,y));
 else if(id==='mush')growMush(x,groundY(x,y));
 else if(id==='star')castStars(x,y);
 else if(id==='rain')castRain(x,y);
 else if(id==='bubble')castBubbles(x,y);}
function cast(x,y,id){
 id=id||SPELLS[spell].id;ac();if(AC&&AC.state==='suspended')AC.resume();
 kit.face=x<kit.x-20?-1:1;kit.cast=0;kit.ct=0;kit.target={x,y,id,fired:false};kit.idle=0;ring(x,y,'#ffffffaa',26)}
function wandTip(){const fr=Math.min(7,Math.max(0,Math.floor(kit.cast)));const rel=META.cast.rel[fr>=5?2:fr>=4?1:0];
 const kx=kit.x+(rel[0]-META.cast.nose)*KS*kit.face,ky=kit.y-(META.cast.ground-rel[1])*KS;return[kx,ky]}
// ---------- update
function update(dt){T+=dt;
 // kit
 if(kit.cast>=0){kit.cast+=dt*14;
  if(kit.target&&!kit.target.fired&&kit.cast>=4){kit.target.fired=true;const [tx,ty]=wandTip();const t=kit.target;
   bolts.push({x0:tx,y0:ty,x1:t.x,y1:t.y,id:t.id,t:0,dur:.22+Math.hypot(t.x-tx,t.y-ty)/2600});sparkle(tx,ty,6,90,[8,16]);chime(1568,.15,'sine',.05)}
  if(kit.cast>=8)kit.cast=-1}
 else{kit.idle+=dt}
 spring(kit,0,'hs','hv',1,dt,220,14);
 // bolts
 for(const b of bolts){b.t+=dt/b.dur;const k=Math.min(1,b.t),e=k*k*(3-2*k);const x=b.x0+(b.x1-b.x0)*e,y=b.y0+(b.y1-b.y0)*e-Math.sin(k*Math.PI)*60;
  b.x=x;b.y=y;if(Math.random()<.9)parts.push({img:'f6',x,y,vx:R(-30,30),vy:R(-30,30),g:20,drag:3,life:.45,age:0,sz:R(6,12),rot:0,vr:2,tw:1});
  if(b.t>=1){b.dead=1;doSpell(b.id,b.x1,b.y1)}}
 // plants
 for(const p of plants){if(T<p.born)continue;if(!p.bornDone){p.bornDone=1;p.sv=6.5;p.onborn&&p.onborn()}
  spring(p,0,'sc','sv',p.st,dt,150,9);spring(p,0,'rot','rv',0,dt,90,5);spring(p,0,'q','qv',0,dt,260,10);}
 // stars
 for(const s of stars){s.life+=dt;
  if(s.bub){s.x=s.bub.x;s.y=s.bub.y;s.rot+=dt*1.5;continue}
  const py=s.y;s.vy+=520*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.rot+=s.vr*dt;s.vx*=1-.3*dt;
  if(s.x<20||s.x>W-20){s.vx*=-.7;s.x=clamp(s.x,20,W-20)}
  if(s.vy>0){ // mushroom trampoline
   for(const p of plants){if(p.kind!=='mush'||p.sc<.5)continue;const top=plantTop(p)+p.hh*p.sc*.12;
    if(py<=top&&s.y>top&&Math.abs(s.x-p.x)<p.ww*p.sc*.48&&s.floor>p.y-6){s.y=top;s.vy=-Math.max(380,Math.abs(s.vy)*1.05)-60;s.vx+=(s.x-p.x)*2;p.qv+=7;p.rv+=(s.x>p.x?-1:1)*1.2;
     sparkle(s.x,top,7,140,[8,16]);ping(4+(s.bounces%4),.07);s.bounces++;break}}
   // flower brush
   for(const p of plants){if(p.kind!=='flower'||p.sc<.5)continue;const top=plantTop(p);
    if(s.y>top&&s.y<top+p.hh*.4&&Math.abs(s.x-p.x)<p.ww*.4&&Math.abs(s.floor-p.y)<40&&!s['f'+plants.indexOf(p)]){s['f'+plants.indexOf(p)]=1;p.rv+=(s.vx>0?1:-1)*2.4;petals(p.x,top+10,3);ping(6,.05)}}}
  if(s.y>=s.floor&&s.vy>0){s.y=s.floor;s.bounces++;
   if(Math.abs(s.vy)>170&&s.bounces<4){s.vy*=-.42;s.vx*=.7;dust(s.x,s.y,4,'#fff3c4');s.sq=.35}
   else{s.dead=1;sparkle(s.x,s.y-6,6,90,[8,15]);
    const near=plants.some(p=>Math.abs(p.x-s.x)<55&&Math.abs(p.y-s.y)<35);
    if(!near&&Math.random()<.45){const p=addPlant(3,s.x,s.y,.05,1);p.onborn=()=>{dust(p.x,p.y,6,'#d9f1c0')}}}}
  s.sq*=Math.exp(-dt*8)}
 // clouds
 for(const c of clouds){c.age+=dt;c.x+=c.vx*dt;spring(c,0,'sc','sv',c.age<c.life-.6?1:0,dt,90,9);spring(c,0,'q','qv',0,dt,160,8);
  if(c.age>.25&&c.age<c.life-.6){c.acc+=dt*26;while(c.acc>1){c.acc--;const x=c.x+R(-70,70);
   // bias drops onto plants under the cloud so watering is visible
   const under=plants.filter(p=>Math.abs(p.x-c.x)<95);let fl=R(HOR+30,GND);if(under.length&&Math.random()<.55){const p=under[Math.floor(R(0,under.length))];fl=p.y-2}
   drops.push({x,y:c.y+20,vy:R(260,330),floor:fl,col:RAINC[(c.ci++)%RAINC.length]})}}
  if(Math.random()<dt*2.2)c.qv+=R(-2,2);if(c.age>c.life)c.dead=1}
 for(const d of drops){d.y+=d.vy*dt;d.vy+=500*dt;
  for(const b of bubbles){if(!b.dead&&T>b.born&&Math.hypot(d.x-b.x,d.y-b.y)<b.r){popBubble(b);d.dead=1}}
  if(d.y>=d.floor){d.dead=1;for(let i=0;i<3;i++)parts.push({dot:d.col,x:d.x,y:d.floor,vx:R(-60,60),vy:R(-90,-30),g:400,drag:1,life:.35,age:0,sz:2.5});
   for(const p of plants){if(T<p.born)continue;if(Math.abs(d.x-p.x)<p.ww*p.sc*.42&&Math.abs(d.floor-p.y)<14){p.wet+=1;p.qv+=1.2;
     if(p.kind==='sprout'&&p.wet>=4){bloom(p);p.wet=0}
     else if(p.kind==='flower'&&p.wet>=6){p.wet=0;if(p.st<1.6){p.st+=.2;popPlant(p,.6);petals(p.x,plantTop(p)+10,4);ping(3+Math.floor(p.st*3),.07)}}
     else if(p.kind==='mush'&&p.wet>=5){p.wet=0;waterMush(p)}
     break}}}}
 // bubbles
 for(const b of bubbles){if(b.dead||T<b.born)continue;b.age+=dt;b.x+=b.vx*dt+Math.sin(T*2+b.ph)*18*dt;b.y+=b.vy*dt;b.vx*=1-.4*dt;b.vy=Math.max(b.vy-8*dt,-90);
  spring(b,0,'q','qv',0,dt,120,4);
  if(!b.cargo)for(const s of stars){if(!s.dead&&!s.bub&&Math.hypot(s.x-b.x,s.y-b.y)<b.r+s.sz*.3){s.bub=b;b.cargo=s;b.qv+=5;b.vy=-70;ping(7,.07);ping(5,.05);break}}
  for(const p of plants){if(p.kind==='flower'&&!b['p'+plants.indexOf(p)]&&Math.abs(b.x-p.x)<p.ww*.45&&b.y>plantTop(p)&&b.y<plantTop(p)+p.hh*.45){b['p'+plants.indexOf(p)]=1;p.rv+=1.5;petals(p.x,plantTop(p)+12,3);b.qv+=3}}
  for(const o of bubbles){if(o!==b&&!o.dead&&T>o.born){const dx=o.x-b.x,dy=o.y-b.y,dd=Math.hypot(dx,dy),m=b.r+o.r;if(dd<m&&dd>0){const k=(m-dd)/dd*.5;b.x-=dx*k;b.y-=dy*k;o.x+=dx*k;o.y+=dy*k;b.qv+=.4}}}
  if(b.y<b.r+10||b.age>b.life)popBubble(b)}
 // particles
 for(const p of parts){p.age+=dt;p.vy+=p.g*dt;const dr=Math.exp(-p.drag*dt);p.vx*=dr;p.vy*=dr;
  if(p.flut){p.vx+=Math.sin(p.age*p.flut*2+p.rot)*40*dt}p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=(p.vr||0)*dt;if(p.age>p.life)p.dead=1}
 for(const r of rings){r.age+=dt;if(r.age>r.life)r.dead=1}
 for(const A of [stars,bubbles,clouds,drops,parts,bolts,rings]){for(let i=A.length-1;i>=0;i--)if(A[i].dead)A.splice(i,1)}
 // cap counts so it stays light
 if(plants.length>34){const p=plants.find(q=>q.kind!=='mush')||plants[0];plants.splice(plants.indexOf(p),1)}
 if(parts.length>700)parts.splice(0,parts.length-700);
 // idle: kit casts by itself sometimes
 if(kit.cast<0&&kit.idle>7&&!window.__noIdle){kit.idle=0;const ids=['star','bubble','flower'];cast(R(420,1000),R(HOR+60,GND-30),ids[Math.floor(R(0,3))])}
}
// ---------- draw
function img(k,x,y,w,h,ax=.5,ay=.5,rot=0,sx=1,sy=1,a=1){const im=IMG[k];if(!im)return;cx.save();cx.globalAlpha=a;cx.translate(x,y);if(rot)cx.rotate(rot);cx.scale(sx,sy);cx.drawImage(im,-w*ax,-h*ay,w,h);cx.restore()}
function shadow(x,y,w,a=.18){cx.save();cx.globalAlpha=a;cx.fillStyle='#5b6b3a';cx.beginPath();cx.ellipse(x,y,w,w*.22,0,0,Math.PI*2);cx.fill();cx.restore()}
function drawPlant(p){if(T<p.born||p.sc<.01)return;const sway=Math.sin(T*1.4+p.ph)*.035+p.rot*.12;
 const sx=p.sc*(1+p.q*.08),sy=p.sc*(1-p.q*.1);shadow(p.x,p.y,p.ww*.38*p.sc);
 img('g'+p.g,p.x,p.y+3,p.ww,p.hh,.5,.98,sway,sx,sy)}
function drawKit(){const fr=kit.cast>=0?Math.min(7,Math.floor(kit.cast)):0;const m=META.cast;const im=IMG.kit;if(!im)return;
 const breath=kit.cast<0?Math.sin(T*2.4)*.012:0;shadow(kit.x,kit.y,62,.2);
 cx.save();cx.translate(kit.x,kit.y);cx.scale(kit.face*KS*(1-breath*.5),KS*(1+breath));
 cx.drawImage(im,fr*m.w,0,m.w,m.h,-m.nose,-m.ground,m.w,m.h);cx.restore()}
function draw(){cx.setTransform(DPR,0,0,DPR,0,0);
 const bg=IMG.bg;if(bg){const s=Math.max(W/bg.width,H/bg.height);cx.drawImage(bg,(W-bg.width*s)/2,(H-bg.height*s)/2,bg.width*s,bg.height*s)}
 // drifting fireflies
 cx.save();for(let i=0;i<18;i++){const x=(i*173+T*(8+i%5*3))%W,y=HOR-40+Math.sin(T*.7+i)*60+(i%6)*35;cx.globalAlpha=.25+.25*Math.sin(T*2+i);cx.fillStyle='#fff7c8';cx.beginPath();cx.arc(x,y,2.2,0,7);cx.fill()}cx.restore();
 for(const c of clouds){if(c.sc<.02)continue;const w=190*c.sc,h=w*262/388;img('f3',c.x,c.y,w,h,.5,.55,Math.sin(T*1.6)*.03,1+c.q*.05,1-c.q*.05,.95)}
 for(const d of drops){cx.save();cx.globalAlpha=.85;cx.fillStyle=d.col;cx.beginPath();cx.ellipse(d.x,d.y,3.4,9,0,0,7);cx.fill();cx.restore()}
 // depth sorted: plants, kit, ground stars
 const L=[];for(const p of plants)L.push([p.y,()=>drawPlant(p)]);L.push([kit.y,drawKit]);
 L.sort((a,b)=>a[0]-b[0]);for(const l of L)l[1]();
 for(const r of rings){const k=r.age/r.life;cx.save();cx.globalAlpha=(1-k)*.8;cx.strokeStyle=r.col;cx.lineWidth=4*(1-k)+1;cx.beginPath();cx.ellipse(r.x,r.y,r.r*(.3+k),r.r*(.3+k)*.38,0,0,7);cx.stroke();cx.restore()}
 for(const s of stars){const sz=s.sz*(s.img==='f0'?1.25:1);if(!s.bub&&s.floor)shadow(s.x,s.floor,sz*.3*clamp(1-(s.floor-s.y)/300,.2,1),.14);
  img(s.img,s.x,s.y,sz,sz*(s.img==='f0'?375/398:1),.5,.5,s.img==='f0'?Math.sin(s.rot)*.3:s.rot,1+s.sq*.4,1-s.sq)}
 for(const b of bubbles){if(b.dead||T<b.born)continue;const k=Math.min(1,(T-b.born)*5);const wob=Math.sin(T*5+b.ph)*.05+b.q*.06;
  img('f2',b.x,b.y,b.r*2*k,b.r*2*k*286/402*1.25,.5,.5,0,1+wob,1-wob,.9)}
 for(const p of parts){const k=p.age/p.life,a=k<.15?k/.15:1-Math.max(0,(k-.6)/.4);
  if(p.dot){cx.save();cx.globalAlpha=a;cx.fillStyle=p.dot;cx.beginPath();cx.arc(p.x,p.y,p.sz,0,7);cx.fill();cx.restore()}
  else{const tw=p.tw?(.7+.3*Math.sin(p.age*25)):1;const sz=p.sz*tw;const fm=META.fx[+p.img.slice(1)];img(p.img,p.x,p.y,sz,sz*fm[1]/fm[0],.5,.5,p.rot,1,1,a)}}
 for(const b of bolts){cx.save();const g=cx.createRadialGradient(b.x,b.y,0,b.x,b.y,22);g.addColorStop(0,'#fffbe0');g.addColorStop(.4,'#ffe28acc');g.addColorStop(1,'#ffe28a00');cx.fillStyle=g;cx.beginPath();cx.arc(b.x,b.y,22,0,7);cx.fill();cx.restore();img('f6',b.x,b.y,26,28,.5,.5,T*8)}
 // cursor hint at wand while idle
 if(kit.cast<0){const [tx,ty]=wandTip();cx.save();cx.globalAlpha=.5+.4*Math.sin(T*5);img('f6',tx,ty,14,15,.5,.5,T*2);cx.restore()}
}
// ---------- input / UI
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
 if(Math.abs(x-kit.x)<60&&y>kit.y-220&&y<kit.y+10){kit.hv-=3;ac();sparkle(kit.x,kit.y-200,10,120);ping(7,.08);return}
 cast(x,y)});
const bar=document.getElementById('bar');
SPELLS.forEach((s,i)=>{const b=document.createElement('button');b.innerHTML=`<kbd>${i+1}</kbd><img alt=""><span>${s.name}</span>`;b.onclick=()=>setSpell(i);bar.appendChild(b);s.btn=b});
function setSpell(i){spell=i;SPELLS.forEach((s,j)=>s.btn.classList.toggle('on',j===i));ac();ping(i*2,.06)}
addEventListener('keydown',e=>{const n=+e.key;if(n>=1&&n<=5)setSpell(n-1)});
// ---------- boot
let last=0;
function frame(ts){const dt=Math.min(.05,last?(ts-last)/1000:1/60);last=ts;update(dt);draw();requestAnimationFrame(frame)}
let left=Object.keys(SRC).length;
for(const k in SRC){const im=new Image();im.onload=()=>{IMG[k]=im;if(--left===0)start()};im.src=SRC[k]}
function start(){SPELLS.forEach(s=>s.btn.querySelector('img').src=IMG[s.icon].src);setSpell(0);
 // a little garden to start with
 addPlant(1,880,560,.2).onborn=()=>{};addPlant(4,1040,610,.35);addPlant(3,620,505,.5);
 window.__api={cast,setSpell,kit,plants};requestAnimationFrame(frame)}
