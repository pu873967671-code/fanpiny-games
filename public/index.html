function layout(){
  const vw=innerWidth,vh=innerHeight;
  sc=Math.max(vw/W,vh/H);
  minX=vw-W*sc;minY=vh-H*sc;
  if(first){ox=minX/2;oy=minY/2;first=false}
  clampPan();
  pet.width=vw*devicePixelRatio;pet.height=vh*devicePixelRatio;
  $('#hint').style.display='block';
}
let first=true;
function clampPan(){ox=Math.min(0,Math.max(minX,ox));oy=Math.min(0,Math.max(minY,oy));world.style.transform=`translate(${ox}px,${oy}px) scale(${sc})`}
addEventListener('resize',()=>{layout();placeSign()});
const toWorld=(x,y)=>[(x-ox)/sc,(y-oy)/sc];

// 狐兔
const K={x:HOME[0],y:HOME[1],path:[],dir:1,t:0,frame:0,hop:0,state:'idle',target:null,speed:270};
function drawKit(dt){
  K.t+=dt;
  if(K.path.length){
    const [tx,ty]=K.path[0];const dx=tx-K.x,dy=ty-K.y,d=Math.hypot(dx,dy),step=K.speed*dt;
    if(Math.abs(dx)>2)K.dir=dx>0?1:-1;
    if(d<=step){K.x=tx;K.y=ty;K.path.shift();if(!K.path.length)arrive()}
    else{K.x+=dx/d*step;K.y+=dy/d*step}
    K.frame=(K.frame+dt*11)%8;
    if(rnd()<dt*7)puff(K.x-K.dir*20,K.y-4,1);
  }else{K.frame=0}
  K.hop=Math.max(0,K.hop-dt);
  const hopY=K.hop>0?-Math.sin((1-K.hop/0.45)*Math.PI)*36:0;
  const walking=K.path.length>0;
  const bob=walking?-Math.abs(Math.sin(K.t*11*Math.PI/4))*3:0;
  const breathe=walking?1:1+Math.sin(K.t*2.6)*0.018;
  kit.style.left=K.x+'px';kit.style.top=K.y+'px';kit.style.zIndex=Math.round(K.y);
  kimg.style.backgroundPosition=`${Math.floor(K.frame)/7*100}% 0`;
  kimg.style.transform=`translateY(${hopY+bob}px) scale(${K.dir*(2-breathe)},${breathe})`;
  shadow.style.left=K.x+'px';shadow.style.top=K.y+'px';shadow.style.zIndex=Math.round(K.y)-1;
  shadow.style.transform=`scale(${1+hopY/120})`;
}
function walkTo(p){
  K.target=p;K.state='walk';
  const [sx,sy]=p.door;
  if(reduced){K.x=sx;K.y=sy;drawKit(0);openGame(p);return}
  // 简单路径：先走到小镇中间的小路口，再去目的地（目的地就在旁边时直接走）
  const near=Math.hypot(sx-K.x,sy-K.y)<260;
  K.path=near?[[sx,sy]]:[[HOME[0],HOME[1]],...(p.via||[]),[sx,sy]];
  if(!near&&Math.hypot(K.x-HOME[0],K.y-HOME[1])<30)K.path.shift();
  follow=true;
}
function arrive(){
  const p=K.target;if(!p)return;
  K.hop=0.45;K.dir=p.cx>K.x?1:-1;
  hearts(K.x,K.y-120,5);
  setTimeout(()=>openGame(p),430);
}

// 拖动 / 点击
let down=null,moved=false,follow=false, velocityX=0, velocityY=0, inertia=0;
view.addEventListener('pointerdown',e=>{cancelAnimationFrame(inertia);velocityX=velocityY=0;down={x:e.clientX,y:e.clientY,ox,oy,lastX:e.clientX,lastY:e.clientY,time:performance.now()};moved=false;follow=false});
addEventListener('pointermove',e=>{
  if(down){const dx=e.clientX-down.x,dy=e.clientY-down.y;
    if(!moved&&Math.hypot(dx,dy)>8){moved=true;view.classList.add('drag')}
    if(moved){const now=performance.now(),delta=Math.max(1,now-down.time);velocityX=(e.clientX-down.lastX)/delta*16;velocityY=(e.clientY-down.lastY)/delta*16;down.lastX=e.clientX;down.lastY=e.clientY;down.time=now;ox=down.ox+dx;oy=down.oy+dy;clampPan();placeSign()}}
  if(e.pointerType==='mouse'&&!down)hoverAt(e.clientX,e.clientY);
});
addEventListener('pointerup',e=>{
  if(down&&!moved)tapAt(e.clientX,e.clientY,e.pointerType);
  if(down&&moved&&!reduced){const coast=()=>{velocityX*=.92;velocityY*=.92;ox+=velocityX;oy+=velocityY;clampPan();placeSign();if(Math.hypot(velocityX,velocityY)>.2)inertia=requestAnimationFrame(coast)};inertia=requestAnimationFrame(coast)}
  down=null;view.classList.remove('drag');
});
addEventListener('pointercancel',()=>{down=null;view.classList.remove('drag')});
function placeAt(x,y){
  const el=document.elementFromPoint(x,y);
  const b=el&&el.closest&&el.closest('.bld');
  return b?PLACES.find(p=>p.id===b.dataset.id):null;
}
let hot=null,busy=false;
function setHot(p){
  if(hot===p)return;
  if(hot){hot.el.classList.remove('hot');hot.ring.classList.remove('on')}
  hot=p;
  if(p){p.el.classList.add('hot');p.ring.classList.add('on');sparkle(p.cx,p.by-p.h*0.6,10)}
  showSign(p);
}
function hoverAt(x,y){if(busy)return;if(K.state==='walk')return;setHot(placeAt(x,y))}
function tapAt(x,y,type){
  if(busy)return;
  const el=document.elementFromPoint(x,y);
  if(el&&el.closest&&el.closest('#kit')){K.hop=0.45;hearts(K.x,K.y-120,4);return}
  const p=placeAt(x,y);
  if(p){setHot(p);walkTo(p);return}
  if(K.state!=='walk')setHot(null);
  const [wx,wy]=toWorld(x,y);sparkle(wx,wy,6);
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&busy){closeGame();return}
  if((e.key==='Enter'||e.key===' ')&&document.activeElement&&document.activeElement.classList.contains('bld')){
    const p=PLACES.find(q=>q.id===document.activeElement.dataset.id);if(p&&!busy){setHot(p);walkTo(p)}e.preventDefault()}
});
for(const p of PLACES){p.el.addEventListener('focus',()=>{if(!busy&&K.state!=='walk')setHot(p)})}

// 木牌
function showSign(p){
  if(!p){sign.classList.remove('on');return}
  sign.querySelector('b').textContent=p.title;sign.querySelector('span').textContent=p.line;
  sign.classList.remove('on');void sign.offsetWidth;sign.classList.add('on');placeSign();
}
function placeSign(){
  if(!hot)return;const p=hot;
  const sw=250,sh=163,vw=innerWidth,vh=innerHeight;
  let x=ox+p.cx*sc-sw/2, y=oy+(p.by-p.h)*sc-sh+18;
  if(y<70){                                  // 上面放不下：挂到房子旁边（右边优先），再不行挂下面
    const bx=ox+p.cx*sc, half=p.w*sc/2, my=oy+(p.by-p.h*.55)*sc-sh/2;
    if(bx+half+sw+8<vw){x=bx+half*0.8;y=my}
    else if(bx-half-sw-8>0){x=bx-half*0.8-sw;y=my}
    else y=oy+p.by*sc-10;
  }
  y=Math.max(6,Math.min(vh-sh-6,y));
  x=Math.max(6,Math.min(vw-sw-6,x));
  sign.style.left=x+'px';sign.style.top=y+'px';
}

// 转场 + 游戏
let circleAt=[0,0];
function openGame(p){
  history.pushState({townWork:p.id},'', '?work='+encodeURIComponent(p.id));
  busy=true;setHot(p);
  const sx=ox+K.x*sc,sy=oy+(K.y-60)*sc;circleAt=[sx,sy];
  const R=Math.hypot(Math.max(sx,innerWidth-sx),Math.max(sy,innerHeight-sy))+10;
  frame.src=p.href;
  veil.animate([{clipPath:`circle(0px at ${sx}px ${sy}px)`},{clipPath:`circle(${R}px at ${sx}px ${sy}px)`}],{duration:reduced?1:620,easing:'cubic-bezier(.55,0,.35,1)',fill:'forwards'});
  setTimeout(()=>{
    game.style.display='block';back.style.display='block';
    const cx=innerWidth/2,cy=innerHeight/2,R2=Math.hypot(cx,cy)+10;
    game.animate([{clipPath:`circle(0px at ${cx}px ${cy}px)`},{clipPath:`circle(${R2}px at ${cx}px ${cy}px)`}],{duration:reduced?1:560,easing:'cubic-bezier(.3,0,.2,1)',fill:'forwards'});
    back.classList.remove('mini');clearTimeout(miniT);miniT=setTimeout(()=>back.classList.add('mini'),2600);
    back.animate([{transform:'translateX(-160px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:520,delay:300,easing:'ease-out',fill:'backwards'});
    sign.classList.remove('on');
  },reduced?1:650);
  K.state='in';
}
frame.addEventListener('load',()=>{
  try{const w=frame.contentWindow;w.addEventListener('keydown',e=>{if(e.key==='Escape')closeGame()});}catch(e){}
});
function closeGame(fromHistory=false){
  if(!busy||closing)return;
  if(!fromHistory && history.state && history.state.townWork){history.back();return}
  closing=true;
  const cx=innerWidth/2,cy=innerHeight/2,R2=Math.hypot(cx,cy)+10;
  back.style.display='none';
  game.animate([{clipPath:`circle(${R2}px at ${cx}px ${cy}px)`},{clipPath:`circle(0px at ${cx}px ${cy}px)`}],{duration:reduced?1:480,easing:'cubic-bezier(.6,0,.4,1)',fill:'forwards'});
  setTimeout(()=>{
    game.style.display='none';frame.src='about:blank';
    const [sx,sy]=circleAt,R=Math.hypot(Math.max(sx,innerWidth-sx),Math.max(sy,innerHeight-sy))+10;
    veil.animate([{clipPath:`circle(${R}px at ${sx}px ${sy}px)`},{clipPath:`circle(0px at ${sx}px ${sy}px)`}],{duration:reduced?1:620,easing:'cubic-bezier(.55,0,.35,1)',fill:'forwards'});
    setHot(null);K.state='idle';K.target=null;
    setTimeout(()=>{busy=false;closing=false;K.hop=0.45;hearts(K.x,K.y-120,6);window.focus()},reduced?1:600);
  },reduced?1:500);
}
let closing=false,miniT=0;
back.addEventListener('click',()=>closeGame());
addEventListener('popstate',()=>{if(busy)closeGame(true)});

// 粒子：炊烟、尘土、星光、爱心（世界坐标）
const parts=[];
function puff(x,y,n){for(let i=0;i<n;i++)parts.push({k:'dust',x,y,vx:(rnd()-.5)*30,vy:-10-rnd()*15,l:0,L:.6,r:6+rnd()*5})}
function sparkle(x,y,n){for(let i=0;i<n;i++){const a=rnd()*6.28,s=60+rnd()*120;parts.push({k:'star',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,l:0,L:.7+rnd()*.4,r:5+rnd()*5,c:['#fff6b0','#ffd1e0','#c8f0ff','#fff'][i%4]})}}
function hearts(x,y,n){for(let i=0;i<n;i++)parts.push({k:'heart',x:x+(rnd()-.5)*40,y,vx:(rnd()-.5)*60,vy:-70-rnd()*60,l:-i*.08,L:1.2,r:9+rnd()*5})}
function heartPath(c,x,y,r){c.beginPath();c.moveTo(x,y+r*.35);c.bezierCurveTo(x-r*1.1,y-r*.4,x-r*.5,y-r*1.1,x,y-r*.45);c.bezierCurveTo(x+r*.5,y-r*1.1,x+r*1.1,y-r*.4,x,y+r*.35);c.fill()}
let smokeT=0,twT=0;
function stepFx(dt,t){
  smokeT+=dt;
  if(smokeT>.22){smokeT=0;for(const p of PLACES)if(p.smoke){
    const sx=p.cx-p.w/2+p.w*p.smoke[0],sy=p.by-p.h+p.h*p.smoke[1];
    parts.push({k:'smoke',x:sx,y:sy,vx:6+rnd()*6,vy:-22-rnd()*10,l:0,L:3.2,r:8+rnd()*4})}}
  for(const p of PLACES)if(p.glow&&rnd()<dt*3.2){const a=rnd()*6.28,r=p.w*(.32+rnd()*.25);
    parts.push({k:'mote',x:p.cx+Math.cos(a)*r,y:p.by-p.h*p.glow[1]+Math.sin(a)*r*.7,vx:(rnd()-.5)*8,vy:-8-rnd()*10,l:0,L:1.6+rnd(),r:2.5+rnd()*2.5})}
  for(const p of PLACES)if(p.chips&&rnd()<dt*2.2){const c=['#ff8a80','#ffc46b','#ffe66d','#8fd694','#7fb8f0','#c39bf0'][Math.floor(rnd()*6)];
    parts.push({k:'chip',x:p.cx-p.w/2+p.w*(p.chips[0]+(rnd()-.5)*.5),y:p.by-p.h+p.h*p.chips[1],vx:(rnd()-.5)*30,vy:-30-rnd()*25,l:0,L:1.8+rnd()*.6,r:3+rnd()*2.5,c,rot:rnd()*6})}
  twT+=dt;if(twT>.18){twT=0;parts.push({k:'tw',x:580+rnd()*170,y:310+rnd()*55,vx:0,vy:0,l:0,L:.9,r:3+rnd()*3})}
  fc.clearRect(0,0,W,H);
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.l+=dt;if(q.l>=q.L){parts.splice(i,1);continue}if(q.l<0)continue;
    const u=q.l/q.L;q.x+=q.vx*dt;q.y+=q.vy*dt;
    if(q.k==='smoke'){q.vx+=4*dt;const r=q.r*(1+u*2.4);const g=fc.createRadialGradient(q.x,q.y,0,q.x,q.y,r);
      const a=.42*Math.sin(u*Math.PI);g.addColorStop(0,`rgba(250,250,252,${a})`);g.addColorStop(1,'rgba(250,250,252,0)');fc.fillStyle=g;fc.fillRect(q.x-r,q.y-r,2*r,2*r)}
    else if(q.k==='dust'){fc.fillStyle=`rgba(225,200,150,${.5*(1-u)})`;fc.beginPath();fc.arc(q.x,q.y,q.r*(1+u),0,7);fc.fill()}
    else if(q.k==='star'){q.vx*=.94;q.vy*=.94;const r=q.r*(1-u*.6);fc.fillStyle=q.c;fc.globalAlpha=1-u;fc.save();fc.translate(q.x,q.y);fc.rotate(u*3);
      fc.beginPath();for(let j=0;j<8;j++){const rr=j%2?r*.38:r;fc.lineTo(Math.cos(j*Math.PI/4)*rr,Math.sin(j*Math.PI/4)*rr)}fc.fill();fc.restore();fc.globalAlpha=1}
    else if(q.k==='heart'){q.vy+=40*dt;fc.globalAlpha=Math.min(1,(1-u)*2);fc.fillStyle='#ff8fb1';heartPath(fc,q.x,q.y,q.r*(0.6+Math.min(1,u*4)*.4));fc.globalAlpha=1}
    else if(q.k==='mote'){const a=Math.sin(u*Math.PI);fc.globalAlpha=a;fc.fillStyle=u<.5?'#fff3b0':'#e7d4ff';fc.save();fc.translate(q.x,q.y);fc.rotate(u*2);
      fc.beginPath();for(let j=0;j<8;j++){const rr=j%2?q.r*.35:q.r;fc.lineTo(Math.cos(j*Math.PI/4)*rr,Math.sin(j*Math.PI/4)*rr)}fc.fill();fc.restore();fc.globalAlpha=1}
    else if(q.k==='chip'){q.vy+=60*dt;q.vx*=.98;fc.globalAlpha=Math.min(1,(1-u)*2.5);fc.fillStyle=q.c;fc.save();fc.translate(q.x,q.y);fc.rotate(q.rot+u*5);
      fc.beginPath();fc.moveTo(-q.r,0);fc.quadraticCurveTo(0,-q.r*1.1,q.r,0);fc.quadraticCurveTo(0,q.r*.5,-q.r,0);fc.fill();fc.restore();fc.globalAlpha=1}
    else if(q.k==='tw'){fc.globalAlpha=Math.sin(u*Math.PI);fc.fillStyle='#fff';fc.beginPath();fc.arc(q.x,q.y,q.r*Math.sin(u*Math.PI),0,7);fc.fill();fc.globalAlpha=1}
  }
  for(const c of clouds){c.x+=c.v*dt;if(c.x>W+200)c.x=-c.s-200;c.el.style.transform=`translate(${c.x}px,${c.y+Math.sin(t*.1+c.s)*20}px)`}
}
// 花瓣（屏幕坐标）
const petals=[];
for(let i=0;i<26;i++)petals.push(newPetal(true));
function newPetal(init){return{x:rnd()*innerWidth,y:init?rnd()*innerHeight:-20,vy:22+rnd()*26,ph:rnd()*6,sp:.8+rnd()*1.2,r:5+rnd()*4,rot:rnd()*6,c:['#ffc4d6','#ffd9e4','#fff1f5','#ffe2a8'][Math.floor(rnd()*4)]}}
function stepPetals(dt,t){
  const d=devicePixelRatio;pc.setTransform(d,0,0,d,0,0);pc.clearRect(0,0,innerWidth,innerHeight);
  for(const p of petals){p.y+=p.vy*dt;p.x+=Math.sin(t*p.sp+p.ph)*24*dt+10*dt;p.rot+=dt*p.sp;
    if(p.y>innerHeight+20||p.x>innerWidth+20)Object.assign(p,newPetal(false),{x:rnd()*innerWidth*1.1-40});
    pc.save();pc.translate(p.x,p.y);pc.rotate(p.rot);pc.scale(1,.55+.45*Math.sin(t*p.sp*2+p.ph));pc.fillStyle=p.c;pc.globalAlpha=.85;
    pc.beginPath();pc.ellipse(0,0,p.r,p.r*.62,0,0,7);pc.fill();pc.restore()}
}
// 狐兔走动时镜头跟随（拖动后停止跟随）
function followCam(dt){
  if(!follow||!K.path.length)return;
  const tx=innerWidth/2-K.x*sc,ty=innerHeight*0.55-K.y*sc;
  ox+=(tx-ox)*Math.min(1,dt*2.2);oy+=(ty-oy)*Math.min(1,dt*2.2);clampPan();placeSign();
}
// 主循环
let last=performance.now(),T=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  if(!busy||K.state!=='in'){drawKit(dt);if(!reduced)stepFx(dt,T);followCam(dt)}
  if(!reduced)stepPetals(dt,T);
  requestAnimationFrame(loop);
}
layout();requestAnimationFrame(loop);
// 竖屏：开场从左边慢慢平移到中间，让人知道小镇可以拖
if(minX<-200&&!DEMO&&!reduced){const end=ox;ox=0;clampPan();const t0=performance.now();
  (function intro(n){if(down||moved)return;const u=Math.min(1,(n-t0-600)/2600);if(u>0){ox=end*(u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2);clampPan()}if(u<1)requestAnimationFrame(intro)})(t0)}
// 演示用的假鼠标
if(DEMO){const c=$('#cursor');c.style.display='block';
  window.__cur=(x,y,dn)=>{c.style.left=x+'px';c.style.top=y+'px';c.classList.toggle('dn',!!dn)};
  addEventListener('pointermove',e=>__cur(e.clientX,e.clientY));}
window.__town={PLACES,K,toScreen:(x,y)=>[ox+x*sc,oy+y*sc],openGame,closeGame};
})();
</script>
</body>
