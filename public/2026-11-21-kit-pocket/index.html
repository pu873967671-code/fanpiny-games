<div class="tag"><b>狐兔小小城</b><i>左右拖动转一转 · 点房子让它蹦 · 点下面换季节</i></div></div>
<script>
const META={"fw":382,"fh":375,"ax":191,"ay":371,"builds":[[378,394],[390,421],[388,381],[327,420],[388,398],[180,409],[338,386],[210,354]],"plate":[1737,859]};
const SRC={bg:'bg.webp',plate:'plate.webp',walk:'k_walk.webp'};
for(let i=0;i<8;i++)SRC['b'+i]='b_'+i+'.webp';
const W=1200,H=675,cv=document.getElementById('c'),g=cv.getContext('2d'),wrap=document.getElementById('wrap');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);wrap.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
const IM={};let loaded=0;const keys=Object.keys(SRC);
for(const k of keys){const i=new Image();i.onload=()=>{if(++loaded==keys.length)start()};i.src=SRC[k];IM[k]=i}
const CX=600,CY=438,RX=345,RY=128;
const SEAS=[{n:'春',tint:'#ffc6dc',a:.10,p:'petal'},{n:'夏',tint:'#fff2a8',a:.10,p:'firefly'},{n:'秋',tint:'#ff9a4a',a:.14,p:'leaf'},{n:'冬',tint:'#a8c8ff',a:.16,p:'snow'}];
let season=0,rot=0,vrot=.25,T=0,drag=null,parts=[],AC=null;
const bl=[ // idx,angle,height px
 {i:0,a:0.0,h:200},{i:1,a:.8,h:210},{i:2,a:1.55,h:190},{i:3,a:2.35,h:230},{i:4,a:3.1,h:215},{i:5,a:3.7,h:150},{i:6,a:4.45,h:95},{i:7,a:5.4,h:85},{i:4,a:5.95,h:160}
].map(o=>({...o,hop:0,vh:0,sq:0}));
const fox={a:2.0,f:0,ft:0,dir:1,jump:0,vj:0,pet:0};
function boop(f,d,t){if(!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();o.type=t||'triangle';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*1.5,n+d*.6);gn.gain.setValueAtTime(.15,n);gn.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(gn).connect(AC.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}
function start(){window.__api={bl,fox,setSeason:s=>{season=s},rot:()=>rot};requestAnimationFrame(loop)}
function emit(x,y,kind,n){for(let k=0;k<n;k++)parts.push({x,y,vx:(Math.random()-.5)*160,vy:-60-Math.random()*160,l:1.4+Math.random(),t:0,k:kind,r:4+Math.random()*5,rot:Math.random()*6})}
function proj(a,rad){const th=a+rot;return {x:CX+RX*rad*Math.sin(th),y:CY+RY*rad*Math.cos(th),d:Math.cos(th)}}
function step(dt){
  T+=dt;
  if(drag){}else{rot+=vrot*dt;vrot+=(.22-vrot)*dt*.6}
  fox.a+=dt*.55;fox.ft+=dt;while(fox.ft>.085){fox.ft-=.085;fox.f=(fox.f+1)%8}
  // fox direction: x derivative of sin(a+rot) wrt a = cos -> moving right when cos(th)>0 (front)
  fox.dir=Math.cos(fox.a+rot)>=0?1:-1;
  fox.vj-=1900*dt;fox.jump=Math.max(0,fox.jump+fox.vj*dt);if(fox.jump==0)fox.vj=0;
  for(const b of bl){b.vh+=(-b.hop*260-b.vh*6)*dt;b.hop+=b.vh*dt;}
  // season ambient
  const sp=SEAS[season].p;
  if(Math.random()<dt*(sp=='snow'?26:sp=='petal'?16:sp=='leaf'?10:6)){parts.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*40,vy:50+Math.random()*60,l:9,t:0,k:sp,r:3+Math.random()*4,rot:Math.random()*6,amb:1})}
  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.amb)p.vy+=300*dt;else p.vx+=Math.sin(T*2+p.rot)*30*dt}
  parts=parts.filter(p=>p.t<p.l&&p.y<H+20);
}
function drawPart(p){
  g.save();g.translate(p.x,p.y);g.rotate(p.rot+p.t*2);g.globalAlpha=Math.min(1,(p.l-p.t)*2);
  const k=p.k;
  if(k=='snow'){g.fillStyle='#fff';g.beginPath();g.arc(0,0,p.r,0,7);g.fill()}
  else if(k=='petal'){g.fillStyle='#ffb3cc';g.beginPath();g.ellipse(0,0,p.r*1.4,p.r*.8,0,0,7);g.fill()}
  else if(k=='leaf'){g.fillStyle=['#e8873a','#d9a23a','#c85a3a'][(p.r*7|0)%3];g.beginPath();g.ellipse(0,0,p.r*1.6,p.r*.9,0,0,7);g.fill()}
  else if(k=='firefly'){const gr=g.createRadialGradient(0,0,0,0,0,p.r*3);gr.addColorStop(0,'#fff9a0');gr.addColorStop(1,'#fff9a000');g.fillStyle=gr;g.beginPath();g.arc(0,0,p.r*3,0,7);g.fill()}
  else if(k=='star'){g.fillStyle='#ffd966';g.beginPath();g.arc(0,0,p.r,0,7);g.fill()}
  g.restore();
}
function draw(){
  g.clearRect(0,0,W,H);g.drawImage(IM.bg,0,0,W,H);
  // float bob
  const bob=Math.sin(T*1.2)*5;
  g.save();g.translate(0,bob);
  const pw=980,ph=pw*IM.plate.height/IM.plate.width;
  g.save();g.globalAlpha=.18;g.fillStyle='#6b4a3a';g.beginPath();g.ellipse(CX,CY+ph*.62,pw*.33,28,0,0,7);g.fill();g.restore();
  g.drawImage(IM.plate,CX-pw/2,CY-ph*.46,pw,ph);
  const items=bl.map(b=>({k:'b',b,p:proj(b.a,1)}));
  items.push({k:'f',p:proj(fox.a,1)});
  // fox walks slightly inside ring
  items.sort((u,v)=>u.p.y-v.p.y);
  for(const it of items){
    const p=it.p,sc=.72+.28*(p.d+1)/2*1.0+.06;
    if(it.k=='b'){const b=it.b,im=IM['b'+b.i],h=b.h*sc*(1+b.hop*.0),w=im.width/im.height*h;
      g.save();g.translate(p.x,p.y+4);g.globalAlpha=.2;g.fillStyle='#6b4a3a';g.beginPath();g.ellipse(0,0,w*.38,8*sc,0,0,7);g.fill();g.globalAlpha=1;
      const up=Math.max(0,b.hop)*40;const sq=1+b.hop*.25;
      g.translate(0,-up);g.scale(1/Math.sqrt(sq),sq);
      if(b.i==5&&true){}
      g.drawImage(im,-w/2,-h,w,h);g.restore();
      b._x=p.x;b._y=p.y;b._h=h;b._w=w;
    }else{
      const m=META,fw=m.fw,fh=m.fh,s=(150*sc)/fh;
      g.save();g.translate(p.x,p.y-fox.jump);g.scale(fox.dir*s,s);
      g.drawImage(IM.walk,fox.f*fw,0,fw,fh,-m.ax,-m.ay,fw,fh);g.restore();
      fox._x=p.x;fox._y=p.y-60*sc;fox._r=60*sc;
    }
  }
  g.restore();
  for(const p of parts)drawPart(p);
  const S=SEAS[season];g.save();g.globalCompositeOperation='multiply';g.globalAlpha=S.a*2.2;g.fillStyle=S.tint;g.fillRect(0,0,W,H);g.restore();
  // season buttons
  SEAS.forEach((s,i)=>{const x=470+i*70,y=612;g.save();g.fillStyle=i==season?'#fff8ecf2':'#fff8ec99';g.strokeStyle=i==season?'#e07a6a':'#c9a98c';g.lineWidth=3;g.beginPath();g.roundRect(x,y,60,44,16);g.fill();g.stroke();g.fillStyle=i==season?'#c25a48':'#8a6a55';g.font='28px zk, sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(s.n,x+30,y+24);g.restore()});
}
let last=0;
function loop(ts){
  if(window.__rec){step(1/30)}else{const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;step(dt)}
  draw();requestAnimationFrame(loop);
}
function pt(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function setSeason(i){season=i;const c=SEAS[i];for(let k=0;k<40;k++)parts.push({x:Math.random()*W,y:-10-Math.random()*200,vx:(Math.random()-.5)*60,vy:80+Math.random()*100,l:5,t:0,k:c.p,r:3+Math.random()*4,rot:Math.random()*6,amb:1});boop(400+i*120,.3,'sine')}
let down=null;
cv.addEventListener('pointerdown',e=>{
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(_){}}
  const p=pt(e);
  if(p.y>605&&p.x>=470&&p.x<750){const i=Math.floor((p.x-470)/70);if(p.x-470-i*70<=60){setSeason(i);return}}
  down={x:p.x,y:p.y,rot0:rot,t:T,moved:false};drag=true;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';
});
let lastX=0,lastT=0;
cv.addEventListener('pointermove',e=>{if(!down)return;const p=pt(e);if(Math.abs(p.x-down.x)>6)down.moved=true;
  const nr=down.rot0+(p.x-down.x)/RX;vrot=(nr-rot)/Math.max(.016,(performance.now()-lastT)/1000);lastT=performance.now();rot=nr;vrot=Math.max(-5,Math.min(5,vrot))});
function up(e){if(!down)return;if(!down.moved){hit(down.x,down.y)}drag=null;down=null;cv.style.cursor='grab'}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function hit(x,y){
  if(fox._x!==undefined&&Math.hypot(x-fox._x,y-fox._y)<fox._r){fox.vj=700;boop(700,.2);emit(fox._x,fox._y-40,'star',8);return}
  for(const b of [...bl].sort((u,v)=>v._y-u._y)){if(b._x!==undefined&&Math.abs(x-b._x)<b._w/2&&y<b._y+8&&y>b._y-b._h){b.vh=22;boop(300+b.i*60,.25);
     const kinds=['star','petal','leaf','star','petal','firefly','star','star'];emit(b._x,b._y-b._h*.8,kinds[b.i],12);return}}
}
</script></body></html>
