<div class="tag"><b>狐兔果冻鞋铺</b><i>拖一拖、甩一甩 · 点一下让它蹦 · 双击全体乱跳</i></div></div>
<script>
const META={"fw":452,"fh":452,"ax":226,"ay":448,"items":[[390,275],[384,239],[378,345],[404,256],[376,316],[398,249],[399,245],[357,359]]};
const SRC={bg:'bg.webp'};
for(let i=0;i<8;i++)SRC['s'+i]='items_'+i+'.webp';
SRC.j0='k_j0.webp';SRC.j1='k_j1.webp';
const W=1200,H=675,cv=document.getElementById('c'),g=cv.getContext('2d');
const wrap=document.getElementById('wrap');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);wrap.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
const IM={};let loaded=0;const keys=Object.keys(SRC);
for(const k of keys){const i=new Image();i.onload=()=>{if(++loaded==keys.length)start()};i.src=SRC[k];IM[k]=i}
let seed=1;const rnd=()=>Math.random();
const FLOOR_Y=610,FLOOR_TOP=400,WL=40,WR=1160;
const bodies=[];
let T=0,AC=null,drag=null,mouse={x:0,y:0,dx:0,dy:0};
function snd(v,pitch){if(!AC)return;try{const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();o.type='sine';const f=pitch||300;o.frequency.setValueAtTime(f*1.6,t);o.frequency.exponentialRampToValueAtTime(f*.6,t+.18);gn.gain.setValueAtTime(Math.min(.25,v),t);gn.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+.25)}catch(e){}}
function start(){
  for(let i=0;i<8;i++){
    const im=IM['s'+i],h=150,w=im.width/im.height*h;
    bodies.push({i,w,h,x:200+i*110+(i%2)*20,y:300+(i%3)*40,vx:0,vy:0,a:0,va:0,s:0,vs:0,dir:0,ph:rnd()*6,r:Math.max(w,h)*.38,rest:0});
  }
  window.__api={bodies,fox:()=>fox,mode:()=>fox.mode};
  requestAnimationFrame(loop);
}
const fox={x:1040,y:612,mode:'j0',f:0,ft:0,startle:0};
function impulseSquash(b,v,dx,dy){b.dir=Math.atan2(dy,dx);b.vs-=Math.min(v*.04,3.5);snd(Math.min(v/900,.3),180+b.i*40)}
function step(dt){
  T+=dt;
  for(const b of bodies){
    if(drag&&drag.b===b){
      const tx=mouse.x-drag.ox,ty=mouse.y-drag.oy;
      const dx=tx-b.x,dy=ty-b.y;
      b.vx+=dx*40*dt;b.vy+=dy*40*dt;b.vx*=Math.pow(.0008,dt);b.vy*=Math.pow(.0008,dt);
      const d=Math.hypot(dx,dy);b.dir=Math.atan2(dy,dx);
      b.vs+=((Math.min(d/110,1.6)-b.s)*160-b.vs*9)*dt;b.s+=b.vs*dt;
      b.va+=(-b.a*30-b.va*6)*dt;b.a+=b.va*dt;
      b.x+=b.vx*dt;b.y+=b.vy*dt;continue;
    }
    b.vy+=1500*dt;
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.va*dt;
    b.va+=(-b.a*14)*dt;b.va*=Math.pow(.2,dt);
    // jelly wobble spring
    b.vs+=(-b.s*380-b.vs*7)*dt;b.s+=b.vs*dt;
    if(b.y>FLOOR_Y-b.h*.45){const v=Math.abs(b.vy);b.y=FLOOR_Y-b.h*.45;if(v>140){impulseSquash(b,v,0,1);b.vy=-v*.62;b.va+=(rnd()-.5)*2;fox.startle=Math.max(fox.startle,v>900?1.2:0)}else{b.vy=0}b.vx*=Math.pow(.05,dt)}
    if(b.x<WL+b.w*.4){b.x=WL+b.w*.4;if(Math.abs(b.vx)>120)impulseSquash(b,Math.abs(b.vx),1,0);b.vx=Math.abs(b.vx)*.7}
    if(b.x>WR-b.w*.4){b.x=WR-b.w*.4;if(Math.abs(b.vx)>120)impulseSquash(b,Math.abs(b.vx),1,0);b.vx=-Math.abs(b.vx)*.7}
    if(b.y<80){b.y=80;b.vy=Math.abs(b.vy)*.5}
  }
  for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){
    const a=bodies[i],c=bodies[j];let dx=c.x-a.x,dy=(c.y-a.y)*1.1,d=Math.hypot(dx,dy),m=a.r+c.r;
    if(d<m&&d>1){const n=(m-d)/2,nx=dx/d,ny=dy/d;
      const grabA=drag&&drag.b===a,grabC=drag&&drag.b===c;
      if(!grabA){a.x-=nx*n;a.y-=ny*n}if(!grabC){c.x+=nx*n;c.y+=ny*n}
      const rv=(c.vx-a.vx)*nx+(c.vy-a.vy)*ny;
      if(rv<0){const j2=-rv*.9;a.vx-=nx*j2;a.vy-=ny*j2;c.vx+=nx*j2;c.vy+=ny*j2;
        if(-rv>160){impulseSquash(a,-rv,nx,ny);impulseSquash(c,-rv,nx,ny)}}
    }}
  fox.startle=Math.max(0,fox.startle-dt);
  const want=(fox.startle>0)?'j1':'j0';
  if(want!==fox.mode){fox.mode=want;fox.f=0;fox.ft=0}
  fox.ft+=dt;const per=fox.mode==='j1'?.12:.1;while(fox.ft>per){fox.ft-=per;fox.f=(fox.f+1)%8}
}
function draw(){
  g.clearRect(0,0,W,H);g.drawImage(IM.bg,0,0,W,H);
  // fox
  const fi=IM[fox.mode],fw=fi.width/8,fh=fi.height,fs=270/fh;
  g.save();g.globalAlpha=.18;g.fillStyle='#6b4a3a';g.beginPath();g.ellipse(fox.x,fox.y+4,95,17,0,0,7);g.fill();g.restore();
  g.drawImage(fi,fox.f*fw,0,fw,fh,fox.x-fw*fs/2,fox.y-fh*fs,fw*fs,fh*fs);
  const order=[...bodies].sort((a,b)=>a.y-b.y);
  for(const b of order){
    const im=IM['s'+b.i];
    g.save();g.globalAlpha=.16;g.fillStyle='#6b4a3a';const sh=Math.max(0,1-(FLOOR_Y-b.y)/700);g.beginPath();g.ellipse(b.x,FLOOR_Y+6,b.w*.4*(.6+sh*.4),12,0,0,7);g.fill();g.restore();
    g.save();g.translate(b.x,b.y);
    const s=Math.max(-.6,Math.min(b.s,1.6));
    g.rotate(b.dir);g.scale(1+s*.55,1/Math.sqrt(1+s*.55));g.rotate(b.a-b.dir);
    g.drawImage(im,-b.w/2,-b.h/2,b.w,b.h);
    g.restore();
  }
  if(drag){g.save();g.strokeStyle='#e8a0a8aa';g.lineWidth=3;g.setLineDash([2,8]);g.lineCap='round';g.beginPath();g.moveTo(drag.b.x,drag.b.y);g.lineTo(mouse.x,mouse.y);g.stroke();g.restore()}
}
let last=0;
function loop(ts){
  if(window.__rec){const dt=1/30;for(let k=0;k<4;k++)step(dt/4)}
  else{const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;for(let k=0;k<4;k++)step(dt/4)}
  draw();requestAnimationFrame(loop);
}
function pt(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function pick(p){let best=null,bd=1e9;for(const b of bodies){const d=Math.hypot(b.x-p.x,b.y-p.y);if(d<b.r*1.2&&d<bd){bd=d;best=b}}return best}
cv.addEventListener('pointerdown',e=>{
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(_){}}
  const p=pt(e);mouse.x=p.x;mouse.y=p.y;const b=pick(p);
  if(b){drag={b,ox:p.x-b.x,oy:p.y-b.y,t:T,x0:p.x,y0:p.y};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'}
});
cv.addEventListener('pointermove',e=>{const p=pt(e);mouse.x=p.x;mouse.y=p.y});
function up(){if(!drag)return;const b=drag.b;if(Math.hypot(mouse.x-drag.x0,mouse.y-drag.y0)<8&&T-drag.t<.4){b.vy=-900;b.vx=(rnd()-.5)*300;b.vs=-4;snd(.2,260)}
  else{b.vx=Math.max(-2600,Math.min(2600,b.vx*1.3));b.vy=Math.max(-2600,Math.min(2600,b.vy*1.3))}
  drag=null;cv.style.cursor='grab'}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('dblclick',()=>{for(const b of bodies){b.vy=-700-rnd()*600;b.vx=(rnd()-.5)*900;b.va=(rnd()-.5)*10;b.vs=-3}snd(.25,220)});
</script></body></html>
