<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>狐兔小工坊 · 大厅</title>
<style>
@font-face{font-family:kl;src:url(kl.woff2) format("woff2")}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#1c120c;overflow:hidden;font-family:"kl","PingFang SC","Hiragino Sans GB",system-ui,sans-serif}
#app{position:absolute;left:50%;top:50%;width:390px;height:844px;transform-origin:50% 50%;overflow:hidden;border-radius:28px;background:#2a1a10}
#bg{position:absolute;inset:-24px;background:url(bg.webp) center/cover;will-change:transform}
#fx{position:absolute;inset:0;pointer-events:none}
#rays{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.55;background:conic-gradient(from 200deg at 70% 18%,transparent 0deg,rgba(255,214,140,.22) 8deg,transparent 16deg,rgba(255,214,140,.16) 26deg,transparent 34deg,rgba(255,214,140,.2) 44deg,transparent 54deg);animation:rays 9s ease-in-out infinite alternate;filter:blur(6px)}
@keyframes rays{from{opacity:.35;transform:rotate(-2deg)}to{opacity:.65;transform:rotate(2deg)}}
#stage{position:absolute;left:50%;bottom:226px;width:250px;height:70px;transform:translateX(-50%)}
#ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(closest-side,rgba(255,226,150,.55),rgba(255,190,90,.18) 60%,transparent 72%);animation:ring 3s ease-in-out infinite}
#ring:after{content:"";position:absolute;inset:6px 18px;border-radius:50%;border:2px dashed rgba(255,236,180,.75);animation:spin 14s linear infinite}
@keyframes ring{50%{transform:scale(1.06);opacity:.8}}@keyframes spin{to{transform:rotate(360deg)}}
#kitWrap{position:absolute;left:50%;bottom:262px;width:260px;height:390px;margin-left:-118px;transform-origin:50% 100%;cursor:pointer}
#kit{width:100%;height:100%;background:url(kit.webp) center bottom/contain no-repeat;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite;filter:drop-shadow(0 10px 10px rgba(60,30,10,.35))}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.988) translateY(1px)}}
#kitWrap.hop{animation:hop .62s cubic-bezier(.3,.7,.4,1)}
@keyframes hop{0%{transform:scale(1,1)}14%{transform:scale(1.08,.9)}40%{transform:translateY(-46px) scale(.96,1.05)}70%{transform:translateY(0) scale(1.06,.93)}85%{transform:scale(.98,1.02)}100%{transform:none}}
#bubble{position:absolute;left:50%;bottom:640px;transform:translateX(-50%) scale(0);transform-origin:50% 100%;background:#fff8ea;border:3px solid #7a4a28;border-radius:18px;padding:8px 14px;font-size:15px;color:#5a3218;font-weight:700;white-space:nowrap;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
#bubble:after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top-color:#7a4a28}
#bubble.on{transform:translateX(-50%) scale(1)}
/* top bar */
.top{position:absolute;top:44px;left:12px;right:12px;display:flex;align-items:center;gap:6px}
.ava{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#ffe7b8,#e6a85c);border:3px solid #fff3d6;box-shadow:0 3px 0 #7a4a28,0 0 0 2px #7a4a28;position:relative;overflow:hidden}
.ava i{position:absolute;inset:0;background:url(kit.webp) 50% 8%/240% no-repeat}
.lv{position:absolute;left:4px;top:46px;background:#7a4a28;color:#ffe9b0;font-size:11px;font-weight:800;padding:1px 7px;border-radius:9px;border:2px solid #fff0cc}
.name{color:#fff6e2;font-weight:800;font-size:14px;text-shadow:0 2px 0 #5a3218,0 0 4px #5a3218;margin-right:auto;line-height:1.1}
.name small{display:block;font-size:10px;opacity:.85;font-weight:600}
.pill{height:30px;min-width:76px;border-radius:15px;background:linear-gradient(#5d3a22,#47291a);border:2px solid #d9a35a;display:flex;align-items:center;padding:0 6px 0 2px;color:#ffeec2;font-weight:800;font-size:13px;position:relative;box-shadow:inset 0 2px 0 rgba(255,255,255,.12)}
.pill svg{width:26px;height:26px;margin-right:3px;flex:none}
.pill b{flex:1;text-align:right;font-variant-numeric:tabular-nums}
.pill .plus{width:18px;height:18px;border-radius:50%;background:linear-gradient(#9be36d,#4fae3b);color:#fff;font-size:15px;line-height:16px;text-align:center;margin-left:4px;border:1.5px solid #2d6b22}
.pill.bump b{animation:bump .3s}@keyframes bump{50%{transform:scale(1.25);color:#fff}}
/* side buttons */
.side{position:absolute;top:150px;display:flex;flex-direction:column;gap:12px}
.side.r{right:12px}.side.l{left:12px}
.ib{width:56px;height:56px;border-radius:16px;background:linear-gradient(#fff3d8,#f1cf98);border:3px solid #7a4a28;box-shadow:0 4px 0 #5a3218;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column}
.ib svg{width:30px;height:30px}
.ib span{position:absolute;bottom:-14px;font-size:11px;font-weight:800;color:#fff6e2;text-shadow:0 1px 0 #5a3218,0 0 3px #5a3218;white-space:nowrap}
.ib .dot{position:absolute;right:-6px;top:-6px;width:18px;height:18px;border-radius:50%;background:#ff5a3c;border:2px solid #fff;color:#fff;font-size:10px;font-weight:900;line-height:14px;text-align:center;animation:dot 1.6s infinite}
@keyframes dot{0%,70%,100%{transform:none}80%{transform:translateY(-5px) scale(1.1)}90%{transform:translateY(0) scale(.95)}}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 #5a3218}
/* banner */
.banner{position:absolute;left:10px;top:330px;width:92px;height:128px;border-radius:14px;border:3px solid #ffd37a;overflow:hidden;box-shadow:0 4px 0 #7a4a28,0 0 18px rgba(255,200,90,.5);animation:float 4s ease-in-out infinite;background:linear-gradient(160deg,#3b2a5c,#1f1636)}
@keyframes float{50%{transform:translateY(-6px) rotate(-1deg)}}
.banner .gear{position:absolute;left:50%;top:44%;width:62px;height:62px;margin:-31px;animation:spin 6s linear infinite}
.banner .t1{position:absolute;top:6px;left:0;right:0;text-align:center;color:#ffe08a;font-size:11px;font-weight:900;letter-spacing:1px}
.banner .t2{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#fff;font-size:13px;font-weight:900;text-shadow:0 2px 0 #000}
.banner .t3{position:absolute;bottom:5px;left:0;right:0;text-align:center;color:#ffb35a;font-size:10px;font-weight:700}
.shine{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}
.shine:before{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sh 3.4s ease-in-out infinite}
@keyframes sh{0%,55%{left:-60%}85%,100%{left:130%}}
/* go button */
#go{position:absolute;left:50%;bottom:118px;width:236px;height:74px;margin-left:-118px;border-radius:24px;background:linear-gradient(#ffd56a,#f39a2e 60%,#e07a1c);border:4px solid #7a3e14;box-shadow:0 7px 0 #5a2c0c,0 0 0 3px #ffe9b0 inset;color:#fff;font-size:27px;font-weight:900;letter-spacing:4px;text-shadow:0 3px 0 #a04c12,0 0 6px #a04c12;display:flex;align-items:center;justify-content:center;animation:pulse 1.8s ease-in-out infinite;cursor:pointer}
#go small{position:absolute;top:-14px;right:-12px;background:#ff5a3c;font-size:11px;letter-spacing:0;padding:2px 8px;border-radius:10px;border:2px solid #fff;text-shadow:none;transform:rotate(8deg)}
@keyframes pulse{50%{transform:scale(1.04)}}
#go:active{transform:translateY(5px) scale(.98);box-shadow:0 2px 0 #5a2c0c,0 0 0 3px #ffe9b0 inset;animation:none}
/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:0;height:96px;background:linear-gradient(#6b4226,#4a2b18);border-top:4px solid #d9a35a;display:flex;align-items:flex-start;justify-content:space-around;padding:10px 6px 0}
.tab{width:64px;height:62px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f1d7a6;font-size:11px;font-weight:800;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s;cursor:pointer}
.tab svg{width:28px;height:28px;margin-bottom:2px}
.tab.on{background:linear-gradient(#ffe7a8,#f4b85a);color:#6b3a14;transform:translateY(-16px) scale(1.12);box-shadow:0 4px 0 #7a4a28;border:3px solid #fff3d0}
#toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.6);opacity:0;background:rgba(40,22,10,.85);color:#ffe9b8;padding:10px 18px;border-radius:14px;font-weight:800;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#flash{position:absolute;inset:0;background:#fff3cf;opacity:0;pointer-events:none}
</style></head><body>
<div id="app">
 <div id="bg"></div><div id="rays"></div>
 <div id="stage"><div id="ring"></div></div>
 <div id="kitWrap"><div id="kit"></div></div>
 <div id="bubble">今天也要好好开工！</div>
 <canvas id="fx"></canvas>
 <div class="top">
  <div class="ava"><i></i></div><div class="lv">Lv.12</div>
  <div class="name">狐兔<small>小工坊店长</small></div>
  <div class="pill" id="pCoin"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#ffd34d" stroke="#a8641c" stroke-width="2.5"/><circle cx="16" cy="16" r="7" fill="none" stroke="#e59a2a" stroke-width="2"/><path d="M11 10a8 8 0 0 1 6-3" stroke="#fff6c8" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg><b>12,480</b><span class="plus">+</span></div>
  <div class="pill" id="pGem"><svg viewBox="0 0 32 32"><path d="M8 12l4-5h8l4 5-8 13z" fill="#7fe0ff" stroke="#1f6c9a" stroke-width="2.4" stroke-linejoin="round"/><path d="M8 12h16M12 7l4 18M20 7l-4 18" stroke="#1f6c9a" stroke-width="1.4"/><path d="M11 11l2-2" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg><b>360</b><span class="plus">+</span></div>
 </div>
 <div class="side r">
  <div class="ib" data-t="邮件"><svg viewBox="0 0 32 32"><rect x="4" y="8" width="24" height="17" rx="3" fill="#fff" stroke="#7a4a28" stroke-width="2.5"/><path d="M5 10l11 8 11-8" fill="none" stroke="#7a4a28" stroke-width="2.5" stroke-linejoin="round"/></svg><span>邮件</span><div class="dot">3</div></div>
  <div class="ib" data-t="任务"><svg viewBox="0 0 32 32"><rect x="7" y="4" width="18" height="24" rx="3" fill="#fff" stroke="#7a4a28" stroke-width="2.5"/><path d="M11 12l2 2 4-4M11 20h10" stroke="#3e9a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg><span>任务</span><div class="dot">!</div></div>
  <div class="ib" data-t="签到"><svg viewBox="0 0 32 32"><rect x="5" y="7" width="22" height="20" rx="3" fill="#fff" stroke="#7a4a28" stroke-width="2.5"/><path d="M5 13h22" stroke="#e05a3a" stroke-width="5"/><path d="M11 4v6M21 4v6" stroke="#7a4a28" stroke-width="2.5" stroke-linecap="round"/><path d="M12 20l3 3 5-6" stroke="#e05a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg><span>签到</span></div>
 </div>
 <div class="side l">
  <div class="ib" data-t="好友"><svg viewBox="0 0 32 32"><circle cx="12" cy="12" r="5" fill="#ffd9a0" stroke="#7a4a28" stroke-width="2.3"/><circle cx="21" cy="13" r="4" fill="#ffe9c4" stroke="#7a4a28" stroke-width="2.3"/><path d="M4 26c1-6 15-6 16 0M17 22c2-4 11-3 11 3" fill="#ffd9a0" stroke="#7a4a28" stroke-width="2.3"/></svg><span>好友</span></div>
  <div class="ib" data-t="排行"><svg viewBox="0 0 32 32"><path d="M8 6h16v5a8 8 0 0 1-16 0z" fill="#ffd34d" stroke="#7a4a28" stroke-width="2.5"/><path d="M8 8H4a4 4 0 0 0 4 6M24 8h4a4 4 0 0 1-4 6M16 19v4M11 27h10" stroke="#7a4a28" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg><span>排行</span></div>
 </div>
 <div class="banner" data-t="齿轮机甲 限时祈愿"><div class="t1">限 时 祈 愿</div>
  <svg class="gear" viewBox="0 0 100 100"><g fill="#ffcf5a" stroke="#8a4f12" stroke-width="3"><path id="g" d="M50 6l7 12 13-4 2 14 13 5-6 12 8 11-12 7 1 14-14-1-6 12-12-7-11 8-6-12-14 1 1-14-12-7 8-11-6-12 13-5 2-14 13 4z"/></g><circle cx="50" cy="50" r="14" fill="#3b2a5c" stroke="#8a4f12" stroke-width="3"/></svg>
  <div class="t2">齿轮机甲</div><div class="t3">剩余 2天 14时</div><div class="shine"></div></div>
 <div id="go">开始冒险<small>体力 48/60</small><div class="shine" style="border-radius:20px"></div></div>
 <div class="tabs">
  <div class="tab" data-t="角色"><svg viewBox="0 0 32 32"><circle cx="16" cy="11" r="6" fill="#ffd9a0" stroke="currentColor" stroke-width="2.3"/><path d="M6 28c1-8 19-8 20 0" fill="#ffd9a0" stroke="currentColor" stroke-width="2.3"/></svg>角色</div>
  <div class="tab" data-t="背包"><svg viewBox="0 0 32 32"><path d="M7 12h18v14a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3z" fill="#e3a35c" stroke="currentColor" stroke-width="2.3"/><path d="M12 12V9a4 4 0 0 1 8 0v3M7 17h18" stroke="currentColor" stroke-width="2.3" fill="none"/></svg>背包</div>
  <div class="tab on" data-t="大厅"><svg viewBox="0 0 32 32"><path d="M5 15L16 5l11 10v12H5z" fill="#ffcf6a" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/><rect x="13" y="19" width="6" height="8" fill="#fff3d0" stroke="currentColor" stroke-width="2"/></svg>大厅</div>
  <div class="tab" data-t="商店"><svg viewBox="0 0 32 32"><path d="M5 12l3-6h16l3 6v3H5z" fill="#ff8a6a" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/><path d="M7 15v12h18V15" fill="#fff3d0" stroke="currentColor" stroke-width="2.3"/></svg>商店</div>
  <div class="tab" data-t="工坊"><svg viewBox="0 0 32 32"><g stroke="currentColor" stroke-width="2.3" fill="#9fd0e0"><circle cx="16" cy="16" r="8"/><circle cx="16" cy="16" r="3" fill="#fff3d0"/></g><path d="M16 3v5M16 24v5M3 16h5M24 16h5M7 7l3.5 3.5M21.5 21.5L25 25M25 7l-3.5 3.5M10.5 21.5L7 25" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>工坊</div>
 </div>
 <div id="toast"></div><div id="flash"></div>
</div>
<script>
const app=document.getElementById('app');
function fit(){const s=Math.min(innerWidth/390,innerHeight/844);app.style.transform=`translate(-50%,-50%) scale(${s})`}addEventListener('resize',fit);fit();
const cv=document.getElementById('fx'),cx=cv.getContext('2d');const DPR=2;cv.width=390*DPR;cv.height=844*DPR;cx.scale(DPR,DPR);
let P=[];const rnd=(a,b)=>a+Math.random()*(b-a);
// dust motes in window light
for(let i=0;i<46;i++)P.push({k:'dust',x:rnd(0,390),y:rnd(80,700),vx:rnd(-4,4),vy:rnd(-8,-2),r:rnd(.8,2.2),ph:rnd(0,6.28),life:1e9});
function burst(x,y,kind,n){for(let i=0;i<n;i++){let a=rnd(-Math.PI,0),s=rnd(80,240);P.push({k:kind,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,r:rnd(5,9),rot:rnd(0,6),vr:rnd(-6,6),life:rnd(.8,1.3),t:0})}}
function heart(c,x,y,r){c.beginPath();c.moveTo(x,y+r*.35);c.bezierCurveTo(x,y-r*.3,x-r,y-r*.3,x-r,y+r*.2);c.bezierCurveTo(x-r,y+r*.7,x,y+r,x,y+r*1.2);c.bezierCurveTo(x,y+r,x+r,y+r*.7,x+r,y+r*.2);c.bezierCurveTo(x+r,y-r*.3,x,y-r*.3,x,y+r*.35);c.fill()}
function star(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){let a=i*Math.PI/5-Math.PI/2,q=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.closePath();c.fill()}
let last=performance.now(),T=0;
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;step(dt);requestAnimationFrame(loop)}
function step(dt){cx.clearRect(0,0,390,844);
 for(const p of P){if(p.k==='dust'){p.ph+=dt;p.x+=(p.vx+Math.sin(p.ph)*6)*dt;p.y+=p.vy*dt;if(p.y<70){p.y=720;p.x=rnd(0,390)}let a=.35+.35*Math.sin(p.ph*2);cx.fillStyle=`rgba(255,236,180,${a})`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill();continue}
  p.t+=dt;p.vy+=380*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;let al=Math.max(0,1-p.t/p.life);cx.save();cx.globalAlpha=al;cx.translate(p.x,p.y);cx.rotate(p.rot*.2);
  if(p.k==='heart'){cx.fillStyle='#ff7a8a';heart(cx,0,-p.r*.6,p.r)}else if(p.k==='coin'){cx.fillStyle='#ffd34d';cx.strokeStyle='#a8641c';cx.lineWidth=2;cx.beginPath();cx.ellipse(0,0,p.r*Math.abs(Math.cos(p.rot)),p.r,0,0,7);cx.fill();cx.stroke()}else{cx.fillStyle=p.k==='gem'?'#8fe6ff':'#fff2a8';star(cx,0,0,p.r)}cx.restore()}
 P=P.filter(p=>p.k==='dust'||p.t<p.life);
 // parallax idle drift
 const bg=document.getElementById('bg');let mx=window._mx??Math.sin(T*.25)*.4,my=window._my??Math.cos(T*.2)*.3;bg.style.transform=`translate(${mx*10}px,${my*8}px) scale(1.02)`;
 document.getElementById('kitWrap').style.translate=`${mx*-4}px 0`}
requestAnimationFrame(loop);
app.addEventListener('pointermove',e=>{const r=app.getBoundingClientRect();window._mx=((e.clientX-r.left)/r.width-.5)*2;window._my=((e.clientY-r.top)/r.height-.5)*2});
// kit tap
const lines=['今天也要好好开工！','齿轮机甲要来了吗？','嘿嘿，再摸一下～','先去签到领金币吧！','耳朵不要捏啦！'];let li=0,bt;
const kw=document.getElementById('kitWrap'),bub=document.getElementById('bubble');
kw.addEventListener('click',()=>{kw.classList.remove('hop');void kw.offsetWidth;kw.classList.add('hop');burst(205,470,'heart',8);bub.textContent=lines[li++%lines.length];bub.classList.add('on');clearTimeout(bt);bt=setTimeout(()=>bub.classList.remove('on'),1800)});
// counters
function countTo(el,to){const b=el.querySelector('b');let from=+b.textContent.replace(/,/g,''),t0=performance.now();(function f(n){let u=Math.min(1,(n-t0)/700),v=Math.round(from+(to-from)*(1-Math.pow(1-u,3)));b.textContent=v.toLocaleString('en-US');if(u<1)requestAnimationFrame(f);else{el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}})(t0)}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1200)}
document.querySelectorAll('.ib').forEach(b=>b.addEventListener('click',()=>{const t=b.dataset.t;const r=b.getBoundingClientRect(),a=app.getBoundingClientRect(),s=a.width/390;let x=(r.left-a.left)/s+28,y=(r.top-a.top)/s+28;
 if(t==='签到'){burst(x,y,'coin',14);countTo(document.getElementById('pCoin'),+document.querySelector('#pCoin b').textContent.replace(/,/g,'')+500);toast('签到成功 金币 +500')}
 else if(t==='邮件'){burst(x,y,'gem',10);countTo(document.getElementById('pGem'),+document.querySelector('#pGem b').textContent+60);b.querySelector('.dot')?.remove();toast('领取邮件 宝石 +60')}
 else{burst(x,y,'star',8);toast(t+'：敬请期待')}}));
document.querySelector('.banner').addEventListener('click',()=>{burst(68,425,'star',14);toast('齿轮机甲 限时祈愿开启！')});
document.getElementById('go').addEventListener('click',()=>{const f=document.getElementById('flash');burst(195,690,'star',18);f.animate([{opacity:0},{opacity:.85},{opacity:0}],{duration:700});toast('出发！')});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');if(t.dataset.t!=='大厅')toast(t.dataset.t+'：敬请期待')}));
// demo script for capture
window.__demo=async()=>{const w=ms=>new Promise(r=>setTimeout(r,ms));const c=s=>document.querySelector(s).click();await w(1500);c('#kitWrap');await w(1600);c('.ib[data-t=签到]');await w(1500);c('.ib[data-t=邮件]');await w(1500);c('#kitWrap');await w(1400);c('.tab[data-t=工坊]');await w(900);c('.tab[data-t=大厅]');await w(800);c('.banner');await w(1300);c('#go');await w(1500)};
</script></body></html>
