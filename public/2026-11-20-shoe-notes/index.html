<div id="wrap"><canvas id="c" width="1200" height="800"></canvas>
<div class="ui"><button id="b0">▶ 小星星</button><button id="b1">▶ 欢乐颂</button></div></div>
<script>
const META=/*META*/{"jump": {"w": 392, "h": 377, "ground": 374, "cx": 191}, "stomp": {"w": 408, "h": 392, "ground": 389, "cx": 191}}/*END*/;
const SRC={bg:'bg.webp',jump:'kit_jump.webp',stomp:'kit_stomp.webp',bow:'bow.webp'};
for(let i=0;i<8;i++)SRC['s'+i]='shoe_'+i+'.webp';
const W=1200,H=800,cv=document.getElementById('c'),g=cv.getContext('2d');
const wrap=document.getElementById('wrap');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H)*.98;wrap.style.left='50%';wrap.style.top='50%';wrap.style.transform=`translate(-50%,-50%) scale(${s})`;wrap.style.transformOrigin='50% 50%'}
addEventListener('resize',fit);fit();
const IM={};
const PINK='#ff8fb1',MINT='#7fdcb5';
// ---------- layout: 8 shoes (white keys) + 5 bows (sharps) ----------
const STAGE=0.865*H; // shoe sole line
const BOWB=STAGE-128; // bow bottom line (floating row)
const pads=[];
const WN=['do','re','mi','fa','sol','la','si','do'],WK='ASDFGHJK',WS=[0,2,4,5,7,9,11,12];
for(let i=0;i<8;i++)pads.push({i,kind:'shoe',x:120+i*137,semi:WS[i],name:WN[i],key:WK[i],sq:0,sv:0,glow:0,hue:i%2?PINK:MINT});
const BN=['do#','re#','fa#','sol#','la#'],BK='WETYU',BS=[1,3,6,8,10],BL=[0,1,3,4,5];
for(let j=0;j<5;j++)pads.push({i:8+j,kind:'bow',x:120+BL[j]*137+68.5,semi:BS[j],name:BN[j],key:BK[j],sq:0,sv:0,glow:0,hue:j%2?MINT:PINK,flip:j%2?-1:1,ph:j*1.3});
const KEYMAP={};pads.forEach(p=>KEYMAP[p.key]=p.i);
function shoeScale(p){const im=IM['s'+p.i];return im?128/Math.max(im.width,im.height*1.25):1}
function bowScale(){const im=IM.bow;return im?66/im.width:1}
let NOW=0;
function bowBase(p){return BOWB+Math.sin(NOW*1.6+p.ph)*3}
function padTop(p){
 if(p.kind==='bow'){const im=IM.bow;return bowBase(p)-(im?im.height*bowScale()*(1-p.sq*.3)*.72:30)}
 const im=IM['s'+p.i];return STAGE-(im?im.height*shoeScale(p)*(1-p.sq*.35)*.62:50)}
function padGround(p){return p.kind==='bow'?bowBase(p):STAGE}
// ---------- audio: ONE recorded voice, every pitch by playbackRate ----------
let AC=null,SAMPLE=null,WAVE=null;
async function initAudio(){
 if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();
 const sr=44100,len=sr*1.4,off=new OfflineAudioContext(1,len,sr);
 const f0=261.63,mix=off.createGain();mix.gain.value=.5;mix.connect(off.destination);
 [[1,1],[2,.42],[3,.18],[4.2,.08]].forEach(([m,a])=>{const o=off.createOscillator(),e=off.createGain();
   o.frequency.value=f0*m;o.type='sine';e.gain.setValueAtTime(0,0);e.gain.linearRampToValueAtTime(a,.006);e.gain.exponentialRampToValueAtTime(.0008,1.3/m**.4);o.connect(e);e.connect(mix);o.start(0);o.stop(1.4)});
 const w=off.createOscillator(),we=off.createGain(),lfo=off.createOscillator(),lg=off.createGain();
 w.type='triangle';w.frequency.value=f0*2;lfo.frequency.value=6;lg.gain.value=4;lfo.connect(lg);lg.connect(w.frequency);
 we.gain.setValueAtTime(0,0);we.gain.linearRampToValueAtTime(.12,.05);we.gain.exponentialRampToValueAtTime(.001,.7);w.connect(we);we.connect(mix);w.start();lfo.start();
 SAMPLE=await off.startRendering();
 const d=SAMPLE.getChannelData(0);WAVE=[];for(let i=0;i<120;i++){let m=0;for(let j=0;j<300;j++)m=Math.max(m,Math.abs(d[i*300+j]||0));WAVE.push(m)}
}
// play pad i, optionally `delay` seconds from now (scheduled on the audio clock so it lands exactly on touchdown)
function sound(i,delay=0){if(!AC||!SAMPLE)return null;const s=AC.createBufferSource(),gn=AC.createGain();s.buffer=SAMPLE;s.playbackRate.value=2**(pads[i].semi/12);gn.gain.value=.8;s.connect(gn);gn.connect(AC.destination);s.start(AC.currentTime+Math.max(0,delay));return s}
// ---------- kit ----------
// act: {type:'hop'|'stomp', t0, L (takeoff->touchdown), R (recovery after touchdown), land (phase at touchdown), from, to, fx, fy, fired, foot, src}
const kit={x:pads[0].x,y:0,face:1,act:null,idleT:0,cur:0,lastPress:-9,turn:null};
const TURN=0.11; // squash-turn length: ~3 frames at 30fps
function curTarget(){return kit.act?kit.act.to:kit.cur}
function startAct(to,t,L,R){
 const a0=kit.act;
 if(a0&&!a0.fired){ // interrupted before touchdown: land that note right now
  if(a0.src){try{a0.src.stop()}catch(e){}a0.src=null}a0.fired=true;hit(a0.to,true);kit.cur=a0.to}
 const from=curTarget();const type=(to===from)?'stomp':'hop';
 kit.foot=(kit.foot||0)^1;
 const land=type==='hop'?.72:.5;
 const a={type,t0:t,L,R,land,from,to,fx:kit.x,fy:kit.y,fired:false,foot:kit.foot};
 if(type==='hop'){const dx=pads[to].x-kit.x;if(Math.abs(dx)>4){const nf=dx>0?1:-1;
   if(nf!==kit.face&&!(kit.turn&&kit.turn.to===nf))kit.turn={t0:t,to:nf}}}
 kit.act=a;return a}
function phase(a,t){const e=t-a.t0;return e<a.L?a.land*e/a.L:a.land+(1-a.land)*Math.min(1,(e-a.L)/a.R)}
// song mode: classic timing (takeoff->touchdown = 72% of D)
function songTiming(to,D){const from=curTarget();if(to===from){const d=Math.min(D,.34);return{L:d*.5,R:d*.5}}return{L:D*.72,R:D*.28}}
// hand mode: short, snappy takeoff->touchdown
function handTiming(to,t){
 const from=curTarget(),p=pads[to];
 if(to===from)return{L:.08,R:.17};
 const dx=Math.abs(p.x-kit.x),dy=Math.abs(padTop(p)-kit.y);
 let L=.085+(dx+dy*.5)*.00011;            // 137px ~ 0.10s, whole counter ~ 0.19s
 const gap=t-kit.lastPress;
 if(gap<.32)L=Math.min(L,Math.max(.08,Math.min(.12,gap*.6))); // fast playing: 80-120ms
 L=Math.min(L,.2);
 return{L,R:.18}}
// ---------- particles ----------
const P=[];
function burst(p,big){const x=p.x,y=padTop(p);
 for(let k=0;k<(big?7:5);k++){const sd=k%2?1:-1;P.push({k:'note',x:x+sd*(60+Math.random()*30),y:y-30-Math.random()*40,vx:(k%2?1:-1)*(20+Math.random()*50),vy:-110-Math.random()*110,life:1.4,age:0,c:Math.random()<.5?PINK:MINT,ch:p.kind==='bow'?['♪','#','♫'][k%3]:['♪','♫','♩'][k%3],r:(Math.random()-.5)*.6,sz:22+Math.random()*14})};
 for(let k=0;k<16;k++){const a=Math.random()*6.28,v=80+Math.random()*180;P.push({k:'spark',x,y:y+10,vx:Math.cos(a)*v,vy:Math.sin(a)*v*.6-60,life:.7,age:0,c:Math.random()<.5?'#fff6c8':(Math.random()<.5?PINK:MINT),sz:2+Math.random()*3})}
 P.push({k:'ring',x,y:padGround(p)-(p.kind==='bow'?4:8),life:.6,age:0,c:p.hue,sm:p.kind==='bow'?.6:1});
}
const dust=[];for(let i=0;i<46;i++)dust.push({x:Math.random()*W,y:Math.random()*H*.8,p:Math.random()*6.28,s:.5+Math.random()*1.6});
// ---------- songs (public domain) ----------
const SONGS=[
 {name:'小星星',bpm:132,n:'0 0 4 4 5 5 4- 3 3 2 2 1 1 0- 4 4 3 3 2 2 1- 4 4 3 3 2 2 1- 0 0 4 4 5 5 4- 3 3 2 2 1 1 0-'},
 {name:'欢乐颂',bpm:150,n:'2 2 3 4 4 3 2 1 0 0 1 2 2. 1_ 1- 2 2 3 4 4 3 2 1 0 0 1 2 1. 0_ 0-'}
];
function parse(s){return s.n.split(' ').map(t=>{let b=1;if(t.endsWith('-'))b=2;else if(t.endsWith('.'))b=1.5;else if(t.endsWith('_'))b=.5;return{i:+t[0],b}})}
let play=null;
function startSong(si,t){const s=SONGS[si],notes=parse(s),beat=60/s.bpm;let acc=.9;notes.forEach(n=>{n.at=acc;acc+=n.b*beat});
 play={si,notes,t0:t,k:0,beat,end:acc};document.querySelectorAll('.ui button').forEach((b,j)=>b.classList.toggle('on',j===si))}
function stopSong(){play=null;document.querySelectorAll('.ui button').forEach(b=>b.classList.remove('on'))}
// ---------- touchdown: squash + notes + glow + (sound unless pre-scheduled) ----------
window.__hits=[];
function hit(i,silent){__hits.push([NOW,i]);const p=pads[i];p.sv=9;p.glow=1;burst(p,true);if(!silent)sound(i);kit.cur=i;kit.lastHit=NOW}
function userPress(i){initAudio();if(play)stopSong();const t=NOW;
 const tm=handTiming(i,t);const a=startAct(i,t,tm.L,tm.R);
 a.src=sound(i,tm.L);a.pre=!!a.src;  // sound scheduled for the touchdown instant
 kit.lastPress=t;kit.idleT=t}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
 let best=-1;
 pads.forEach(p=>{if(p.kind==='bow'&&Math.abs(p.x-x)<36&&y>BOWB-70&&y<BOWB+12)best=p.i});
 if(best<0){let bd=1e9;pads.forEach(p=>{if(p.kind!=='shoe')return;const d=Math.abs(p.x-x);if(d<bd&&y>STAGE-260){bd=d;best=p.i}});if(bd>=70)best=-1}
 if(best>=0)userPress(best)});
addEventListener('keydown',e=>{const k=e.key.toUpperCase();if(k in KEYMAP&&!e.repeat)userPress(KEYMAP[k])});
['b0','b1'].forEach((id,j)=>document.getElementById(id).onclick=()=>{initAudio();if(play&&play.si===j)stopSong();else startSong(j,NOW)});
// ---------- draw helpers ----------
function frameOf(a,t){
 const p=phase(a,t);
 if(a.type==='hop'){const F=[0,.1,.22,.36,.52,.68,.8,.92];let f=0;for(let k=0;k<8;k++)if(p>=F[k])f=k;return['jump',f,p]}
 const base=a.foot?4:1;return['stomp',p<.5?base:(p<.85?base+1:(a.foot?7:3)),p]}
function turnScale(t){ // squash thin -> flip at the thinnest frame -> spring back
 const tr=kit.turn;if(!tr)return[1,1];const u=(t-tr.t0)/TURN;
 if(u>=1){kit.face=tr.to;kit.turn=null;return[1,1]}
 if(u>=.5)kit.face=tr.to;
 let sx=.18+.82*Math.abs(Math.cos(Math.PI*u)),sy=1+.09*Math.sin(Math.PI*u);
 if(u>.75)sx+=.1*Math.sin((u-.75)/.25*Math.PI);
 return[sx,sy]}
function drawKit(t){
 const a=kit.act;let sheet='stomp',fr=0,sx=1,sy=1;
 if(a){const r=frameOf(a,t);sheet=r[0];fr=r[1];const p=r[2];
  if(a.type==='hop'){const s0=.12,s1=a.land,q=Math.max(0,Math.min(1,(p-s0)/(s1-s0)));const e=q<.5?2*q*q:1-((-2*q+2)**2)/2;
   const B=pads[a.to];kit.x=a.fx+(B.x-a.fx)*e;const yB=padTop(B);
   const dist=Math.abs(B.x-a.fx),hs=Math.max(.5,Math.min(1,a.L/.2));
   kit.y=a.fy+(yB-a.fy)*q-Math.sin(q*Math.PI)*(40+dist*.12)*hs}
  else{kit.x=pads[a.to].x;kit.y=padTop(pads[a.to])}
  if(p>=1){kit.cur=a.to;kit.act=null;kit.idleT=t}
 }else{const s=pads[kit.cur];kit.x=s.x;kit.y=padTop(s);
  const it=t-kit.idleT;if(it>3.2&&!play){const k=Math.floor((it-3.2)*7)%16;fr=[0,1,2,3,0,4,5,6,7,7,0,0,0,0,0,0][k]}
  sy=1+Math.sin(t*3.2)*.012;sx=1-Math.sin(t*3.2)*.008}
 const ts=turnScale(t);sx*=ts[0];sy*=ts[1];
 const im=IM[sheet],m=META[sheet];if(!im)return;
 const sc=235/m.h;
 // shadow on the pad below / being landed on
 const sp=pads[a?a.to:kit.cur],gy=padTop(sp)+6,air=Math.max(0,gy-6-kit.y);
 g.save();g.fillStyle='rgba(120,60,80,.18)';g.beginPath();g.ellipse(sp.x+(kit.x-sp.x)*.3,gy,Math.max(14,46-air*.12),Math.max(3,9-air*.02),0,0,7);g.fill();g.restore();
 g.save();g.translate(kit.x,kit.y+6);
 g.scale(kit.face*sx*sc,sy*sc);
 g.shadowColor='rgba(255,240,200,.65)';g.shadowBlur=18;
 g.drawImage(im,fr*m.w,0,m.w,m.h,-m.cx,-m.ground,m.w,m.h);
 g.restore();
}
function drawGlow(x,y,rx,ry,hue,a){const r=g.createRadialGradient(x,y,4,x,y,rx);r.addColorStop(0,hue+'cc');r.addColorStop(1,hue+'00');g.globalAlpha=a;g.fillStyle=r;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill();g.globalAlpha=1}
function drawShoe(s,t){const im=IM['s'+s.i];if(!im)return;const sc=shoeScale(s);const w=im.width*sc,h=im.height*sc;
 if(s.glow>.01)drawGlow(s.x,STAGE-10,120,46,s.hue,s.glow);
 g.fillStyle='rgba(110,60,70,.16)';g.beginPath();g.ellipse(s.x,STAGE+2,w*.45,8,0,0,7);g.fill();
 g.save();g.translate(s.x,STAGE);g.scale(1+s.sq*.22,1-s.sq*.35);g.rotate(Math.sin(t*1.3+s.i)*.012);
 g.drawImage(im,-w/2,-h,w,h);
 if(s.glow>.05){g.globalCompositeOperation='lighter';g.globalAlpha=s.glow*.35;g.drawImage(im,-w/2,-h,w,h);g.globalCompositeOperation='source-over';g.globalAlpha=1}
 g.restore();
 tag(s.x,STAGE+34,s.name+' '+s.key,s,(s.i%2?.04:-.04),60,15);
}
function drawBow(b,t){const im=IM.bow;if(!im)return;const sc=bowScale();const w=im.width*sc,h=im.height*sc,by=bowBase(b);
 // thin ribbon it hangs from + soft shadow on the counter
 g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1.5;g.setLineDash([3,4]);g.beginPath();g.moveTo(b.x,by-h*.6);g.lineTo(b.x,by-h-60);g.stroke();g.setLineDash([]);
 if(b.glow>.01)drawGlow(b.x,by-h*.45,70,44,b.hue,b.glow);
 g.save();g.translate(b.x,by);g.scale(b.flip*(1+b.sq*.25),1-b.sq*.35);g.rotate(Math.sin(t*1.6+b.ph)*.05);
 g.drawImage(im,-w/2,-h,w,h);
 if(b.glow>.05){g.globalCompositeOperation='lighter';g.globalAlpha=b.glow*.4;g.drawImage(im,-w/2,-h,w,h);g.globalCompositeOperation='source-over';g.globalAlpha=1}
 g.restore();
 tag(b.x,by+14,b.name+' '+b.key,b,(b.i%2?.05:-.05),54,12);
}
function tag(x,y,txt,p,rot,w,fs){g.save();g.translate(x,y);g.rotate(rot);const h=fs*2;g.fillStyle=p.glow>.3?p.hue:'rgba(255,255,255,.92)';
 rr(-w/2,-h/2,w,h,h*.47);g.fill();g.strokeStyle=p.hue;g.lineWidth=2.2;rr(-w/2,-h/2,w,h,h*.47);g.stroke();
 g.fillStyle=p.glow>.3?'#fff':'#7a4656';g.font=`700 ${fs}px wk,"PingFang SC",sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(txt,0,1);g.restore()}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function drawTag(t){
 g.save();g.translate(30,26);g.rotate(-.02);g.fillStyle='rgba(255,253,246,.93)';rr(0,0,350,92,16);g.fill();g.strokeStyle=MINT;g.setLineDash([6,5]);g.lineWidth=2.5;rr(0,0,350,92,16);g.stroke();g.setLineDash([]);
 g.fillStyle='#7a4656';g.font='700 16px wk,"PingFang SC",sans-serif';g.fillText('只录了 1 个「啾」 → 变速成 13 个音',14,24);
 const wv=WAVE||Array.from({length:120},(_,i)=>Math.exp(-i/30)*(.5+.5*Math.abs(Math.sin(i*1.7))));
 g.fillStyle=PINK;for(let i=0;i<wv.length;i+=2){const a=Math.min(1,wv[i]*1.6)*24;g.fillRect(16+i*1.25,58-a,2,a*2+1)}
 g.restore();
 if(play){const n=play.notes.length,pw=Math.min(560,n*16);g.save();g.translate(W/2-pw/2,H*.08+82);
  g.fillStyle='rgba(255,253,246,.88)';rr(-14,-16,pw+28,40,18);g.fill();
  g.fillStyle='#7a4656';g.font='700 15px wk,"PingFang SC",sans-serif';g.textAlign='center';g.fillText('♪ '+SONGS[play.si].name,pw/2,-24);
  play.notes.forEach((nt,k)=>{const x=k*pw/n+pw/n/2,y=10-nt.i*2.2;g.fillStyle=k<play.k?(nt.i%2?PINK:MINT):'rgba(160,120,130,.35)';g.beginPath();g.arc(x,y,k===play.k-1?6:4,0,7);g.fill()});g.restore()}
}
// ---------- main loop ----------
let last=null;
function frame(ts){const t=ts/1000;if(last===null)last=t;const dt=Math.min(.05,t-last);last=t;NOW=t;
 if(play){const pt=t-play.t0;
  while(play.k<play.notes.length){const nt=play.notes[play.k],prev=play.notes[play.k-1];const gap=prev?nt.at-prev.at:.6;const D=Math.min(.5,gap*1.15);
   const tm=songTiming(nt.i,D);if(pt>=nt.at-tm.L){startAct(nt.i,t-(pt-(nt.at-tm.L)),tm.L,tm.R);play.k++}else break}
  if(play.k>=play.notes.length&&pt>play.end+.6){stopSong();kit.idleT=t}}
 // touchdown: squash, notes, glow (and sound, if it was not scheduled ahead) all on the same frame
 if(kit.act&&!kit.act.fired&&t-kit.act.t0>=kit.act.L){kit.act.fired=true;hit(kit.act.to,kit.act.pre);kit.act.src=null}
 pads.forEach(s=>{const k=260,d=14;s.sv+=(-k*s.sq-d*s.sv)*dt;s.sq+=s.sv*dt;s.glow*=Math.pow(.18,dt)});
 const bg=IM.bg;if(bg){const sc=Math.max(W/bg.width,H/bg.height);g.drawImage(bg,(W-bg.width*sc)/2,(H-bg.height*sc)/2,bg.width*sc,bg.height*sc)}
 g.save();g.globalCompositeOperation='screen';for(let k=0;k<4;k++){g.globalAlpha=.06+.03*Math.sin(t*.7+k);g.fillStyle='#fff3d6';g.beginPath();const x0=60+k*75;g.moveTo(x0,120);g.lineTo(x0+45,120);g.lineTo(x0+330,H*.86);g.lineTo(x0+210,H*.86);g.fill()}g.restore();
 dust.forEach(d=>{d.y-=d.s*8*dt;d.x+=Math.sin(t*.6+d.p)*6*dt;if(d.y<-10){d.y=H*.85;d.x=Math.random()*W}g.fillStyle=`rgba(255,250,225,${.35+.3*Math.sin(t*2+d.p)})`;g.beginPath();g.arc(d.x,d.y,d.s*1.4,0,7);g.fill()});
 pads.forEach(p=>p.kind==='shoe'&&drawShoe(p,t));
 pads.forEach(p=>p.kind==='bow'&&drawBow(p,t));
 drawKit(t);
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.age+=dt;if(p.age>p.life){P.splice(i,1);continue}const a=1-p.age/p.life;
  if(p.k==='ring'){g.strokeStyle=p.c;g.globalAlpha=a*.8;g.lineWidth=4*a;g.beginPath();g.ellipse(p.x,p.y,(30+p.age*220)*p.sm,(8+p.age*50)*p.sm,0,0,7);g.stroke();g.globalAlpha=1;continue}
  p.vy+=(p.k==='note'?-20:260)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;
  if(p.k==='note'){g.save();g.translate(p.x,p.y);g.rotate(p.r+Math.sin(p.age*6)*.2);g.globalAlpha=Math.min(1,a*1.6);g.font=`700 ${p.sz}px serif`;g.textAlign='center';g.lineWidth=5;g.strokeStyle='#fff';g.strokeText(p.ch,0,0);g.fillStyle=p.c;g.fillText(p.ch,0,0);g.restore()}
  else{g.globalAlpha=a;g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.sz*a+.5,0,7);g.fill();g.globalAlpha=1}}
 drawTag(t);
 g.fillStyle='rgba(122,70,86,.75)';g.font='600 15px wk,"PingFang SC",sans-serif';g.textAlign='center';g.fillText('点鞋子或按 A S D F G H J K 弹琴 · 蝴蝶结是升半音 W E T Y U · 右上角自动演奏',W/2,H-14);g.textAlign='left';
 requestAnimationFrame(frame)}
// ---------- boot ----------
let n=0;const keys=Object.keys(SRC);keys.forEach(k=>{const im=new Image();im.onload=()=>{IM[k]=im;if(++n===keys.length)go()};im.onerror=()=>{if(++n===keys.length)go()};im.src=SRC[k]});
function go(){document.fonts.load('700 16px wk').then(go2,go2)}
function go2(){kit.cur=0;kit.idleT=0;requestAnimationFrame(frame)}
window.__api={startSong:i=>{startSong(i,NOW)},press:i=>userPress(i),stop:stopSong,state:()=>({k:play&&play.k,act:kit.act&&{L:kit.act.L,type:kit.act.type},face:kit.face})};
</script></body></html>
