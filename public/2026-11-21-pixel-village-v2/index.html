function mkCloud(w,seed){const h=18,a=new Uint8Array(w*h);let s=seed;const r=()=>(s=(s*16807)%2147483647)/2147483647;const blobs=[];const n=3+(w>>4);
 for(let i=0;i<n;i++){const bx=6+(w-12)*(i+.5)/n+(r()-.5)*4,br=3+r()*Math.min(5,w/7)+(i===n>>1?2:0);blobs.push([bx,h-3-br*.7,br])}

 // 底部阴影：每列最下 2 像素
 for(let x=0;x<w;x++){let bot=-1;for(let y=h-1;y>=0;y--)if(a[y*w+x]){bot=y;break}if(bot>0){a[bot*w+x]=C.cls;if(bot>1&&a[(bot-1)*w+x]&&(x+bot)%3)a[(bot-1)*w+x]=C.cls}}
 return{w,h,a}}

function mkTree(r,seed,apples){const w=r*2+6,h=r*2+4,a=new Uint8Array(w*h);let s=seed;const rn=()=>(s=(s*16807)%2147483647)/2147483647;

 for(let y=0;y<h;y++)for(let x=0;x<w;x++){let inn=0,lt=0;for(const[bx,by,br]of bl){const d=(x+.5-bx)**2+(y+.5-by)**2;if(d<=br*br){inn=1;if((x+.5-bx+br*.35)**2+(y+.5-by+br*.4)**2<=(br*.55)**2)lt=1}}
  if(inn)a[y*w+x]=lt?C.grL:(y>h*.62||x>w*.72?C.grD:C.gr)}
 // 叶簇纹理
 for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const v=a[y*w+x];if(v===C.gr&&hsh(x,y+seed)%9===0)a[y*w+x]=C.grD;if(v===C.gr&&hsh(x+3,y)%13===0)a[y*w+x]=C.grL}
 if(apples)for(const[ax,ay]of apples){a[ay*w+ax]=C.roR;a[ay*w+ax+1]=C.roR;a[(ay+1)*w+ax]=C.roD;a[(ay+1)*w+ax+1]=C.roR}
 // 描边
 const o=a.slice();for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(a[y*w+x])continue;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<w&&yy<h&&a[yy*w+xx]){o[y*w+x]=C.ink;break}}}
 return{w,h,a:o}}

function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=muted?0:.5;MG.connect(AC.destination);
 noiseB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=noiseB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;bgmOn=true;nextNote=AC.currentTime+.1;setInterval(sched,60)}catch(e){AC=null}}
function tone(f,d,type,v,when,f2){if(!AC)return;const t=AC.currentTime+(when||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.02)}
function noise(d,v,when,fc){if(!AC)return;const t=AC.currentTime+(when||0);const s=AC.createBufferSource();s.buffer=noiseB;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fc||1200;const g=AC.createGain();g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(MG);s.start(t);s.stop(t+d)}

function phaseOf(m){m=((m%1440)+1440)%1440;if(m>=300&&m<420)return'dawn';if(m>=420&&m<1020)return'day';if(m>=1020&&m<1170)return'dusk';return'night'}

function nextPhase(){const st={dawn:420,day:1020,dusk:1170,night:300+1440};let m=st[phase];if(phase!=='night'&&m<gm%1440)m+=1440;gm=Math.floor(gm/1440)*1440+(phase==='night'?(gm%1440>=1170?1440+300:300):m);setPhase(phaseOf(gm))}
