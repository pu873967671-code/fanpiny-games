<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>狐兔团子山谷 · 倾斜山谷让团子滚起来</title>
<style>
html,body{margin:0;height:100%;background:#2b2230;overflow:hidden;touch-action:none;font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif}
@font-face{font-family:KL;src:url(kl.woff2) format('woff2')}
canvas{display:block;margin:0 auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
</style></head><body>
<canvas id="c"></canvas>
<script>
// 狐兔团子山谷 — art: gpt-image-2 (watercolor); code: physics / interaction / particles / light
const W=1200,H=800;
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H),d=Math.min(devicePixelRatio||1,2);
  cv.width=W*d;cv.height=H*d;cv.style.width=W*s+'px';cv.style.height=H*s+'px';ctx.setTransform(d,0,0,d,0,0);SC=d}
let SC=1;addEventListener('resize',fit);fit();
const SRC={bg:'bg.webp',ground:'ground.webp',roll:'roll.webp',idle:'idle.webp',props:'props.webp'};
const IM={};let loaded=0;const NIM=Object.keys(SRC).length+1;document.fonts.load('20px KL','狐兔').then(()=>loaded++,()=>loaded++);
for(const k in SRC){const i=new Image();i.onload=()=>{loaded++};i.src=SRC[k];IM[k]=i}
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const easeBack=t=>{const c=1.9;t=clamp(t,0,1);return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};

// ---------- terrain (world coords; world is rotated by tilt around pivot) ----------
const CP=[[-260,-200],[-150,120],[-60,360],[40,540],[170,612],[300,628],[400,592],[470,566],[560,604],[700,668],[820,676],[930,628],[1010,576],[1080,566],[1150,532],[1250,340],[1340,120],[1450,-200]];
const TP=[];
(function(){for(let i=0;i<CP.length-1;i++){const p0=CP[Math.max(0,i-1)],p1=CP[i],p2=CP[i+1],p3=CP[Math.min(CP.length-1,i+2)];
  for(let k=0;k<10;k++){const t=k/10,t2=t*t,t3=t2*t;
   TP.push([0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
            0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)])}}
  TP.push(CP[CP.length-1])})();
function groundY(x){for(let i=0;i<TP.length-1;i++){const a=TP[i],b=TP[i+1];if(x>=a[0]&&x<=b[0]){return lerp(a[1],b[1],(x-a[0])/(b[0]-a[0]))}}return 900}
const PIV={x:W/2,y:590},ZM=1.22,PSY=505;

// ---------- state ----------
let tilt=0,tiltT=0,keyT=0,gyro=null,drag=null,t=0;
const blobs=[],parts=[],props=[];
const PROPX=[120,250,360,520,640,800,900,1040,1130];
let bloomed=0,sat=0.3,celebrate=0,BID=0,tiltPrev=0,tiltV=0,merges=0,splits=0;const TOTAL=9,pairT={};
function mkBlob(x,y,r,mem){return{id:BID++,x,y,vx:0,vy:0,r,rT:r,a:rnd(0,6.28),w:0,awake:0,sq:0,sqv:0,ph:mem[0].ph,happy:0,ground:false,touch:0,mem,cd:0,roll:0}}
function initWorld(){
  const xs=[240,330,430,540,650,760,870,980,1070];
  xs.forEach((x,i)=>{const r=rnd(34,46);blobs.push(mkBlob(x,groundY(x)-r+2,r,[{r,ph:rnd(0,9)}]))});
  PROPX.forEach((x,i)=>props.push({x,y:groundY(x)+6,k:i%8,b:0,bt:0,sw:0,swv:0,sc:rnd(.4,.52)}));
}
initWorld();

// ---------- physics ----------
const G=1500;
function step(dt){
  tilt+= (tiltT-tilt)*Math.min(1,dt*5);
  const gx=G*Math.sin(tilt),gy=G*Math.cos(tilt);
  const N=4,h=dt/N;
  for(let s=0;s<N;s++){
    for(const b of blobs){b.vx+=gx*h;b.vy+=gy*h;b.vx*=1-0.15*h;b.vy*=1-0.05*h;b.x+=b.vx*h;b.y+=b.vy*h;b.ground=false}
    // blob-blob
    for(let i=0;i<blobs.length;i++)for(let j=i+1;j<blobs.length;j++){const a=blobs[i],c=blobs[j];
      let dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy),m=a.r+c.r-4;
      const both=a.awake>.5&&c.awake>.5&&a.cd<=0&&c.cd<=0;
      if(both&&d<m+14&&d>0.01){const k=60*h;a.vx+=dx/d*k;a.vy+=dy/d*k;c.vx-=dx/d*k;c.vy-=dy/d*k}
      if(d<m&&d>0.01){const nx=dx/d,ny=dy/d,p=(m-d)*0.5;
        const key=a.id<c.id?a.id+'-'+c.id:c.id+'-'+a.id;
        if(both&&Math.hypot(a.vx,a.vy)<110&&Math.hypot(c.vx,c.vy)<110){pairT[key]=(pairT[key]||0)+h;a.sqv+=0.6*h*(1+pairT[key]);c.sqv+=0.6*h*(1+pairT[key])}
        else if(pairT[key])pairT[key]=Math.max(0,pairT[key]-h*2);a.x-=nx*p;a.y-=ny*p;c.x+=nx*p;c.y+=ny*p;
        const rv=(c.vx-a.vx)*nx+(c.vy-a.vy)*ny;if(rv<0){const J=-rv*0.55;a.vx-=nx*J;a.vy-=ny*J;c.vx+=nx*J;c.vy+=ny*J;
          if(-rv>200&&t>2){a.sqv+=-rv*0.004/Math.sqrt(a.mem.length);c.sqv+=-rv*0.004/Math.sqrt(c.mem.length);if(a.awake>.5||c.awake>.5){wake(a);wake(c)}}}
        a.touch+=h;c.touch+=h;}}
    // terrain
    for(const b of blobs){
      for(let i=0;i<TP.length-1;i++){const A=TP[i],B=TP[i+1];
        if(b.x+b.r<Math.min(A[0],B[0])-2||b.x-b.r>Math.max(A[0],B[0])+2)continue;
        const ex=B[0]-A[0],ey=B[1]-A[1],L2=ex*ex+ey*ey;let u=((b.x-A[0])*ex+(b.y-A[1])*ey)/L2;u=clamp(u,0,1);
        const qx=A[0]+ex*u,qy=A[1]+ey*u;let dx=b.x-qx,dy=b.y-qy,d=Math.hypot(dx,dy);
        // normal: terrain normal points up (left-hand of segment direction)
        const L=Math.sqrt(L2),nx0=ey/L,ny0=-ex/L;
        let side=dx*nx0+dy*ny0;
        if(side<0||d<b.r){
          let nx,ny;if(d>0.01&&side>=0){nx=dx/d;ny=dy/d}else{nx=nx0;ny=ny0;d=-Math.abs(d)}
          const pen=b.r-(side<0?-d:d);if(pen<=0)continue;
          b.x+=nx*pen;b.y+=ny*pen;
          const vn=b.vx*nx+b.vy*ny;
          if(vn<0){b.vx-=vn*nx*1.22;b.vy-=vn*ny*1.22;if(-vn>220)b.sqv+=-vn*0.0035/Math.sqrt(b.mem.length)*(b.mem.length>1?1.6:1);if(-vn>380)dust(b,nx,ny,4+b.mem.length);if(-vn>720&&b.mem.length>1&&b.cd<=0)b.splitMe=1}
          // rolling friction & spin
          const tx=-ny,ty=nx,vt=b.vx*tx+b.vy*ty;b.w=lerp(b.w,-vt/b.r,0.35);
          b.vx-=tx*vt*0.004;b.vy-=ty*vt*0.004;b.ground=true}
      }
      // walls: keep blob inside the visible frame (screen-vertical planes in world space)
      const cs=Math.cos(tilt),sn=Math.sin(tilt),ox=b.x-PIV.x,oy=b.y-PIV.y,u=ox*cs-oy*sn,lim=(W/2)/ZM-b.r*1.12-14;
      if(Math.abs(u)>lim){const sg=Math.sign(u),pen=Math.abs(u)-lim,nx=-sg*cs,ny=sg*sn;b.x+=nx*pen;b.y+=ny*pen;
        const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=vn*nx*1.35;b.vy-=vn*ny*1.35;if(-vn>200)b.sqv+=-vn*0.002}}
    }
  }
  tiltV=(tilt-tiltPrev)/Math.max(dt,1e-3);tiltPrev=tilt;
  doMerges();
  for(const b of blobs){if(Math.abs(tiltV)>1.6&&b.mem.length>1&&b.cd<=0)b.splitMe=1}
  for(const b of blobs.slice()){if(b.splitMe){b.splitMe=0;split(b)}}
  for(const b of blobs){
    b.cd=Math.max(0,b.cd-dt);b.r=lerp(b.r,b.rT,Math.min(1,dt*6));
    b.a+=b.w*dt;const sp=Math.hypot(b.vx,b.vy);
    if(!b.ground)b.w*=1-0.3*dt;
    // spring squish
    const nm=b.mem.length,kk=160/(1+0.35*(nm-1)),dd=9/(1+0.25*(nm-1));
    b.sqv+=(-b.sq*kk-b.sqv*dd)*dt;b.sq+=b.sqv*dt;b.sq=clamp(b.sq,-.38,.38);
    if(sp>300&&t>2)wake(b);
    b.happy=Math.max(0,b.happy-dt);
    b.roll=lerp(b.roll||0,(sp>70||!b.ground)?1:0,Math.min(1,dt*(sp>70?10:3)));
    if(sp>380&&b.ground&&Math.random()<dt*25)trail(b);
    if(b.awake>0.5){for(const p of props){if(!p.b&&Math.abs(p.x-b.x)<70&&Math.abs(p.y-b.y)<130){bloom(p)}}}
    if(b.touch>1.2&&b.awake>.5&&sp<60&&Math.random()<dt*0.9){heart(b.x,b.y-b.r*1.1,1);b.touch=0}
    b.touch=Math.max(0,b.touch-dt*0.3);
  }
  for(const p of props){p.bt+=p.b?dt:0;p.swv+=(-p.sw*90-p.swv*5)*dt+(Math.sin(t*1.3+p.x)*0.4)*dt;p.sw+=p.swv*dt}
  const target=0.3+0.7*bloomed/props.length;sat=lerp(sat,target,dt*1.5);
  if(bloomed===props.length&&celebrate===0){celebrate=1;for(let i=0;i<70;i++)petal(rnd(0,W),rnd(-60,H*.4),1)}
}
function doMerges(){
  for(const key in pairT){if(pairT[key]<0.75)continue;delete pairT[key];
    const [i1,i2]=key.split('-').map(Number);const a=blobs.find(b=>b.id===i1),c=blobs.find(b=>b.id===i2);if(!a||!c)continue;
    merge(a,c)}}
function merge(a,c){const A=a.r*a.r,C=c.r*c.r,k=C/(A+C);
  const big=A>=C?a:c,sm=big===a?c:a;
  parts.push({k:'ghost',x:sm.x,y:sm.y,tx:big,life:0.32,s:sm.r,a0:sm.a});
  big.x=lerp(big.x,sm.x,big===a?k:1-k);big.y=lerp(big.y,sm.y,big===a?k:1-k)-4;
  big.vx=(a.vx*A+c.vx*C)/(A+C);big.vy=(a.vy*A+c.vy*C)/(A+C);
  big.mem=big.mem.concat(sm.mem);let s2=0;for(const m of big.mem)s2+=m.r*m.r;big.rT=Math.sqrt(s2)*0.86;
  big.sqv+=-3.2;big.happy=1.1;big.cd=0.6;big.awake=1;merges++;
  blobs.splice(blobs.indexOf(sm),1);for(const kk in pairT){if(kk.split('-').includes(String(sm.id)))delete pairT[kk]}
  sparkle(big.x,big.y-big.r*0.6,8);heart(big.x,big.y-big.r*1.2,2)}
function split(b){const n=b.mem.length;if(n<2)return;blobs.splice(blobs.indexOf(b),1);splits++;
  for(let i=0;i<n;i++){const m=b.mem[i],ang=-Math.PI/2+(i-(n-1)/2)*(2.4/Math.max(1,n-1))*(n>1?1:0);
    const d=b.r*0.45,nb=mkBlob(b.x+Math.cos(ang)*d,b.y+Math.sin(ang)*d*0.6,m.r,[m]);nb.ph=m.ph;nb.awake=1;nb.happy=0.9;nb.cd=2.2;
    const sp=rnd(260,420);nb.vx=b.vx*0.5+Math.cos(ang)*sp;nb.vy=b.vy*0.5+Math.sin(ang)*sp-180;nb.w=rnd(-8,8);nb.sqv=rnd(2,3.5);nb.sq=-0.2;blobs.push(nb)}
  sparkle(b.x,b.y,22);for(let i=0;i<18;i++)petal(b.x+rnd(-b.r,b.r)*.6,b.y-rnd(0,b.r),0);
  for(let i=0;i<12;i++){const a=rnd(0,6.28),s=rnd(140,320);parts.push({k:'dust',x:b.x+Math.cos(a)*b.r*.6,y:b.y+Math.sin(a)*b.r*.6,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.4,.7),s:rnd(8,14)})}
  parts.push({k:'ring',x:b.x,y:b.y,life:0.45,s:b.r})}
function wake(b){if(b.awake<.5){b.awake=1;b.happy=1.2;sparkle(b.x,b.y-b.r,10)}}
function bloom(p){p.b=1;p.bt=0;bloomed++;for(let i=0;i<16;i++)petal(p.x+rnd(-20,20),p.y-rnd(40,110),0);p.swv+=6}

// ---------- particles ----------
function petal(x,y,big){parts.push({k:'petal',x,y,vx:rnd(-120,120),vy:rnd(-260,-60),life:rnd(1.6,3)+(big?2:0),a:rnd(0,6),va:rnd(-6,6),s:rnd(5,10),c:['#f6a7b9','#ffd27a','#fff1d6','#f59c6a','#c7e39a'][Math.random()*5|0],big})}
function sparkle(x,y,n){for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(80,260);parts.push({k:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.5,.9),s:rnd(3,7)})}}
function heart(x,y,n){for(let i=0;i<n;i++)parts.push({k:'heart',x:x+rnd(-10,10),y,vx:rnd(-20,20),vy:rnd(-90,-60),life:1.4,s:rnd(9,13)})}
function dust(b,nx,ny,n){for(let i=0;i<n;i++)parts.push({k:'dust',x:b.x-nx*b.r,y:b.y-ny*b.r,vx:rnd(-90,90),vy:rnd(-80,-20),life:rnd(.4,.8),s:rnd(6,12)})}
function trail(b){parts.push({k:'leaf',x:b.x+rnd(-8,8),y:b.y+b.r*0.7,vx:-b.vx*0.15+rnd(-40,40),vy:rnd(-120,-40),life:rnd(.6,1.1),a:rnd(0,6),va:rnd(-8,8),s:rnd(4,7)})}
const pollen=[];for(let i=0;i<40;i++)pollen.push({x:rnd(0,W),y:rnd(0,H),s:rnd(1,2.6),p:rnd(0,9)});
function stepParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}
  if(p.k==='ghost'){const q=1-p.life/0.32;p.x=lerp(p.x,p.tx.x,q*0.5);p.y=lerp(p.y,p.tx.y,q*0.5);continue}if(p.k==='ring')continue;
  p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k==='petal'||p.k==='leaf'){p.vy+=160*dt;p.vx*=1-1.2*dt;p.vy=Math.min(p.vy,90);p.a+=p.va*dt}
  else if(p.k==='spark'){p.vx*=1-4*dt;p.vy*=1-4*dt}else if(p.k==='dust'){p.vx*=1-3*dt;p.vy*=1-3*dt}}}

// ---------- drawing ----------
function grayCopy(src,amt,w,h){const c=document.createElement('canvas');c.width=w||src.width;c.height=h||src.height;const x=c.getContext('2d');x.filter=`saturate(${amt})`;x.drawImage(src,0,0,c.width,c.height);return c}
let GBG=null,TER=null,TERG=null,PROPG=null,IDLEG=null;
function prep(){if(GBG)return;GBG=grayCopy(IM.bg,0.12);PROPG=grayCopy(IM.props,0.15);IDLEG=grayCopy(IM.idle,0.5);
  TER=document.createElement('canvas');TER.width=1900;TER.height=1500;const x=TER.getContext('2d');x.translate(320,180);
  const keep=ctx;ctx=x;drawTerrainRaw();ctx=keep;TERG=grayCopy(TER,0.12)}
let FR=null;
function frames(){ // strips are 8 frames horizontally
  if(FR)return FR;FR={};for(const k of ['roll','idle']){const im=IM[k];FR[k]={im,w:im.width/8,h:im.height}}
  const pi=IM.props;FR.props={im:pi,w:pi.width/8,h:pi.height};return FR}
function drawBg(){
  const im=IM.bg,s=Math.max(W*1.25/im.width,H*1.25/im.height),w=im.width*s,h=im.height*s,x=(W-w)/2-tilt*120,y=(H-h)/2-30;
  ctx.drawImage(im,x,y,w,h);const k=clamp((1-sat)/0.7,0,1);if(k>0.01){ctx.globalAlpha=k*0.85;ctx.drawImage(GBG,x,y,w,h);ctx.globalAlpha=1}
}
let SOIL=null;
function drawTerrain(){ctx.drawImage(TER,-320,-180);const k=clamp((1-sat)/0.7,0,1);if(k>0.01){ctx.globalAlpha=k*0.85;ctx.drawImage(TERG,-320,-180);ctx.globalAlpha=1}}

function drawTerrainRaw(){
  const g=IM.ground,th=300,sf=0.29,tw=g.width*(th/g.height),off=-sf*th+12;
  if(!SOIL){const c=document.createElement('canvas'),sy=g.height*(sf+0.06),sh=g.height-sy,k=470/g.height;
    const tw2=Math.round(g.width*k),th2=Math.round(sh*k);c.width=tw2*2;c.height=th2*2;const x=c.getContext('2d');
    for(const [mx,my] of [[0,0],[1,0],[0,1],[1,1]]){x.save();x.translate(mx?tw2*2:0,my?th2*2:0);x.scale(mx?-1:1,my?-1:1);x.drawImage(g,0,sy,g.width,sh,0,0,tw2,th2);x.restore()}
    SOIL={c}}SOIL.p=ctx.createPattern(SOIL.c,'repeat');SOIL.p2=ctx.createPattern(SOIL.c,'repeat');
  ctx.save();
  ctx.beginPath();ctx.moveTo(TP[0][0],TP[0][1]+8);for(const p of TP)ctx.lineTo(p[0],p[1]+8);ctx.lineTo(1560,1310);ctx.lineTo(-310,1310);ctx.closePath();
  ctx.fillStyle='#6b4430';ctx.fill();ctx.save();ctx.clip();ctx.save();ctx.translate(-137,560);ctx.fillStyle=SOIL.p;ctx.fillRect(-400,-900,2400,2400);ctx.restore();
  // second pass: same soil, rotated + scaled + random offset, soft-light blended in patches so the tiling period disappears
  const M=document.createElement('canvas');M.width=1900;M.height=1500;const mx=M.getContext('2d');
  mx.save();mx.translate(320+rnd(0,400),180+rnd(0,300));mx.rotate(0.21);mx.scale(1.37,1.37);mx.fillStyle=SOIL.p2;mx.fillRect(-900,-900,2600,2400);mx.restore();
  // soft random blotch mask (no straight edges)
  const MK=document.createElement('canvas');MK.width=1900;MK.height=1500;const mk=MK.getContext('2d');
  for(let i=0;i<34;i++){const x=rnd(0,1900),y=rnd(200,1500),r=rnd(160,380),g=mk.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(1,'rgba(0,0,0,0)');mk.fillStyle=g;mk.fillRect(x-r,y-r,r*2,r*2)}
  mx.globalCompositeOperation='destination-in';mx.drawImage(MK,0,0);
  ctx.drawImage(M,-320,-180);
  ctx.restore();
  // soft darker band under the grass line
  const STEP=5,gh=g.height*(sf+0.08);
  for(let x=-280;x<1480;x+=STEP){const y=groundY(x+STEP/2);const q=(x+2000)/tw,ti=Math.floor(q);let u=q-ti;if(ti%2)u=1-u;
    const sw=STEP*(g.width/tw);let sx=u*g.width-(ti%2?sw:0);sx=clamp(sx,0,g.width-sw);ctx.drawImage(g,sx,0,sw,gh,x,y+off,STEP+0.6,gh*th/g.height)}
  ctx.restore();
}
function drawProps(){
  const F=frames().props;
  for(const p of props){const e=p.b?easeBack(p.bt/0.7):0;const sc=p.sc*(0.28+0.72*e);
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.sw*0.08+tilt*-0.3*(p.b?1:0.3));
    ctx.globalAlpha=p.b?1:0.8;
    const w=F.w*sc,h=F.h*sc;ctx.drawImage(p.b?F.im:PROPG,p.k*F.w,0,F.w,F.h,-w/2,-h+4,w,h);
    if(p.b&&p.bt<1.2){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=(1-p.bt/1.2)*0.6;const gr=ctx.createRadialGradient(0,-h*0.6,0,0,-h*0.6,h*0.8);
      gr.addColorStop(0,'rgba(255,230,160,.9)');gr.addColorStop(1,'rgba(255,230,160,0)');ctx.fillStyle=gr;ctx.fillRect(-h,-h*1.4,h*2,h*1.6)}
    ctx.restore()}
}
function drawBlob(b){
  const F=frames();
  // shadow
  ctx.save();ctx.globalAlpha=0.22;ctx.fillStyle='#3a2416';ctx.beginPath();const gy=groundY(b.x);
  const dist=clamp((gy-b.y-b.r)/200,0,1);ctx.ellipse(b.x,gy+4,b.r*(1-dist*0.5),b.r*0.22*(1-dist*0.5),0,0,6.28);ctx.fill();ctx.restore();
  const s=b.sq,sx=1+s,sy=1-s;
  ctx.save();ctx.translate(b.x,b.y+b.r*s*0.6);
  const D=b.r*2.55;
  // roll sprite
  const big=b.mem.length>1,jig=big?Math.sin(t*7+b.ph)*0.025*Math.min(1,Math.hypot(b.vx,b.vy)/200+0.4):0;
  if(b.roll>=0.5&&b.awake<.5){ // asleep: keep the sleeping pose, just turn the whole sprite
    ctx.save();ctx.rotate(b.a);ctx.scale(sx,sy);const f=F.idle,sc=b.r*2.25/f.h,fi=Math.floor(t*1.2+b.ph)%2;
    ctx.drawImage(IDLEG,fi*f.w,0,f.w,f.h,-f.w*sc/2,-f.h*sc*0.56,f.w*sc,f.h*sc);ctx.restore()}
  else if(b.roll>=0.5){ctx.save();
    const ST=6.2832/8,ang=((b.a%6.2832)+6.2832)%6.2832,q=ang/ST,fi=Math.floor(q)%8,fj=(fi+1)%8,k=q-Math.floor(q);
    ctx.scale(sx+jig,sy-jig);const f=F.roll;const sc=b.r*2.12/f.h,ww=f.w*sc,hh=f.h*sc;
    // remaining-angle interpolation: both neighbour frames turned by their own residual, crossfaded by fraction
    ctx.save();ctx.rotate(k*ST);ctx.drawImage(f.im,fi*f.w,0,f.w,f.h,-ww/2,-hh/2,ww,hh);ctx.restore();
    const kf=k*k*(3-2*k);if(kf>0.02){ctx.save();ctx.globalAlpha=kf;ctx.rotate((k-1)*ST);ctx.drawImage(f.im,fj*f.w,0,f.w,f.h,-ww/2,-hh/2,ww,hh);ctx.restore()}
    ctx.restore()}
  else{ctx.save();ctx.rotate(-tilt);ctx.scale(sx,sy);
    let fi;if(b.awake<.5){fi=Math.floor(t*1.2+b.ph)%2}
    else if(b.happy>0){fi=b.happy>0.6?5:6}
    else if(big){const c=(t*1.6+b.ph)%7;fi=c<0.25?7:c<3.5?5:c<3.8?7:c<6?4:3}
    else{const c=(t*2.2+b.ph)%9;fi=c<0.25?7:c<5?4:c<5.3?7:c<8?4:5}
    const f=F.idle,sc=b.r*2.25/f.h;const br=1+Math.sin(t*2+b.ph)*0.02*(b.awake<.5?2:1);
    ctx.scale(1/br+jig,br-jig);ctx.drawImage(b.awake<.5?IDLEG:f.im,fi*f.w,0,f.w,f.h,-f.w*sc/2,b.r*1.02-f.h*sc,f.w*sc,f.h*sc);
    ctx.restore()}
  ctx.restore();
  if(b.awake<.5&&b.roll<0.5){ctx.save();ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='bold 18px sans-serif';const z=(t*0.7+b.ph)%1;
    ctx.globalAlpha=Math.sin(z*3.14);ctx.fillText('z',b.x+b.r*0.6+z*14,b.y-b.r-z*30);ctx.restore()}
}
function drawParts(){
  for(const p of parts){const a=clamp(p.life,0,1);ctx.save();ctx.globalAlpha=a;ctx.translate(p.x,p.y);
    if(p.k==='petal'||p.k==='leaf'){ctx.rotate(p.a);ctx.fillStyle=p.k==='leaf'?'#8fbf5a':p.c;ctx.beginPath();ctx.ellipse(0,0,p.s,p.s*0.5,0,0,6.28);ctx.fill()}
    else if(p.k==='spark'){ctx.globalCompositeOperation='lighter';ctx.fillStyle='#ffe7a0';ctx.beginPath();const s=p.s*a;
      ctx.moveTo(0,-s*2);ctx.lineTo(s*.5,0);ctx.lineTo(0,s*2);ctx.lineTo(-s*.5,0);ctx.closePath();ctx.moveTo(-s*2,0);ctx.lineTo(0,s*.5);ctx.lineTo(s*2,0);ctx.lineTo(0,-s*.5);ctx.closePath();ctx.fill()}
    else if(p.k==='dust'){ctx.fillStyle='rgba(230,210,180,.6)';ctx.beginPath();ctx.arc(0,0,p.s*(1.5-a*.5),0,6.28);ctx.fill()}
    else if(p.k==='ghost'){const q=p.life/0.32;ctx.globalAlpha=q;const f=frames().idle,sc=p.s*2.25/f.h*(0.55+0.45*q);ctx.scale(1+(1-q)*0.3,1-(1-q)*0.25);
      ctx.drawImage(f.im,4*f.w,0,f.w,f.h,-f.w*sc/2,-f.h*sc/2,f.w*sc,f.h*sc)}
    else if(p.k==='ring'){const q=1-p.life/0.45;ctx.globalAlpha=(1-q)*0.8;ctx.globalCompositeOperation='lighter';ctx.strokeStyle='#ffe9b0';ctx.lineWidth=10*(1-q)+2;ctx.beginPath();ctx.arc(0,0,p.s*(0.6+q*1.4),0,6.28);ctx.stroke()}
    else if(p.k==='heart'){ctx.fillStyle='#ff8fa8';const s=p.s;ctx.beginPath();ctx.moveTo(0,s*.3);ctx.bezierCurveTo(-s,-s*.5,-s*.4,-s*1.2,0,-s*.5);ctx.bezierCurveTo(s*.4,-s*1.2,s,-s*.5,0,s*.3);ctx.fill()}
    ctx.restore()}
}
function drawLight(){
  ctx.save();ctx.globalCompositeOperation='screen';
  const sx=W*0.78-tilt*200,sy=120;const g=ctx.createRadialGradient(sx,sy,0,sx,sy,700);
  g.addColorStop(0,`rgba(255,214,150,${0.30+sat*0.25})`);g.addColorStop(0.5,`rgba(255,180,140,${0.08+sat*0.08})`);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // god rays
  ctx.translate(sx,sy);for(let i=0;i<7;i++){ctx.save();ctx.rotate(0.9+i*0.22+Math.sin(t*0.3+i)*0.04);
    ctx.fillStyle=`rgba(255,235,190,${(0.035+sat*0.05)*(0.6+0.4*Math.sin(t*0.8+i*2))})`;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(1100,-60);ctx.lineTo(1100,60);ctx.fill();ctx.restore()}
  ctx.restore();
  // pollen
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of pollen){const x=(p.x+t*12+Math.sin(t*0.7+p.p)*20)%W,y=(p.y+Math.sin(t*0.5+p.p)*15);
    ctx.globalAlpha=(0.25+0.5*sat)*(0.5+0.5*Math.sin(t*2+p.p));ctx.fillStyle='#fff2c0';ctx.beginPath();ctx.arc(x,y,p.s,0,6.28);ctx.fill()}
  ctx.restore();
  // paper vignette
  const v=ctx.createRadialGradient(W/2,H/2,H*0.4,W/2,H/2,H*0.95);v.addColorStop(0,'rgba(60,30,20,0)');v.addColorStop(1,'rgba(60,30,20,.35)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
function drawUI(){
  ctx.save();let awake=0,maxN=1;for(const b of blobs){if(b.awake>.5)awake+=b.mem.length;maxN=Math.max(maxN,b.mem.length)}
  ctx.fillStyle='rgba(255,248,235,.82)';ctx.beginPath();ctx.roundRect(24,22,maxN>1?330:250,64,18);ctx.fill();
  ctx.fillStyle='#6b4a36';ctx.font='bold 22px KL,sans-serif';ctx.fillText('狐兔团子山谷',44,50);
  ctx.font='16px KL,sans-serif';ctx.fillText(`醒来 ${awake}/${TOTAL}  ·  花开 ${bloomed}/${props.length}`+(maxN>1?`  ·  合体 ×${maxN}`:''),44,74);
  // tilt gauge
  ctx.translate(W-90,58);ctx.fillStyle='rgba(255,248,235,.82)';ctx.beginPath();ctx.arc(0,0,34,0,6.28);ctx.fill();
  ctx.rotate(tilt);ctx.strokeStyle='#8a5a3c';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-22,0);ctx.lineTo(22,0);ctx.stroke();
  ctx.fillStyle='#f39a6b';ctx.beginPath();ctx.arc(clamp(tilt*60,-18,18),-7,6,0,6.28);ctx.fill();ctx.restore();
  if(t<6&&!window.__rec){ctx.save();ctx.globalAlpha=clamp(6-t,0,1);ctx.fillStyle='rgba(255,248,235,.85)';ctx.beginPath();ctx.roundRect(W/2-230,H-70,460,44,22);ctx.fill();
    ctx.fillStyle='#6b4a36';ctx.font='17px KL,sans-serif';ctx.textAlign='center';ctx.fillText('倾斜让团子滚起来、挤一起合体；用力一甩或点大团子就分开',W/2,H-42);ctx.restore()}
}
function render(){
  ctx.clearRect(0,0,W,H);drawBg();
  ctx.save();ctx.translate(PIV.x,PSY);ctx.scale(ZM,ZM);ctx.rotate(tilt);ctx.translate(-PIV.x,-PIV.y);
  drawTerrain();drawProps();for(const b of blobs)drawBlob(b);drawParts();ctx.restore();
  drawLight();drawUI();
}

// ---------- input ----------
function toWorld(x,y){const dx=(x-PIV.x)/ZM,dy=(y-PSY)/ZM,c=Math.cos(-tilt),s=Math.sin(-tilt);return{x:PIV.x+dx*c-dy*s,y:PIV.y+dx*s+dy*c}}
function tap(sx,sy){const p=toWorld(sx,sy);let best=null,bd=1e9;
  for(const b of blobs){const d=Math.hypot(b.x-p.x,b.y-p.y);if(d<b.r*1.6&&d<bd){bd=d;best=b}}
  if(best&&best.mem.length>1){split(best)}
  else if(best){const b=best;wake(b);b.happy=1;b.vy-=rnd(520,640);b.vx+=rnd(-60,60)+Math.sin(tilt)*-200;b.w+=rnd(-4,4);b.sqv-=2.5;sparkle(b.x,b.y-b.r,8);heart(b.x,b.y-b.r*1.3,2)}
  else{for(let i=0;i<5;i++)petal(p.x,p.y,0)}}
function canvasXY(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{askGyro();const p=canvasXY(e);drag={x0:p.x,t0:tiltT,moved:false,p};});
addEventListener('pointermove',e=>{if(!drag)return;const p=canvasXY(e);const dx=p.x-drag.x0;if(Math.abs(dx)>8)drag.moved=true;if(drag.moved&&!gyro)tiltT=clamp(drag.t0+dx/W*1.2,-0.42,0.42)});
addEventListener('pointerup',e=>{if(drag&&!drag.moved)tap(drag.p.x,drag.p.y);drag=null});
const keys={};addEventListener('keydown',e=>{keys[e.key]=1});addEventListener('keyup',e=>{keys[e.key]=0});
let gyroAsked=false;function askGyro(){if(gyroAsked)return;gyroAsked=true;
  if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission){DeviceOrientationEvent.requestPermission().then(s=>{if(s==='granted')listenGyro()}).catch(()=>{})}}
function listenGyro(){addEventListener('deviceorientation',e=>{if(e.gamma==null)return;const land=Math.abs(window.orientation||0)===90;
  let g=land?(e.beta*(window.orientation>0?1:-1)):e.gamma;gyro=g;tiltT=clamp(g/45*0.42,-0.42,0.42)})}
if(window.DeviceOrientationEvent&&!DeviceOrientationEvent.requestPermission)listenGyro();

// ---------- loop ----------
let last=0;
function loop(ts){requestAnimationFrame(loop);if(loaded<NIM){ctx.fillStyle='#f3e6d6';ctx.fillRect(0,0,W,H);return}
  prep();const dt=Math.min(0.033,last?(ts-last)/1000:0.016);last=ts;t+=dt;
  if(keys.ArrowLeft||keys.a)tiltT=clamp(tiltT-dt*0.9,-0.42,0.42);else if(keys.ArrowRight||keys.d)tiltT=clamp(tiltT+dt*0.9,-0.42,0.42);
  else if(!drag&&gyro==null&&(keyT=0,false)){}
  step(dt);stepParts(dt);render()}
requestAnimationFrame(loop);
window.__api={W,H,setTilt:v=>{tiltT=v},tap:(x,y)=>tap(x,y),blobs:()=>blobs,
  blobScreen:i=>{const b=blobs[i],dx=b.x-PIV.x,dy=b.y-PIV.y,c=Math.cos(tilt),s=Math.sin(tilt);return{x:PIV.x+(dx*c-dy*s)*ZM,y:PSY+(dx*s+dy*c)*ZM}},ready:()=>loaded>=NIM,
  bigIdx:()=>{let m=0;blobs.forEach((b,i)=>{if(b.mem.length>blobs[m].mem.length)m=i});return m},
  blobAt:i=>blobs[i],stats:()=>({aw:blobs.filter(b=>b.awake>.5).reduce((s,b)=>s+b.mem.length,0),n:blobs.length,merges,splits,max:Math.max(...blobs.map(b=>b.mem.length))})};
</script></body></html>
