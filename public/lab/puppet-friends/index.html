  order:['tail','legs','torso','ears','head','armsFront']},
 {id:'sheep',name:'云羊',x:900,sc:0.40,faces:['head','h_happy','h_wink','h_oh'],closed:'h_happy',
  PIV:{torso:[217,175],head:[254,405],ua:[57,30],fa:[42,18],th:[71,30],sh:[47,16]},
  J:{neck:[0,-120],shR:[118,-70],shL:[-118,-70],hipR:[70,45],hipL:[-70,45],tail:[175,-30]},UA:115,TH:110,SHN:128,
  fadeTop:{fa:14,sh:14},
  chains:{cap:{im:'cap',axis:0,piv:[262,175],cuts:[[175,[175,120]],[95,[95,150]]],k:[70,40],g:[0.4,0.8],lim:0.32,rev:1,bias:2}},
  puffs:[{im:'puff1',at:[-95,70],piv:[122,92],ph:0},{im:'puff2',at:[100,78],piv:[94,77],ph:1.7},{im:'puff3',at:[-150,-20],piv:[74,70],ph:3.1}],
  order:['tail','legs','torso','puffs','armsFront','head','cap']}
];
const MOVES={dance:'跳舞',cheer:'欢呼',jump:'蹦跳',wave:'挥手'};
const SYNC=['dance','cheer','jump','dance','wave'];
const SOLO={wiz:['wave','cheer','dance'],kit:['dance','jump','dance'],sheep:['jump','dance','cheer']};
const SOLO_RATE={wiz:0.9,kit:1.0,sheep:1.12};
function splitSeg(im,axis,lo,hi,f){const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const g=c.getContext('2d');g.drawImage(im,0,0);
  g.globalCompositeOperation='destination-in';const L=axis?im.height:im.width;const s=v=>Math.max(0,Math.min(1,v/2/L));
  const gr=axis?g.createLinearGradient(0,0,0,L):g.createLinearGradient(0,0,L,0);
  const a=lo===null?null:lo,b=hi===null?null:hi;
  // opaque on [a,b], ramp out f beyond each finite end
  if(a!==null){gr.addColorStop(s(a-f),'rgba(0,0,0,0)');gr.addColorStop(s(a),'#000')}else gr.addColorStop(0,'#000');
  if(b!==null){gr.addColorStop(s(b),'#000');gr.addColorStop(s(b+f),'rgba(0,0,0,0)')}else gr.addColorStop(1,'#000');
  g.fillStyle=gr;g.fillRect(0,0,c.width,c.height);return c}
function fadeTopImg(im,px){const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const g=c.getContext('2d');g.drawImage(im,0,0);
  g.globalCompositeOperation='destination-in';const gr=g.createLinearGradient(0,0,0,im.height);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(Math.min(1,px/im.height),'#000');gr.addColorStop(1,'#000');g.fillStyle=gr;g.fillRect(0,0,c.width,c.height);return c}
CH.forEach(c=>{const P=c.id+'_';c.im={};['torso','head','ua1','ua2','fa1','fa2','th1','th2','sh1','sh2',...c.faces].forEach(n=>c.im[n]=img(P+n));
  if(c.id==='kit'){['earA','earB','tail'].forEach(n=>c.im[n]=img(P+n))}
  if(c.chains)for(const k in c.chains)c.im[c.chains[k].im]=img(P+c.chains[k].im);
  if(c.puffs)c.puffs.forEach(p=>c.im[p.im]=img(P+p.im));if(c.id==='sheep')c.im.tail=img(P+'tail');
  c.S={clip:'dance',t:0,face:'head',blink:0,blinkT:1.5+Math.random()*2,prev:null,fade:0,rate:1,spr:{},lastHead:null,lastV:null,soloI:0,pose:null,hop:0};});
function prep(){CH.forEach(c=>{
  if(c.fadeTop)for(const k in c.fadeTop)for(const s of ['1','2'])c.im[k+s]=fadeTopImg(c.im[k+s],c.fadeTop[k]/2);
  c.seg={};if(c.chains)for(const k in c.chains){const ch=c.chains[k],im=c.im[ch.im];const cuts=ch.cuts.map(q=>q[0]/2);const f=14;const segs=[];
    // segment 0 = root side. rev:1 means root sits at the high coordinate end
    for(let i=0;i<=cuts.length;i++){let lo,hi;if(ch.rev){hi=i===0?null:cuts[i-1];lo=i===cuts.length?null:cuts[i]}else{lo=i===0?null:cuts[i-1];hi=i===cuts.length?null:cuts[i]}segs.push(splitSeg(im,ch.axis,lo,hi,f))}
    c.seg[k]=segs;c.S.spr[k]=new Array(segs.length*2).fill(0)}
  if(c.id==='kit'){const sp=(im,cut,f,top)=>{const a=top?null:cut/2,b=top?cut/2:null;return splitSeg(im,1,a,b,f/2)};
    for(const e of ['earA','earB'])c.seg[e]=[sp(c.im[e],240,30,true),sp(c.im[e],240,30,false)];c.seg.tail=[sp(c.im.tail,295,40,false),sp(c.im.tail,295,40,true)];
    c.S.spr.earL=[0,0,0,0];c.S.spr.earR=[0,0,0,0];c.S.spr.tail=[0,0,0,0]}
  if(c.puffs)c.S.spr.puffs=c.puffs.map(()=>[0,0,0,0]);});
  setMode('sync');requestAnimationFrame(loop)}
// ---------- motion ----------
const KEYS=['torso','head','uaL','faL','uaR','faR','thL','shL','thR','shR','rx','lift'];
const wrap=(a,b)=>{while(b-a>Math.PI)b-=2*Math.PI;while(a-b>Math.PI)b+=2*Math.PI;return b};
function sample(c,t){const C=CLIPS[c];const f=((t*C.fps)%C.n+C.n)%C.n,i=Math.floor(f),j=(i+1)%C.n,u=f-i;const o={};
  for(const k of KEYS){let a=C[k][i],b=C[k][j];if(k!=='rx'&&k!=='lift')b=wrap(a,b);o[k]=a+(b-a)*u}return o}
function blend(a,b,u){const o={};for(const k of KEYS){let x=a[k],y=b[k];if(k!=='rx'&&k!=='lift')y=wrap(x,y);o[k]=x+(y-x)*u}return o}
function shape(p,c){const q={...p};const lim=(v,m)=>Math.max(-m,Math.min(m,v));const m=c.id==='sheep'?0.9:1.3;
  q.thL=lim(q.thL,m);q.thR=lim(q.thR,m);q.torso=lim(q.torso,0.4);q.head=lim(q.head,0.38);
  q.shL=q.thL+lim(q.shL-q.thL,1.1);q.shR=q.thR+lim(q.shR-q.thR,1.1);return q}
function fk(c,p){const J=c.J,T={};const tr=-p.torso;T.torso={o:[0,0],a:tr};const at=v=>rot(v,tr);T.neck=at(J.neck);T.head={o:T.neck,a:tr-p.head};
  for(const [s,sh,hp,n] of [['L',J.shR,J.hipR,'2'],['R',J.shL,J.hipL,'1']]){
    const so=at(sh),a1=-p['ua'+s],a2=-p['fa'+s];T['ua'+s]={o:so,a:a1,im:'ua'+n};const eo=add(so,rot([0,c.UA],a1));T['fa'+s]={o:eo,a:a2,im:'fa'+n};
    const ho=at(hp),b1=-p['th'+s],b2=-p['sh'+s];T['th'+s]={o:ho,a:b1,im:'th'+n};const ko=add(ho,rot([0,c.TH],b1));T['sh'+s]={o:ko,a:b2,im:'sh'+n};T['foot'+s]=add(ko,rot([0,c.SHN],b2))}
  if(J.tail)T.tail={o:at(J.tail),a:tr};
  if(J.earL){const ha=T.head.a;T.earL={o:add(T.neck,rot(J.earL,ha)),a:ha};T.earR={o:add(T.neck,rot(J.earR,ha)),a:ha}}return T}
function springN(s,acc,dt,k,c,g,bias){const n=s.length/2;for(let i=0;i<n;i++){const kk=k[Math.min(i,k.length-1)],gg=g[Math.min(i,g.length-1)];
  const tq=-kk*s[2*i]-c*s[2*i+1]+acc*gg+(i?-kk*0.5*(s[2*i]-s[2*i-2]):0)+(bias||0)*(i+1);s[2*i+1]+=tq*dt;s[2*i]+=s[2*i+1]*dt;s[2*i]=Math.max(-0.9,Math.min(0.9,s[2*i]))}}
let MODE='sync',G={t:0,beat:0,pulse:0,syncI:0,syncT:0,confetti:[]};
const BPM=112;
function setClip(c,k){if(k===c.S.clip&&c.S.pose)return;c.S.prev=c.S.pose;c.S.fade=c.S.prev?1:0;c.S.clip=k;
  c.S.face=k==='wave'?'h_happy':k==='jump'?'h_oh':k==='cheer'?'h_wink':'head';if(c.id==='kit'&&k==='wave')c.S.face='h_smile'}
function setMode(m){MODE=m;[...document.querySelectorAll('#bar button')].forEach(b=>b.classList.toggle('on',b.dataset.m===m));G.syncT=0;
  if(m==='sync'){G.syncI=0;CH.forEach(c=>{setClip(c,SYNC[0]);c.S.t=0;c.S.rate=1})}
  else CH.forEach((c,i)=>{c.S.soloI=0;setClip(c,SOLO[c.id][0]);c.S.t=i*0.37;c.S.rate=SOLO_RATE[c.id];c.S.soloT=4.5+i*1.6});burst(18,600)}
const BC=['#ffd27a','#ff9ec4','#9ee8ff','#c6ff9e'];
function burst(n,x){for(let i=0;i<n;i++)G.confetti.push({x:x+(Math.random()-.5)*300,y:300,vx:(Math.random()-.5)*300,vy:-200-Math.random()*240,r:Math.random()*6.28,vr:(Math.random()-.5)*10,c:BC[i%4],life:1.6})}
let lastTs=null;
function loop(ts){requestAnimationFrame(loop);if(lastTs===null)lastTs=ts;let dt=Math.min(0.05,(ts-lastTs)/1000);lastTs=ts;if(dt<=0)dt=1/60;step(dt);draw(dt)}
function step(dt){G.t+=dt;const nb=Math.floor(G.t*BPM/60);if(nb!==G.beat){G.beat=nb;G.pulse=1;if(nb%4===0)burst(5,600)}G.pulse=Math.max(0,G.pulse-dt*3.2);
  if(MODE==='sync'){G.syncT+=dt;const L=CLIPS[SYNC[G.syncI]];const dur=Math.max(4.2,Math.ceil(4.2/(L.n/L.fps))*(L.n/L.fps));
    if(G.syncT>dur){G.syncT=0;G.syncI=(G.syncI+1)%SYNC.length;CH.forEach(c=>{setClip(c,SYNC[G.syncI]);c.S.t=0});burst(12,600)}}
  else CH.forEach(c=>{c.S.soloT-=dt;if(c.S.soloT<0){const L=SOLO[c.id];c.S.soloI=(c.S.soloI+1)%L.length;setClip(c,L[c.S.soloI]);c.S.t=0;c.S.soloT=5+Math.random()*2;burst(6,c.x)}});
  CH.forEach(c=>{const S=c.S;S.t+=dt*S.rate;let p=sample(S.clip,S.t);if(S.fade>0&&S.prev){S.fade=Math.max(0,S.fade-dt/0.35);const u=1-S.fade;p=blend(S.prev,p,u*u*(3-2*u))}S.pose=p;
    S.blinkT-=dt;if(S.blinkT<0){S.blink=0.13;S.blinkT=2.2+Math.random()*2.5}S.blink=Math.max(0,S.blink-dt)});
  G.confetti=G.confetti.filter(q=>(q.life-=dt)>0);G.confetti.forEach(q=>{q.vy+=520*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.r+=q.vr*dt})}
const BULBS=[[157,32],[200,55],[240,72],[290,90],[338,103],[385,113],[430,122],[480,125],[530,124],[578,118],[625,107],[664,92],[700,76],[145,105],[175,118],[210,130],[245,140],[280,145],[315,146],[345,138],[375,135]].map(([x,y])=>[x*1.435,y*1.435]);
function dpart(im,p){ctx.drawImage(im,-p[0],-p[1],im.width*2,im.height*2)}
const put=(o,a,f)=>{ctx.save();ctx.translate(o[0],o[1]);ctx.rotate(a);f();ctx.restore()};
function drawChain(c,k,dt,acc){const ch=c.chains[k],segs=c.seg[k],s=c.S.spr[k];springN(s,acc,dt,ch.k,6,ch.g,Math.sin(G.t*Math.PI*2*BPM/120)*(ch.bias||3));
  // nested: segment i rotates about cut i-1 pivot
  const pts=[ch.piv,...ch.cuts.map(q=>q[1])];
  const rec=i=>{if(i>=segs.length)return;const pv=pts[i];ctx.save();if(i)ctx.translate(pv[0]-pts[i-1][0],pv[1]-pts[i-1][1]);ctx.rotate(s[2*i]*(ch.lim||1)*1.4);
    ctx.drawImage(segs[i],-pv[0],-pv[1],segs[i].width*2,segs[i].height*2);rec(i+1);ctx.restore()};
  // draw root first, children on top
  ctx.save();rec(0);ctx.restore()}
function drawChar(c,dt){const S=c.S;if(!S.pose)return;const p=shape(S.pose,c),T=fk(c,p);const sc=c.sc;
  const low=Math.max(T.footL[1],T.footR[1]);const L=c.TH+c.SHN;const hipY=FLOOR-(low+6)*sc-p.lift*L*sc*0.9;const sway=p.rx*L*sc*0.4;const hx=c.x+sway;
  c.R={hip:[hx,hipY],top:hipY+(T.neck[1]-c.PIV.head[1]*0.9)*sc};
  const air=p.lift;ctx.fillStyle='rgba(30,15,10,'+(0.35-0.2*Math.min(1,air*2))+')';ctx.beginPath();ctx.ellipse(hx,FLOOR-2,80*(1-0.3*Math.min(1,air*2)),14,0,0,7);ctx.fill();
  ctx.save();ctx.translate(hx,hipY);ctx.scale(sc,sc);
  const hw=[hx+T.neck[0]*sc,hipY+T.neck[1]*sc];let acc=0;
  if(S.lastHead){const v=[hw[0]-S.lastHead[0],hw[1]-S.lastHead[1]];if(S.lastV)acc=(v[0]-S.lastV[0])*60;S.lastV=v}S.lastHead=hw;
  const im=c.im,PV=c.PIV;
  for(const part of c.order){
   if(part==='legs')for(const s of ['R','L']){put(T['sh'+s].o,T['sh'+s].a,()=>dpart(im[T['sh'+s].im],PV.sh));put(T['th'+s].o,T['th'+s].a,()=>dpart(im[T['th'+s].im],PV.th))}
   else if(part==='arms')for(const s of ['R','L']){put(T['fa'+s].o,T['fa'+s].a,()=>dpart(im[T['fa'+s].im],PV.fa));put(T['ua'+s].o,T['ua'+s].a,()=>dpart(im[T['ua'+s].im],PV.ua))}
   else if(part==='armsFront')for(const s of ['R','L']){if(c.id==='sheep'){put(T['fa'+s].o,T['fa'+s].a,()=>dpart(im[T['fa'+s].im],PV.fa));put(T['ua'+s].o,T['ua'+s].a,()=>dpart(im[T['ua'+s].im],PV.ua))}else{put(T['ua'+s].o,T['ua'+s].a,()=>dpart(im[T['ua'+s].im],PV.ua));put(T['fa'+s].o,T['fa'+s].a,()=>dpart(im[T['fa'+s].im],PV.fa))}}
   else if(part==='torso')put(T.torso.o,T.torso.a,()=>dpart(im.torso,PV.torso));
   else if(part==='head'){let face=S.face;if(S.blink>0&&(face==='head'||face==='h_smile'||face==='h_oh'))face=c.closed;put(T.head.o,T.head.a,()=>dpart(im[face],face==='head'?PV.head:(PV.h||PV.head)))}
   else if(part==='cape')put(T.neck,T.torso.a,()=>{ctx.translate(0,8);drawChain(c,'cape',dt,acc)});
   else if(part==='hat')put(T.head.o,T.head.a,()=>{ctx.translate(-4,-180);ctx.rotate(-0.05);drawChain(c,'hat',dt,acc)});
   else if(part==='cap')put(T.head.o,T.head.a,()=>{ctx.translate(-5,-228);ctx.rotate(-0.08);drawChain(c,'cap',dt,acc)});
   else if(part==='puffs'){put(T.torso.o,T.torso.a,()=>c.puffs.forEach((pf,i)=>{const s=S.spr.puffs[i];springN(s,acc,dt,[50,30],5,[0.5,0.8],Math.sin(G.t*Math.PI*2*BPM/120+pf.ph)*2);
      const bob=Math.sin(G.t*Math.PI*2*BPM/60+pf.ph)*4*(0.5+G.pulse);ctx.save();ctx.translate(pf.at[0]+s[2]*40,pf.at[1]+bob);ctx.rotate(s[0]*0.6);const sq=1+0.04*Math.sin(G.t*7+pf.ph);ctx.scale(sq,2-sq);dpart(im[pf.im],pf.piv);ctx.restore()}))}
   else if(part==='tail'&&c.id==='sheep'){const s=S.spr.tail||(S.spr.tail=[0,0,0,0]);springN(s,acc,dt,[40],5,[-0.7],Math.sin(G.t*9)*4);put(T.tail.o,T.tail.a+s[0],()=>dpart(im.tail,[62,60]))}
   else if(part==='tail'){const ts=S.spr.tail;springN(ts,acc,dt,[40,30],5,[-0.7,-1.1],Math.sin(G.t*6.28*BPM/120)*6);
      put(T.tail.o,T.tail.a*0.5+0.15+ts[0],()=>{put([150-42,300-490],ts[2]*1.2,()=>{const g=c.seg.tail[1];ctx.drawImage(g,-150,-300,g.width*2,g.height*2)});const g=c.seg.tail[0];ctx.drawImage(g,-42,-490,g.width*2,g.height*2)})}
   else if(part==='ears'){for(const [e,n,sp] of [['earL','earA',S.spr.earL],['earR','earB',S.spr.earR]]){springN(sp,acc,dt,[60,45],7,[0.9,1.4]);const base=T[e].a*0.55+sp[0]+(e==='earL'?0.06:-0.06);
      put(T[e].o,base,()=>{put([0,200],sp[2]*1.3,()=>{const g=c.seg[n][1];ctx.drawImage(g,-103,-248,g.width*2,g.height*2)});const g=c.seg[n][0];ctx.drawImage(g,-103,-48,g.width*2,g.height*2)})}}
  }
  ctx.restore()}
function draw(dt){ctx.clearRect(0,0,1200,675);if(stage.complete)ctx.drawImage(stage,0,0,1200,675);
  ctx.fillStyle='rgba(10,8,30,0.18)';ctx.fillRect(0,0,1200,675);
  ctx.save();ctx.globalCompositeOperation='lighter';
  BULBS.forEach(([x,y],i)=>{const on=((i+G.beat)%3===0)?1:0.35;const a=0.10+0.32*on*(0.4+0.6*G.pulse);const g=ctx.createRadialGradient(x,y,0,x,y,38);g.addColorStop(0,BC[(i+G.beat)%4]);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=a;ctx.fillStyle=g;ctx.fillRect(x-40,y-40,80,80)});
  for(const [ox,col,ph] of [[160,'rgba(255,170,220,',0],[1040,'rgba(150,220,255,',1.7]]){const tx=600+Math.sin(G.t*1.1+ph)*360;ctx.globalAlpha=0.14+0.16*G.pulse;
    const g=ctx.createLinearGradient(ox,0,tx,560);g.addColorStop(0,col+'0.9)');g.addColorStop(1,col+'0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(ox-14,-10);ctx.lineTo(ox+14,-10);ctx.lineTo(tx+90,570);ctx.lineTo(tx-90,570);ctx.fill()}
  CH.forEach((c,i)=>{const on=MODE==='sync'?1:(((G.beat+i)%3)===0?1:0.45);ctx.globalAlpha=(0.16+0.22*G.pulse)*on;const x=c.x;const sg=ctx.createRadialGradient(x,FLOOR,10,x,FLOOR,150);sg.addColorStop(0,'#ffe2a0');sg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=sg;ctx.save();ctx.translate(x,FLOOR);ctx.scale(1,0.32);ctx.translate(-x,-FLOOR);ctx.fillRect(x-160,FLOOR-160,320,320);ctx.restore()});
  ctx.restore();ctx.globalAlpha=1;
  CH.forEach(c=>drawChar(c,dt));
  G.confetti.forEach(q=>{ctx.save();ctx.globalAlpha=Math.min(1,q.life);ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.fillStyle=q.c;ctx.fillRect(-5,-3,10,6);ctx.restore()})}
function hit(x,y){for(const c of CH){if(!c.R)continue;if(Math.abs(x-c.R.hip[0])<120&&y>c.R.top-30&&y<FLOOR+10)return c}return null}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*1200/r.width,y=(e.clientY-r.top)*675/r.height;const c=hit(x,y);
  if(c){const S=c.S;const i=c.faces.indexOf(S.face);S.face=c.faces[(i+1)%c.faces.length];S.blink=0;S.blinkT=3;burst(10,c.x);for(const k in S.spr){const s=S.spr[k];if(Array.isArray(s)&&typeof s[0]==='number')s[1]+=(Math.random()<.5?-4:4)}}});
document.querySelectorAll('#bar button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
window.__api={CH,G,setMode,setClip,face:(i,f)=>{CH[i].S.face=f},hit};
