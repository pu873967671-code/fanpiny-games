<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>狐兔的立体书</title>
<style>
@font-face{font-family:KL;src:url(kl.woff2) format('woff2')}
html,body{margin:0;height:100%;background:#2b2420;overflow:hidden;font-family:KL,'PingFang SC',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;aspect-ratio:3/2;width:min(100vw,150vh);box-shadow:0 18px 60px rgba(0,0,0,.5);border-radius:10px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.ui{position:absolute;display:flex;gap:10px}
#title{left:3%;top:4%;color:#5a3a26;font-size:clamp(16px,3.2vw,40px);text-shadow:0 2px 0 #fff8ee,0 0 12px #fff8ee;transition:color .6s}
#title small{display:block;font-size:.5em;opacity:.8;margin-top:2px}
#btns{right:3%;top:4%}
.b{width:clamp(34px,5.4vw,60px);height:clamp(34px,5.4vw,60px);border-radius:50%;border:3px solid #fff8ee;background:#f4e3cc;box-shadow:0 4px 0 #b8916a,0 6px 14px rgba(0,0,0,.25);font-size:clamp(16px,2.6vw,28px);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s}
.b:active{transform:translateY(3px)}
#hint{left:50%;bottom:3%;transform:translateX(-50%);color:#fff;font-size:clamp(11px,1.6vw,18px);background:rgba(60,40,30,.35);padding:5px 14px;border-radius:20px;white-space:nowrap;transition:opacity 1s}
</style></head><body>
<div id="wrap"><div id="stage">
<canvas id="c" width="1200" height="800"></canvas>
<div id="title" class="ui"><div><span id="tt">狐兔的立体书 · 秋</span><small id="ts">翻开第一页</small></div></div>
<div id="btns" class="ui"><div class="b" id="bn" title="昼/夜"></div><div class="b" id="bp" title="翻页"></div></div>
<div id="hint" class="ui">点道具摇一摇 · 点狐兔跳一跳 · 按住小跑 · 右上角翻页</div>
</div></div>
<script>
const W=1200,H=800,cv=document.getElementById('c'),g=cv.getContext('2d');
const SEASONS=[
 {k:'aut',name:'秋',sub:'落叶小径',ground:.905,ink:'#5a3a26',p:'leaf',cols:['#e0773a','#c9502e','#e8a33d','#b5652e']},
 {k:'win',name:'冬',sub:'雪夜小镇',ground:.905,ink:'#f3f0ff',p:'snow',cols:['#ffffff','#e8f0ff']},
 {k:'spr',name:'春',sub:'樱花草地',ground:.905,ink:'#4a5a34',p:'petal',cols:['#f7b7c8','#fbd3de','#f39ab3']}];
const img={};let toLoad=0;
function L(n){toLoad++;const i=new Image();i.onload=()=>{if(--toLoad===0)start()};i.src=(window.ASSETS&&ASSETS[n])||n+'.webp';img[n]=i}
L('kit_walk');L('kit_run');for(const s of SEASONS){L('bg_'+s.k);for(let i=0;i<6;i++)L(s.k+'_'+i)}
let si=0,cam=0,speed=110,boost=0,night=0,nightT=0,t0=0,last=0,props=[],parts=[],hearts=[],nextX=0,turn=null,hold=false,kit={y:0,vy:0,jump:0,ph:0};
const SP={walk:{"w": 395, "h": 408, "ground": 406},run:{"w": 403, "h": 416, "ground": 414}};
const KX=W*.34;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ease=x=>1+2.70158*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2);
function spawn(x){const s=SEASONS[si];const id=Math.floor(Math.random()*6),im=img[s.k+'_'+id];
 const back=Math.random()<.45;const depth=back?.6:.88;
 const hT=(id%3===2?250:300)*depth*rnd(.85,1.1);const sc=hT/im.height;
 props.push({x,im,sc,depth,back,up:0,state:'down',wob:0,wv:0,season:si,seed:Math.random()});}
function fill(){while(nextX<cam+W*1.6){nextX+=rnd(230,360);spawn(nextX)}}
function start(){fill();for(const p of props)if(screenX(p)<W*.95)p.up=1;requestAnimationFrame(loop)}
function screenX(p){return (p.x-cam)*p.depth+KX*(1-p.depth)+ (p.back?60:0)}
function bgDraw(k,alpha){const b=img['bg_'+k];const s=H/b.height,bw=b.width*s;let off=-((cam*.25)%(bw*2));
 g.globalAlpha=alpha;for(let x=off,i=0;x<W;x+=bw,i++){g.save();if(i%2){g.translate(x+bw,0);g.scale(-1,1);g.drawImage(b,0,0,bw,H)}else g.drawImage(b,x,0,bw,H);g.restore()}g.globalAlpha=1}
function drawProp(p,gy){const x=screenX(p);const u=p.up;if(u<=0.001)return;
 const w=p.im.width*p.sc,h=p.im.height*p.sc;const y=gy-(p.back?34:14);
 // shadow flap lying on ground (the unfolded part)
 g.save();g.globalAlpha=.18*(1-Math.abs(u-1)*.5);g.fillStyle='#3a2414';
 g.beginPath();g.ellipse(x+8,y+4,w*.45,8+ (1-u)*h*.08,0,0,7);g.fill();g.restore();
 g.save();g.translate(x,y);g.rotate(p.wob);
 const sy=Math.max(.0,ease(Math.min(u,1)));// hinge scale
 g.transform(1,0,-(1-Math.min(u,1))*.6,1,0,0);g.scale(1,sy);
 if(p.back)g.filter='brightness(.9) saturate(.85)';
 g.drawImage(p.im,-w/2,-h,w,h);g.filter='none';
 
 g.restore();}
function particle(x,y,n,kind,burst){const s=SEASONS[si];for(let i=0;i<n;i++){const a=rnd(0,7),v=burst?rnd(80,260):0;
 parts.push({x,y,vx:Math.cos(a)*v+(burst?0:-rnd(10,40)),vy:Math.sin(a)*v-(burst?120:-rnd(20,60)),r:rnd(3,8),rot:rnd(0,7),vr:rnd(-4,4),life:burst?rnd(1.2,2.2):99,c:s.cols[i%s.cols.length],k:kind})}}
function drawPart(q){g.save();g.translate(q.x,q.y);g.rotate(q.rot);g.fillStyle=q.c;g.globalAlpha=Math.min(1,q.life);
 if(q.k==='snow'){g.beginPath();g.arc(0,0,q.r*.6,0,7);g.fill()}
 else if(q.k==='petal'){g.beginPath();g.ellipse(0,0,q.r,q.r*.55,0,0,7);g.fill();g.fillStyle='rgba(255,255,255,.5)';g.fillRect(-q.r*.2,-1,q.r*.6,2)}
 else{g.beginPath();g.moveTo(-q.r,0);g.quadraticCurveTo(0,-q.r*.9,q.r,0);g.quadraticCurveTo(0,q.r*.9,-q.r,0);g.fill();g.strokeStyle='rgba(90,40,20,.5)';g.lineWidth=1;g.beginPath();g.moveTo(-q.r,0);g.lineTo(q.r,0);g.stroke()}
 g.restore()}
function heart(x,y){g.save();g.translate(x,y);g.fillStyle='#ff7b93';g.beginPath();g.moveTo(0,6);g.bezierCurveTo(-14,-4,-6,-14,0,-6);g.bezierCurveTo(6,-14,14,-4,0,6);g.fill();g.restore()}
function loop(ts){const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;t0+=dt;
 const s=SEASONS[si];const gy=H*s.ground;
 boost+=((hold?1:0)-boost)*Math.min(1,dt*4);const v=speed*(1+boost*1.6)*(turn?0.2:1);cam+=v*dt;fill();
 nightT+=((night?1:0)-nightT)*Math.min(1,dt*2.5);
 // props fold logic
 for(const p of props){const x=screenX(p);
  const want=(x<W*.92&&x>W*.06&&p.season===si&&!(turn&&turn.t>.25))?1:0;
  p.up+=(want-p.up)*Math.min(1,dt*(want?2.6:4));
  if(want&&p.state==='down'&&p.up>.05){p.state='up'}
  p.wv+=(-p.wob*60-p.wv*5)*dt;p.wob+=p.wv*dt;}
 props=props.filter(p=>screenX(p)>-300&&!(p.season!==si&&p.up<.01));
 // draw bg (crossfade during page turn)
 bgDraw(s.k,1);
 if(turn&&turn.prev!=null&&turn.t<.5)bgDraw(SEASONS[turn.prev].k,1-turn.t*2);
 // back props then front
 props.filter(p=>p.back).sort((a,b)=>a.x-b.x).forEach(p=>drawProp(p,gy));
 props.filter(p=>!p.back).sort((a,b)=>a.x-b.x).forEach(p=>drawProp(p,gy));
 // night tint goes under the kit so she stays bright
 if(nightT>.01){g.save();g.globalCompositeOperation='multiply';g.fillStyle=`rgba(40,50,110,${nightT*.6})`;g.fillRect(0,0,W,H);g.restore()}
 // kit: real 8-frame walk / run cycles (GPT-drawn sheets)
 const kh=230;const running=boost>.45;const sp=running?SP.run:SP.walk;const sim=running?img.kit_run:img.kit_walk;
 kit.ph+=dt*(running?11:7.5)*(turn?0.35:1);let fi=Math.floor(kit.ph)%8;
 if(kit.jump>0){kit.vy+=1500*dt;kit.y+=kit.vy*dt;if(kit.y>=0){kit.y=0;kit.jump=0;kit.vy=0}}
 const sc=kh/sp.ground*1.0,kw=sp.w*sc;const jy=kit.jump?kit.y:0;
 const useRun=running||kit.jump;const S2=useRun?SP.run:sp,IM=useRun?img.kit_run:sim;if(kit.jump)fi=2;
 const sc2=kh/S2.ground,kw2=S2.w*sc2;
 g.save();g.globalAlpha=.22;g.fillStyle='#2a1a10';g.beginPath();g.ellipse(KX,gy+2,kw2*.3*(1+jy/200),9,0,0,7);g.fill();g.restore();
 g.save();g.translate(KX,gy+jy);g.rotate(boost*.04);if(nightT>.01)g.filter=`brightness(${1-nightT*.12})`;
 g.drawImage(IM,fi*S2.w,0,S2.w,S2.h,-kw2/2,-S2.ground*sc2,kw2,S2.h*sc2);g.restore();
 // ambient particles
 if(Math.random()<dt*(s.p==='snow'?40:12))parts.push({x:rnd(0,W*1.2),y:-10,vx:-rnd(15,50)-boost*60,vy:rnd(30,70),r:rnd(3,8),rot:rnd(0,7),vr:rnd(-2,2),life:99,c:s.cols[Math.floor(rnd(0,s.cols.length))],k:s.p});
 if(boost>.3&&Math.random()<dt*20)parts.push({x:KX-20,y:gy-4,vx:-rnd(60,140),vy:-rnd(40,120),r:rnd(2,5),rot:0,vr:rnd(-5,5),life:rnd(.4,.8),c:s.cols[0],k:s.p});
 for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.rot+=q.vr*dt;if(q.life<50){q.vy+=300*dt;q.vx*=.98;q.life-=dt}else{q.vx+=Math.sin(t0+q.r)*8*dt}}
 parts=parts.filter(q=>q.life>0&&q.y<H+20&&q.x>-30);parts.forEach(drawPart);
 // night
 if(nightT>.01){
  g.save();g.globalCompositeOperation='screen';const r=g.createRadialGradient(KX,gy-110,10,KX,gy-110,330);r.addColorStop(0,`rgba(255,190,110,${nightT*.38})`);r.addColorStop(1,'rgba(255,190,110,0)');g.fillStyle=r;g.fillRect(0,0,W,H);
  for(let i=0;i<26;i++){const fx=(i*197+Math.sin(t0*.4+i)*60-cam*.3)%W;const x=(fx+W)%W,y=gy-60-((i*71)%320)+Math.sin(t0*1.3+i*2)*18;const a=nightT*(.5+.5*Math.sin(t0*3+i*1.7));
   const fr=g.createRadialGradient(x,y,0,x,y,14);fr.addColorStop(0,`rgba(255,240,150,${a})`);fr.addColorStop(1,'rgba(255,240,150,0)');g.fillStyle=fr;g.fillRect(x-14,y-14,28,28)}g.restore()}
 // hearts
 for(const h of hearts){h.y-=60*dt;h.x+=Math.sin(h.t*5)*20*dt;h.t+=dt;g.globalAlpha=Math.max(0,1-h.t/1.6);heart(h.x,h.y);g.globalAlpha=1}
 hearts=hearts.filter(h=>h.t<1.6);
 // page turn: a paper sheet sweeping right->left (rigid, with curl shade)
 if(turn){turn.t+=dt/1.4;const tt=Math.min(1,turn.t);const x=W*(1.15-tt*1.5);
  if(tt>.5&&!turn.swapped){turn.swapped=true}
  g.save();const sh=g.createLinearGradient(x-120,0,x+60,0);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(.7,'rgba(0,0,0,.25)');sh.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=sh;g.fillRect(x-120,0,180,H);
  const pg=g.createLinearGradient(x,0,x+260,0);pg.addColorStop(0,'#fff6e6');pg.addColorStop(.15,'#f2e2c6');pg.addColorStop(1,'#fbf0dc');g.fillStyle=pg;g.beginPath();g.moveTo(x,0);g.quadraticCurveTo(x+40,H/2,x,H);g.lineTo(x+260+tt*200,H);g.lineTo(x+260+tt*200,0);g.closePath();g.globalAlpha=Math.min(1,(1-tt)*3);g.fill();g.restore();
  if(turn.t>=1)turn=null}
 // vignette paper edge
 const vg=g.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.95);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(60,30,10,.28)');g.fillStyle=vg;g.fillRect(0,0,W,H);
 requestAnimationFrame(loop)}
function pageTurn(){if(turn)return;const prev=si;si=(si+1)%SEASONS.length;turn={t:0,prev,swapped:false};nextX=cam+W*.5;
 const s=SEASONS[si];document.getElementById('tt').textContent='狐兔的立体书 · '+s.name;document.getElementById('ts').textContent=s.sub;
 const te=document.getElementById('title');te.style.color=s.ink;te.style.textShadow=si===1?'0 2px 0 #1d2a5c,0 0 12px #1d2a5c':'0 2px 0 #fff8ee,0 0 12px #fff8ee';fill();for(const q of parts)if(q.k!==s.p)q.life=Math.min(q.life,.5);}
function toCanvas(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
let downAt=0,downP=null,holdTimer=null;
cv.addEventListener('pointerdown',e=>{downAt=performance.now();downP=toCanvas(e);holdTimer=setTimeout(()=>{hold=true},220)});
addEventListener('pointerup',e=>{clearTimeout(holdTimer);const wasHold=hold;hold=false;if(wasHold||!downP)return;tap(downP);downP=null});
function tap(p){const s=SEASONS[si],gy=H*s.ground;const kh=230,kw=SP.walk.w*kh/SP.walk.ground;
 if(Math.abs(p.x-KX)<kw/2&&p.y>gy-kh&&p.y<gy+10){if(!kit.jump){kit.jump=1;kit.vy=-560;kit.y=-1}for(let i=0;i<5;i++)hearts.push({x:KX+rnd(-30,30),y:gy-kh+rnd(-10,20),t:-i*.12});return}
 const hit=props.filter(q=>q.up>.6).sort((a,b)=>(b.back?0:1)-(a.back?0:1)).find(q=>{const x=screenX(q),w=q.im.width*q.sc,h=q.im.height*q.sc,y=gy-(q.back?34:14);return p.x>x-w/2&&p.x<x+w/2&&p.y>y-h&&p.y<y});
 if(hit){hit.wv+=(Math.random()<.5?-1:1)*rnd(2.5,3.5);particle(p.x,p.y,18,s.p,true)}
 else particle(p.x,p.y,8,s.p,true)}
document.getElementById('bp').onclick=e=>{e.stopPropagation();pageTurn()};
document.getElementById('bn').onclick=e=>{e.stopPropagation();night=!night;document.getElementById('bn').innerHTML=night?SUN:MOON};
const MOON='<svg viewBox="0 0 24 24" width="55%"><path d="M15 3a9 9 0 1 0 6 13A7 7 0 0 1 15 3z" fill="#f2b544" stroke="#9a6a2c" stroke-width="1.3"/></svg>',SUN='<svg viewBox="0 0 24 24" width="60%"><g stroke="#e08a2c" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></g><circle cx="12" cy="12" r="5" fill="#ffc94a" stroke="#e08a2c" stroke-width="1.3"/></svg>',BOOK='<svg viewBox="0 0 24 24" width="60%"><path d="M2 5c3-1.5 7-1.5 10 1v14c-3-2.5-7-2.5-10-1z" fill="#fff" stroke="#9a6a2c" stroke-width="1.3"/><path d="M22 5c-3-1.5-7-1.5-10 1v14c3-2.5 7-2.5 10-1z" fill="#f7d9a8" stroke="#9a6a2c" stroke-width="1.3"/></svg>';
document.getElementById('bn').innerHTML=MOON;document.getElementById('bp').innerHTML=BOOK;
setTimeout(()=>document.getElementById('hint').style.opacity=0,7000);
window.__api={tap,pageTurn,setHold:v=>hold=v,toggleNight:()=>document.getElementById('bn').click(),KX,W,H,props:()=>props,screenX,season:()=>SEASONS[si]};
</script><a href="/" aria-label="返回 Nova 首页" style="position:fixed;bottom:10px;right:10px;z-index:2147483647;padding:6px 11px;border-radius:20px;background:rgba(255,250,237,.88);color:#554536;font:14px sans-serif;text-decoration:none;box-shadow:0 2px 8px #30221833">← Nova</a></body></html>
