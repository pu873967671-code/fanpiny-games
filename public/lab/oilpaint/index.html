<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>狐兔油画山谷</title>
<style>
@font-face{font-family:KL;src:url(kl.woff2) format('woff2')}
html,body{margin:0;height:100%;background:#1b1420;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh}
#hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font:16px KL,sans-serif;font-size:min(16px,3.4vw);color:#fff8e8;
 background:rgba(60,30,20,.38);padding:7px 16px;border-radius:20px;letter-spacing:1px;white-space:nowrap;transition:opacity 1s;text-shadow:0 1px 2px #0006}
#tod{position:fixed;right:16px;top:14px;font:18px KL,sans-serif;color:#fff8e8;text-shadow:0 2px 4px #0008;letter-spacing:2px;transition:opacity .4s}
</style></head><body>
<canvas id="c"></canvas>
<div id="tod">清晨</div>
<div id="hint">← → 走 · 按住 Shift 跑 · 空格跳 · 点天空换时段</div>
<script>
const SRC={sky0:'sky_dawn.webp',sky1:'sky_dusk.webp',sky2:'sky_night.webp',mid:'mid.webp',ground:'ground.webp',
 walk:'kit_walk.webp',run:'kit_run.webp'};
for(let i=0;i<4;i++){SRC['fb'+i]=`fl${i}_0.webp`;SRC['fo'+i]=`fl${i}_1.webp`}
for(let i=0;i<8;i++)SRC['bf'+i]=`bf${i}.webp`;
const KM={walk:{w:368,h:405,ground:402},run:{w:423,h:394,ground:392}};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR,S; // S = scale unit (screen px per "design px"); design height 800
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);S=Math.min(H/800,W/560)}
addEventListener('resize',resize);resize();
const IM={};
function load(){return Promise.all(Object.entries(SRC).map(([k,u])=>new Promise(r=>{const i=new Image();i.onload=()=>{IM[k]=i;r()};i.onerror=()=>r();i.src=u})))}
// ---------- time-of-day palettes ----------
const TOD=[
 {name:'清晨',mul:[255,236,226],light:[255,222,140],lightA:.6,mist:.35,ff:0,kit:[255,246,240]},
 {name:'黄昏',mul:[255,158,108],light:[255,170,80],lightA:.7,mist:.12,ff:.25,kit:[255,214,180]},
 {name:'夜晚',mul:[78,96,158],light:[170,210,255],lightA:.6,mist:.05,ff:1,kit:[150,165,215]}];
function tinted(img,c){const o=document.createElement('canvas');o.width=img.width;o.height=img.height;const g=o.getContext('2d');
 g.drawImage(img,0,0);g.globalCompositeOperation='multiply';g.fillStyle=`rgb(${c})`;g.fillRect(0,0,o.width,o.height);
 g.globalCompositeOperation='destination-in';g.drawImage(img,0,0);return o}
const TT={}; // TT[key][tod]
function prepTints(){for(const k of ['mid','ground','walk','run',...[0,1,2,3].flatMap(i=>['fb'+i,'fo'+i])]){
 if(!IM[k])continue;TT[k]=TOD.map(t=>tinted(IM[k],k=='walk'||k=='run'?t.kit:t.mul))}}
// ---------- state ----------
let tod=0,todFrom=0,todT=1; // crossfade
let camX=0,T=0;
const kit={x:0,vx:0,dir:1,face:1,y:0,vy:0,air:false,dist:0,run:0,squash:0,land:0};
const input={l:false,r:false,run:false,auto:true,idle:0};
const flowers=[],bflies=[],dabs=[],gusts=[],flies=[];
let rng=1;function rnd(){rng=(rng*16807)%2147483647;return (rng-1)/2147483646}
function groundY(){return H*0.82}
function kitH(){return 215*S}
// flowers spawn procedurally along world x
let flowerEdgeR=-400,flowerEdgeL=-400;
function addFlower(x){const ty=Math.floor(rnd()*4),dep=rnd();
 flowers.push({x,ty,dep,y:groundY()+(dep-.62)*40*S,sc:(.55+rnd()*.35)*(.8+dep*.35),t:0,open:false,sw:0,swv:0,ph:rnd()*6,seed:rnd()})}
function ensureFlowers(){const R=camX+W+200,L=camX-200;
 while(flowerEdgeR<R){flowerEdgeR+= (60+rnd()*120)*S;addFlower(flowerEdgeR)}
 while(flowerEdgeL>L){flowerEdgeL-= (60+rnd()*120)*S;addFlower(flowerEdgeL)}
 for(let i=flowers.length-1;i>=0;i--){const f=flowers[i];if(f.x<camX-600*S||f.x>camX+W+600*S){flowers.splice(i,1)}}
 flowerEdgeR=Math.max(flowerEdgeR,camX-200);flowerEdgeL=Math.min(flowerEdgeL,camX+W+200)}
// ---------- helpers ----------
const ease=t=>t<0?0:t>1?1:t;
function backOut(t){t=ease(t);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}
function rgba(c,a){return `rgba(${c[0]},${c[1]},${c[2]},${a})`}
function lerpC(a,b,t){return a.map((v,i)=>v+(b[i]-v)*t)}
function curTod(){const a=TOD[todFrom],b=TOD[tod],t=todT;return{light:lerpC(a.light,b.light,t),lightA:a.lightA+(b.lightA-a.lightA)*t,mist:a.mist+(b.mist-a.mist)*t,ff:a.ff+(b.ff-a.ff)*t}}
// tiled mirrored layer
function drawTiled(img,par,y,h,alpha){if(!img)return;const w=img.width*h/img.height;const off=((camX*par)%(2*w)+2*w)%(2*w);
 ctx.globalAlpha=alpha;for(let x=-off,i=0;x<W;x+=w,i++){if(x+w<0)continue;
  if(i%2==0)ctx.drawImage(img,x,y,w+1,h);else{ctx.save();ctx.translate(x+w,y);ctx.scale(-1,1);ctx.drawImage(img,0,0,w+1,h);ctx.restore()}}
 ctx.globalAlpha=1}
function layerTod(key,par,y,h){const A=TT[key];if(!A)return;drawTiled(A[todFrom],par,y,h,1);if(todT<1)drawTiled(A[tod],par,y,h,todT)}
function drawSky(){const sh=H*1.0;const k=['sky0','sky1','sky2'];
 const drift=T*6; const par=.06;
 const f=(i,a)=>{const img=IM[k[i]]||IM.sky0;if(!img)return;const h=Math.max(H*.86,W*img.height/img.width*0.6);const w=img.width*h/img.height;const off=((camX*par+drift)%(2*w)+2*w)%(2*w);
  ctx.globalAlpha=a;for(let x=-off,j=0;x<W;x+=w,j++){if(x+w<0)continue;if(j%2==0)ctx.drawImage(img,x,0,w+1,h);else{ctx.save();ctx.translate(x+w,0);ctx.scale(-1,1);ctx.drawImage(img,0,0,w+1,h);ctx.restore()}}ctx.globalAlpha=1;return h};
 // the sky image's horizon must sit behind mid hills: draw it so its bottom is at ~0.62H
 const img=IM.sky0;const h=H*.70;
 const g=(i,a)=>{const im=IM[k[i]]||img;const w=im.width*h/im.height;const off=((camX*par+drift)%(2*w)+2*w)%(2*w);ctx.globalAlpha=a;
  for(let x=-off,j=0;x<W;x+=w,j++){if(x+w<0)continue;if(j%2==0)ctx.drawImage(im,x,0,w+1,h);else{ctx.save();ctx.translate(x+w,0);ctx.scale(-1,1);ctx.drawImage(im,0,0,w+1,h);ctx.restore()}}ctx.globalAlpha=1};
 // fill below sky with bottom-row color strip (stretch last rows)
 g(todFrom,1);if(todT<1)g(tod,todT);
 return h}
// ---------- kit ----------
function kitFrame(){
 if(kit.air){const fr=kit.vy<0?3:2;return['run',fr]}
 const sp=Math.abs(kit.vx);
 if(sp<8*S)return['walk',0];
 const run=kit.run>.5;const stride=(run?150:95)*S;
 return[run?'run':'walk',Math.floor(kit.dist/stride*8/2)%8]}
function drawKit(){const [k,fr]=kitFrame();const A=TT[k];if(!A)return;const m=KM[k];
 const sc=kitH()/m.h; const sx=kit.x-camX; const gy=groundY()+kit.y;
 const sq=kit.squash; const bob=0;
 // shadow
 const sh=1-Math.min(1,-kit.y/(220*S))*.6;
 ctx.save();ctx.globalAlpha=.28*sh;ctx.fillStyle='#2a1a10';ctx.beginPath();ctx.ellipse(sx,groundY()+2*S,58*S*sh,10*S*sh,0,0,7);ctx.fill();ctx.restore();
 ctx.save();ctx.translate(sx,gy);ctx.scale(kit.face*(1+sq*.12),1-sq*.14);
 if(kit.air)ctx.rotate((kit.vy/1400)*.25);
 const fw=m.w*sc,fh=m.h*sc;
 const draw=(img,a)=>{ctx.globalAlpha=a;ctx.drawImage(img,fr*m.w,0,m.w,m.h,-fw*.55,-m.ground*sc,fw,fh)};
 draw(A[todFrom],1);if(todT<1)draw(A[tod],todT);
 ctx.restore();ctx.globalAlpha=1}
// ---------- flowers ----------
function drawFlower(f){const ty=f.ty;const B=TT['fb'+ty],O=TT['fo'+ty];if(!B||!O)return;
 const img=IM['fb'+ty];const sc=f.sc*S*.30;const w=img.width*sc,h=img.height*sc;const ax=w/2;
 const x=f.x-camX;if(x<-200||x>W+200)return;
 ctx.save();ctx.translate(x,f.y);ctx.rotate(f.sw+Math.sin(T*1.3+f.ph)*.025);
 const o=backOut(f.t), oa=ease(f.t*1.6);
 const d=(arr,a,sy)=>{ctx.globalAlpha=a;ctx.save();ctx.scale(1,sy);ctx.drawImage(arr[todFrom],-ax,-h,w,h);if(todT<1){ctx.globalAlpha=a*todT;ctx.drawImage(arr[tod],-ax,-h,w,h)}ctx.restore()};
 if(oa<1)d(B,1-oa,1);
 if(f.t>0)d(O,oa,.55+.45*o);
 ctx.restore();ctx.globalAlpha=1}
const FC=[[214,52,40],[246,190,40],[60,90,220],[240,130,170]];
function bloom(f){f.open=true;f.swv+=.18*(rnd()-.5);
 const x=f.x,y=f.y-IM['fo'+f.ty].height*f.sc*S*.30*.8;
 for(let i=0;i<10;i++)dabs.push({x,y,vx:(rnd()-.5)*160*S,vy:(-rnd()*170-40)*S,life:1,dec:.9+rnd()*.6,r:(3+rnd()*5)*S,c:FC[f.ty],rot:rnd()*6,g:260*S});
 if(rnd()<.55||bflies.length<2)spawnBfly(x,y)}
function spawnBfly(x,y){if(bflies.length>10)bflies.shift();
 bflies.push({x,y,vx:(rnd()-.3)*60*S*kit.face,vy:-90*S,ty:Math.floor(rnd()*4),ph:rnd()*6,life:0,sc:(.55+rnd()*.3),tx:0,ty2:0,seed:rnd()*100})}
function drawBfly(b){const op=IM['bf'+b.ty],cl=IM['bf'+(b.ty+4)];if(!op)return;
 const flap=(Math.sin(b.life*22+b.ph)+1)/2; // 1 open .. 0 closed
 const x=b.x-camX,y=b.y; const s=b.sc*S*.17;
 ctx.save();ctx.translate(x,y);ctx.rotate(Math.atan2(b.vy,b.vx)*.25+(b.vx<0?.0:0));
 if(b.vx<0)ctx.scale(-1,1);
 const n=TOD[tod].ff>.9?.6:1;ctx.globalAlpha=Math.min(1,b.life*3)*n;
 // squash horizontally between open & closed frames for a smooth flap
 const sx=.35+.65*flap;
 if(flap>.4)ctx.drawImage(op,-op.width*s*sx/2,-op.height*s/2,op.width*s*sx,op.height*s);
 else ctx.drawImage(cl,-cl.width*s/2,-cl.height*s/2,cl.width*s,cl.height*s);
 ctx.restore();ctx.globalAlpha=1}
// ---------- wind gusts: painterly light strokes ----------
function spawnGust(dir){const d=dir||(rnd()<.5?1:-1);
 gusts.push({x:d>0?camX-300*S:camX+W+300*S,d,sp:(420+rnd()*180)*S,strokes:Array.from({length:9},()=>({oy:(rnd()-.2)*90*S,len:(160+rnd()*240)*S,w:(6+rnd()*12)*S,amp:(6+rnd()*14)*S,ph:rnd()*6,lag:rnd()*160*S,a:.5+rnd()*.5})),life:0})}
function drawGusts(){const c=curTod();
 ctx.save();ctx.globalCompositeOperation='screen';ctx.lineCap='round';
 for(const g of gusts){
  for(const s of g.strokes){const hx=g.x-camX-g.d*s.lag;const y0=groundY()-30*S+s.oy;
   const N=18;ctx.beginPath();
   for(let i=0;i<=N;i++){const u=i/N;const x=hx-g.d*u*s.len;const y=y0+Math.sin(u*5+s.ph+T*3)*s.amp*(1-u*.4)-u*14*S;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
   const gr=ctx.createLinearGradient(hx,0,hx-g.d*s.len,0);
   const fade=Math.min(1,g.life*2);
   gr.addColorStop(0,rgba(c.light,0));gr.addColorStop(.15,rgba(c.light,s.a*c.lightA*fade));gr.addColorStop(1,rgba(c.light,0));
   ctx.strokeStyle=gr;ctx.lineWidth=s.w;ctx.stroke();
   // a thin bright core stroke for a "fresh paint" sheen
   ctx.strokeStyle=rgba([255,255,240],.25*s.a*fade*c.lightA);ctx.lineWidth=s.w*.3;ctx.stroke();
  }}
 ctx.restore()}
// ---------- dabs (paint particles) ----------
function drawDabs(){for(const p of dabs){ctx.save();ctx.translate(p.x-camX,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.max(0,p.life);
 ctx.fillStyle=rgba(p.c,1);ctx.beginPath();ctx.ellipse(0,0,p.r*1.6,p.r*.75,0,0,7);ctx.fill();
 ctx.fillStyle=rgba([255,255,255],.35);ctx.beginPath();ctx.ellipse(-p.r*.4,-p.r*.2,p.r*.6,p.r*.22,0,0,7);ctx.fill();ctx.restore()}ctx.globalAlpha=1}
// ---------- atmosphere ----------
let grain;
function makeGrain(){const o=document.createElement('canvas');o.width=o.height=256;const g=o.getContext('2d');const d=g.createImageData(256,256);
 for(let i=0;i<d.data.length;i+=4){const v=128+(Math.random()-.5)*60;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);
 // canvas weave lines
 g.globalAlpha=.08;g.strokeStyle='#000';for(let i=0;i<256;i+=3){g.beginPath();g.moveTo(0,i);g.lineTo(256,i);g.stroke();g.beginPath();g.moveTo(i,0);g.lineTo(i,256);g.stroke()}
 grain=ctx.createPattern(o,'repeat')}
function drawMist(){const c=curTod();if(c.mist<.02)return;
 for(let i=0;i<3;i++){const y=H*(.55+i*.05);const x=((T*12*(i+1)-camX*.3*(i+1)*.3)%(W+600))-300;
  const gr=ctx.createRadialGradient(x+W*.3,y,10,x+W*.3,y,W*.45);gr.addColorStop(0,`rgba(255,246,236,${c.mist*.5})`);gr.addColorStop(1,'rgba(255,246,236,0)');
  ctx.fillStyle=gr;ctx.fillRect(0,y-H*.15,W,H*.3);}}
function drawFireflies(){const c=curTod();if(c.ff<.02)return;
 while(flies.length<26)flies.push({x:camX+rnd()*W,y:H*(.45+rnd()*.42),ph:rnd()*6,sp:.5+rnd()});
 ctx.save();ctx.globalCompositeOperation='lighter';
 for(const f of flies){let x=f.x-camX*.0; x=((x-camX)%(W+40)+W+40)%(W+40)-20;const y=f.y+Math.sin(T*f.sp+f.ph)*14*S;
  const a=c.ff*(.5+.5*Math.sin(T*2.3*f.sp+f.ph));const r=11*S;
  const gr=ctx.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(255,250,170,${a})`);gr.addColorStop(.25,`rgba(230,240,120,${a*.5})`);gr.addColorStop(1,'rgba(200,255,120,0)');
  ctx.fillStyle=gr;ctx.fillRect(x-r,y-r,2*r,2*r)}
 ctx.restore()}
function drawSunGlow(){const c=curTod();const a=TOD[todFrom],b=TOD[tod];
 const glow=[.35,.55,.18];const v=glow[todFrom]+(glow[tod]-glow[todFrom])*todT;
 const gr=ctx.createLinearGradient(0,H*.3,0,H*.75);gr.addColorStop(0,rgba(c.light,0));gr.addColorStop(.6,rgba(c.light,v*.35));gr.addColorStop(1,rgba(c.light,0));
 ctx.save();ctx.globalCompositeOperation='soft-light';ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);ctx.restore()}
// ---------- main loop ----------
let last=0,gustT=1.5;
function step(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T+=dt;
 // input -> kit
 input.idle+=dt;
 let want=0;if(input.l)want-=1;if(input.r)want+=1;
 if(!want&&input.auto&&input.idle>3)want=1; // autopilot stroll
 const runOn=input.run?1:0;kit.run+=(runOn-kit.run)*Math.min(1,dt*6);
 const vmax=(kit.run>.5?330:130)*S;
 kit.vx+=(want*vmax-kit.vx)*Math.min(1,dt*(want?5:7));
 if(want)kit.face=want;
 kit.x+=kit.vx*dt;kit.dist+=Math.abs(kit.vx)*dt;
 if(kit.air){kit.vy+=2400*S*dt;kit.y+=kit.vy*dt;if(kit.y>=0){kit.y=0;kit.vy=0;kit.air=false;kit.squash=1;landPuff()}}
 kit.squash*=Math.pow(.004,dt);
 // footstep dabs
 if(!kit.air&&Math.abs(kit.vx)>40*S){const fs=Math.floor(kit.dist/((kit.run>.5?75:48)*S));if(fs!==kit.lastFs){kit.lastFs=fs;
  for(let i=0;i<(kit.run>.5?3:1);i++)dabs.push({x:kit.x-kit.face*20*S,y:groundY()-2*S,vx:-kit.face*(30+rnd()*60)*S,vy:-(40+rnd()*60)*S,life:.8,dec:1.6,r:(2+rnd()*3)*S,c:[120+rnd()*40,150+rnd()*40,70],rot:rnd()*6,g:300*S})}}
 // camera
 const target=kit.x-W*(.5-kit.face*.12);camX+=(target-camX)*Math.min(1,dt*2.2);
 ensureFlowers();
 // flowers bloom near kit
 for(const f of flowers){const d=Math.abs(f.x-kit.x);
  if(!f.open&&d<70*S&&kit.y>-160*S)bloom(f);
  if(f.open)f.t=Math.min(1,f.t+dt*1.6);
  // kit brushing past nudges stems
  if(d<50*S&&Math.abs(kit.vx)>20*S)f.swv+=kit.vx/(S*1)*.00009;
  for(const g of gusts){const gd=(f.x-g.x)*g.d;if(gd<0&&gd>-140*S)f.swv+=g.d*.9*dt*(1-(-gd)/(140*S))}
  f.swv+=(-f.sw*38-f.swv*3.2)*dt;f.sw+=f.swv*dt;f.sw=Math.max(-.5,Math.min(.5,f.sw))}
 // butterflies
 for(const b of bflies){b.life+=dt;const tx=kit.x+Math.sin(b.life*.7+b.seed)*160*S+kit.face*40*S,ty=groundY()-(170+Math.sin(b.life*1.3+b.seed)*70)*S-(b.life>6?(b.life-6)*60*S:0);
  b.vx+=((tx-b.x)*.9-b.vx*.8+Math.sin(b.life*5+b.seed)*120*S)*dt;b.vy+=((ty-b.y)*1.2-b.vy*.9+Math.cos(b.life*6.3+b.seed)*160*S)*dt;
  for(const g of gusts){const gd=Math.abs(b.x-g.x);if(gd<200*S)b.vx+=g.d*200*S*dt}
  b.x+=b.vx*dt;b.y+=b.vy*dt}
 for(let i=bflies.length-1;i>=0;i--)if(bflies[i].y<-80||bflies[i].life>14)bflies.splice(i,1);
 // gusts
 gustT-=dt;if(gustT<0){spawnGust(kit.face);gustT=3.5+rnd()*3}
 for(const g of gusts){g.x+=g.d*g.sp*dt;g.life+=dt}
 for(let i=gusts.length-1;i>=0;i--){const g=gusts[i];if(g.life>(W+900*S)/g.sp)gusts.splice(i,1)}
 // dabs
 for(const p of dabs){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=p.dec*dt;p.rot+=dt*3}
 for(let i=dabs.length-1;i>=0;i--)if(dabs[i].life<=0)dabs.splice(i,1);
 // tod fade
 if(todT<1){todT=Math.min(1,todT+dt/1.6);if(todT>=1)todFrom=tod}
 render();requestAnimationFrame(step)}
function landPuff(){for(let i=0;i<8;i++)dabs.push({x:kit.x+(rnd()-.5)*50*S,y:groundY(),vx:(rnd()-.5)*200*S,vy:-(30+rnd()*80)*S,life:.9,dec:1.4,r:(2+rnd()*4)*S,c:[200,190,140],rot:rnd()*6,g:300*S})}
function render(){
 ctx.fillStyle='#2b2030';ctx.fillRect(0,0,W,H);
 const sh=drawSky();
 drawMist();
 // mid hills
 const mh=H*.40;layerTod('mid',.35,groundY()-mh*.86,mh);
 drawSunGlow();
 // back flowers (behind kit)
 const gh=H*.30;layerTod('ground',1,H-gh,gh);
 flowers.sort((a,b)=>a.y-b.y);
 const ky=groundY()+6*S;
 for(const f of flowers)if(f.y<=ky)drawFlower(f);
 drawGusts();
 drawKit();
 for(const f of flowers)if(f.y>ky)drawFlower(f);
 drawDabs();
 for(const b of bflies)drawBfly(b);
 drawFireflies();
 // night: soft moonlight vignette; all: painterly vignette + canvas grain
 const v=ctx.createRadialGradient(W/2,H*.5,Math.min(W,H)*.35,W/2,H*.5,Math.max(W,H)*.78);v.addColorStop(0,'rgba(30,15,20,0)');v.addColorStop(1,'rgba(30,15,20,.42)');
 ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
 if(grain){ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.16;ctx.fillStyle=grain;ctx.fillRect(0,0,W,H);ctx.restore()}
}
// ---------- controls ----------
function jump(){if(kit.air)return;kit.air=true;kit.vy=-(kit.run>.5?980:880)*S;kit.squash=-.6;input.idle=0;
 for(let i=0;i<5;i++)dabs.push({x:kit.x,y:groundY(),vx:(rnd()-.5)*140*S,vy:-(20+rnd()*60)*S,life:.7,dec:1.5,r:(2+rnd()*3)*S,c:[190,180,130],rot:rnd()*6,g:300*S})}
function cycleTod(){todFrom=tod;tod=(tod+1)%3;todT=0;const el=document.getElementById('tod');el.style.opacity=0;setTimeout(()=>{el.textContent=TOD[tod].name;el.style.opacity=1},300);
 if(tod==2)for(const f of flowers)if(f.open&&rnd()<.3)spawnBfly(f.x,f.y-60*S)}
const KEYS={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'};
addEventListener('keydown',e=>{input.idle=0;input.auto=false;if(KEYS[e.code])input[KEYS[e.code]]=true;if(e.key=='Shift')input.run=true;
 if(e.code=='Space'||e.code=='ArrowUp'||e.code=='KeyW'){jump();e.preventDefault()}if(e.code=='KeyT')cycleTod();hideHint()});
addEventListener('keyup',e=>{if(KEYS[e.code])input[KEYS[e.code]]=false;if(e.key=='Shift')input.run=false});
// pointer: tap sky = change time; tap kit = jump; hold left/right of kit = walk, hold long = run; swipe up = jump
let ptr=null;
cv.addEventListener('pointerdown',e=>{hideHint();input.idle=0;input.auto=false;const x=e.clientX,y=e.clientY;
 if(y<H*.42){cycleTod();skyBurst(x,y);return}
 const kx=kit.x-camX,ky=groundY()-kitH()*.5;
 if(Math.abs(x-kx)<70*S&&Math.abs(y-ky)<110*S){jump();return}
 ptr={id:e.pointerId,x,y,t:T,dir:x<kx?-1:1};input[ptr.dir<0?'l':'r']=true;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!ptr||e.pointerId!==ptr.id)return;if(ptr.y-e.clientY>60*S){jump();ptr.y=e.clientY}
 const kx=kit.x-camX,d=e.clientX<kx-10?-1:e.clientX>kx+10?1:ptr.dir;if(d!==ptr.dir){input.l=input.r=false;ptr.dir=d;input[d<0?'l':'r']=true}});
function up(e){if(!ptr||e.pointerId!==ptr.id)return;input.l=input.r=false;input.run=false;ptr=null}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
setInterval(()=>{if(ptr&&T-ptr.t>.7)input.run=true},100);
function skyBurst(x,y){const c=TOD[tod].light;for(let i=0;i<14;i++){const a=rnd()*6.28,s=(60+rnd()*160)*S;dabs.push({x:x+camX,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,dec:1.1,r:(3+rnd()*4)*S,c,rot:a,g:0})}}
let hinted=false;function hideHint(){if(hinted)return;hinted=true;setTimeout(()=>document.getElementById('hint').style.opacity=0,2500)}
// recorder API
window.__api={kit,input,jump,cycleTod,get camX(){return camX},S:()=>S,
 hold(d,r){input.auto=false;input.l=d<0;input.r=d>0;input.run=!!r;input.idle=0},rel(){input.l=input.r=false;input.run=false},tapSky(){cycleTod();skyBurst(W*.7,H*.18)}};
load().then(()=>{prepTints();makeGrain();kit.x=W*.5;camX=0;flowerEdgeR=flowerEdgeL=kit.x+120*S;
 for(let i=0;i<3;i++)spawnGust(1),gusts[i].x-=i*500*S;
 if(/Mobi|Android|iPhone/i.test(navigator.userAgent))document.getElementById('hint').textContent='按住左右走 · 长按跑 · 点狐兔跳 · 点天空换时段';
 requestAnimationFrame(t=>{last=t;step(t)})});
