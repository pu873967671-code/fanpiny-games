<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172b37">
<title>来自狐兔的圣诞贺卡</title>
<style>
@font-face{font-family:CardHand;src:url('lettering.ttf')}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#172b37}body{display:grid;place-items:center;min-height:100dvh;color:#fff8e8;font-family:Georgia,"Songti SC",serif;overflow:hidden}.card{position:relative;width:min(100vw,66.6667dvh);height:min(150vw,100dvh);overflow:hidden;background:#263c4c;isolation:isolate;box-shadow:0 12px 70px #08151c99}.scene{position:absolute;inset:-.6%;animation:breathe 12s ease-in-out infinite alternate;transform-origin:center}.background{width:100%;height:100%;object-fit:cover;display:block}.window{position:absolute;left:8%;top:5%;width:84%;height:65%;overflow:hidden;touch-action:none;cursor:crosshair}.window canvas{position:absolute;inset:0;width:100%;height:100%}.warmth{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.8s;background:radial-gradient(ellipse at 3% 72%,#ffd08b99,transparent 42%),linear-gradient(0deg,#b5672b36,transparent 65%);mix-blend-mode:screen}.lit .warmth{opacity:1}.lamp-glow{position:absolute;left:-12%;top:58%;width:34%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff5c4e8 0%,#ffbd57a8 10%,#ff9d393d 35%,transparent 70%);mix-blend-mode:screen;opacity:0;transition:opacity 1.2s;pointer-events:none}.lit .lamp-glow{opacity:1;animation:flicker 3s ease-in-out infinite}.character{position:absolute;left:28%;bottom:12%;width:48%;height:48%;border:0;padding:0;background:none;cursor:pointer;transform-origin:50% 95%;animation:sway 6s ease-in-out infinite;filter:drop-shadow(0 7px 4px #30251d40)}.character img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;transition:opacity .55s ease}.character .turn{opacity:0}.character.turned .turn{opacity:1}.character.turned .back{opacity:0}.lamp{position:absolute;left:0%;top:54%;width:16%;height:30%;border:0;background:transparent;cursor:pointer}.lamp:focus-visible,.character:focus-visible{outline:2px solid #fff1bd;outline-offset:4px;border-radius:40%}.steam{position:absolute;right:4%;top:62%;width:13%;height:14%;pointer-events:none;overflow:visible}.steam i{position:absolute;bottom:0;left:45%;width:35%;height:65%;border-left:2px solid #fff7e7a8;border-radius:50%;filter:blur(1px);opacity:0;animation:steam 4s ease-out infinite}.steam i:nth-child(2){left:65%;animation-delay:1.3s}.steam i:nth-child(3){left:25%;animation-delay:2.6s}.hearts{position:absolute;left:42%;top:44%;pointer-events:none}.heart{position:absolute;color:#df665e;font:22px Georgia;animation:float 1.8s ease-out forwards;text-shadow:0 1px 5px #fff9}.greeting{position:absolute;bottom:4%;left:4%;right:4%;text-align:center;color:#fff5df;text-shadow:0 2px 8px #382018,0 1px 2px #382018;opacity:0;animation:appear 2s ease 1s forwards;pointer-events:none}.greeting strong{display:block;font-family:"Brush Script MT","Segoe Script",cursive;font-size:clamp(24px,6.8vw,48px);font-weight:400;line-height:1.1}.greeting span{display:block;margin-top:.2em;font-family:CardHand,serif;font-size:clamp(15px,3vw,20px);letter-spacing:.18em}.hint{position:absolute;top:2.4%;left:0;right:0;text-align:center;font:14px/1.4 CardHand,serif;letter-spacing:.14em;color:#fff9e9c9;text-shadow:0 1px 5px #10232e;pointer-events:none;animation:hint 8s forwards}@keyframes breathe{to{transform:scale(1.015) translateY(-.2%)}}@keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}@keyframes flicker{50%{opacity:.78;transform:scale(.97)}}@keyframes steam{0%{opacity:0;transform:translateY(0) scale(.7)}25%{opacity:.7}100%{opacity:0;transform:translateY(-70%) scale(1.3)}}@keyframes float{to{opacity:0;transform:translate(var(--x),-85px) rotate(var(--r)) scale(.7)}}@keyframes appear{to{opacity:1}}@keyframes hint{0%,65%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.scene,.character,.lamp-glow{animation:none}.greeting{animation:none;opacity:1}}
</style>
</head>
<body>
<main class="card" aria-label="一张可以互动的圣诞贺卡">
 <div class="scene" id="scene">
  <img class="background" src="bg.webp" alt="冬夜里望向雪中小镇的温暖窗台">
  <div class="window" id="window" aria-label="在窗上滑动，搅动雪花并擦去雾气"><canvas id="snow"></canvas><canvas id="fog"></canvas></div>
  <div class="warmth"></div><div class="lamp-glow"></div>
  <div class="steam" aria-hidden="true"><i></i><i></i><i></i></div>
  <button class="lamp" id="lamp" aria-label="点亮或熄灭油灯" aria-pressed="false"></button>
  <button class="character" id="character" aria-label="轻点狐兔"><img class="back" src="kit.webp" alt="戴着红围巾看雪的狐兔"><img class="turn" src="kit_turn.webp" alt="回头微笑的狐兔"></button>
  <div class="hearts" id="hearts" aria-hidden="true"></div>
  <div class="greeting"><strong>Merry Christmas</strong><span>· 来自狐兔 ·</span></div>
  <div class="hint">划一划窗，轻点灯与狐兔</div>
 </div>
</main>
<script>
(()=>{const win=document.querySelector('#window'),snow=document.querySelector('#snow'),fog=document.querySelector('#fog'),s=snow.getContext('2d'),f=fog.getContext('2d'),scene=document.querySelector('#scene'),lamp=document.querySelector('#lamp'),kit=document.querySelector('#character'),hearts=document.querySelector('#hearts');let w,h,dpr,flakes=[],last=0,wind=0,windY=0,down=false,previous=null,turnTimer;const random=(a,b)=>a+Math.random()*(b-a);function resize(){const r=win.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,2);for(const c of [snow,fog]){c.width=w*dpr;c.height=h*dpr;c.getContext('2d').setTransform(dpr,0,0,dpr,0,0)}flakes=Array.from({length:95},()=>({x:random(0,w),y:random(0,h),z:random(.3,1),phase:random(0,7)}));paintFog()}function paintFog(){f.clearRect(0,0,w,h);const g=f.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(220,235,236,0)');g.addColorStop(.4,'rgba(220,235,236,.025)');g.addColorStop(.8,'rgba(225,235,232,.08)');g.addColorStop(1,'rgba(225,235,232,0)');f.fillStyle=g;f.fillRect(0,0,w,h)}function animate(t){const dt=Math.min((t-last)/16.67||1,2);last=t;s.clearRect(0,0,w,h);for(const p of flakes){p.y+=(.22+p.z*.65)*dt;p.x+=(Math.sin(t/1800+p.phase)*.16+wind*p.z)*dt;if(p.y>h+4)p.y=-4;if(p.x>w+5)p.x=-5;if(p.x< -5)p.x=w+5;s.beginPath();s.arc(p.x,p.y,.5+p.z*1.65,0,Math.PI*2);s.fillStyle=`rgba(255,255,248,${.32+p.z*.57})`;s.fill()}wind*=.97;windY*=.97;requestAnimationFrame(animate)}function point(e){const r=win.getBoundingClientRect();return{x:(e.clientX-r.left)*w/r.width,y:(e.clientY-r.top)*h/r.height}}function rub(e){const p=point(e);if(previous){wind=Math.max(-5,Math.min(5,(p.x-previous.x)*.2));windY=p.y-previous.y;f.save();f.globalCompositeOperation='destination-out';f.lineWidth=28;f.lineCap='round';f.lineJoin='round';f.beginPath();f.moveTo(previous.x,previous.y);f.lineTo(p.x,p.y);f.stroke();f.restore()}previous=p}win.addEventListener('pointerdown',e=>{down=true;previous=point(e);win.setPointerCapture(e.pointerId)});win.addEventListener('pointermove',e=>{if(down)rub(e);else if(e.pointerType==='mouse'){const p=point(e);if(previous)wind=Math.max(-2,Math.min(2,(p.x-previous.x)*.08));previous=p}});for(const ev of ['pointerup','pointercancel','pointerleave'])win.addEventListener(ev,()=>{down=false;previous=null});setInterval(()=>{f.save();f.globalCompositeOperation='source-over';f.fillStyle='rgba(220,235,236,.001)';f.fillRect(0,0,w,h);f.restore()},600);lamp.addEventListener('click',()=>{const on=scene.classList.toggle('lit');lamp.setAttribute('aria-pressed',String(on))});kit.addEventListener('click',()=>{kit.classList.add('turned');clearTimeout(turnTimer);turnTimer=setTimeout(()=>kit.classList.remove('turned'),2000);for(let i=0;i<5;i++){const el=document.createElement('span');el.className='heart';el.textContent='♥';el.style.left=`${i*15}px`;el.style.top=`${Math.random()*20}px`;el.style.setProperty('--x',`${random(-35,35)}px`);el.style.setProperty('--r',`${random(-25,25)}deg`);el.style.animationDelay=`${i*.1}s`;hearts.appendChild(el);setTimeout(()=>el.remove(),2500)}});window.addEventListener('resize',resize);resize();requestAnimationFrame(animate)})();
</script>
</body>
</html>
