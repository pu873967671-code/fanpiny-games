#wrap{position:absolute;left:50%;top:50%;width:1200px;height:675px}
canvas{display:block;width:1200px;height:675px;border-radius:18px;touch-action:none}
.tag{position:absolute;left:22px;top:16px;padding:10px 16px 8px;background:#fffaf2e6;border-radius:6px 16px 8px 14px;color:#7a5240;box-shadow:0 4px 12px #6b4a3a22;transform:rotate(-1.5deg);pointer-events:none}

.cnt{position:absolute;right:20px;top:16px;padding:8px 14px 6px;background:#fffaf2e6;border-radius:16px 6px 14px 8px;color:#7a5240;font:18px/1.2 wk,sans-serif;box-shadow:0 4px 12px #6b4a3a22;transform:rotate(1.2deg);pointer-events:none;text-align:right}

.cnt i{display:block;font-style:normal;font-size:15px;color:#a07c68}

</style></head><body>
<div id="wrap"><canvas id="c"></canvas>
<div class="tag"><b>狐兔音量条</b><i>拖动滑块 · 越大声它越疯</i></div>
<div class="cnt">音量 <b id="n">0</b><i id="lv">睡着了</i></div>

<div id="bar">
<button id="mute" class="on" title="静音"><svg viewBox="0 0 32 32"><path d="M5 12h5l7-6v20l-7-6H5z" fill="#c9755e"/><g id="wv" fill="none" stroke="#c9755e" stroke-width="2.6" stroke-linecap="round"><path d="M21 12q3 4 0 8"/><path d="M24.5 9q5.5 7 0 14"/></g><g id="mx" stroke="#7b8fa6" stroke-width="2.8" stroke-linecap="round"><path d="M21 12l8 8M29 12l-8 8"/></g></svg></button>
<div class="sl"><input id="vol" type="range" min="0" max="100" value="0" step="1">

</div>
<svg id="fp" viewBox="0 0 30 30"><path d="M4 2l0 22 6-5 4 9 4-2-4-9 8 0z" fill="#fff" stroke="#5a3a2c" stroke-width="2" stroke-linejoin="round"/></svg>
</div>
<script>
const META={"fw":448,"fh":407,"ax":239,"ay":403,"ks":["v0","v1","v2","v3","v4","v5"],"items":[[383,346],[367,377],[356,383],[400,367],[392,383],[348,377],[384,371],[344,398]],"fx":[[318,361],[392,319],[325,361],[416,325],[320,320],[382,312],[322,345],[395,357]]};
const KS=['v0','v1','v2','v3','v4','v5'];
const SRC={bg:'bg.webp'};
for(const k of KS)SRC['k_'+k]='k_'+k+'.webp';
for(let i=0;i<8;i++){SRC['fx'+i]='fx_'+i+'.webp';SRC['it'+i]='items_'+i+'.webp';}
const IMG={};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=1200,H=675,DPR=Math.min(2,window.devicePixelRatio||1);
cv.width=W*DPR;cv.height=H*DPR;
const wrap=document.getElementById('wrap');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);wrap.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
const M=META,FW=M.fw,FH=M.fh,S=0.9,AX=600,AY=572;
const fxy=(x,y)=>[AX+(x-M.ax)*S,AY+(y-M.ay)*S];
// per level: frame order, ms per frame, mouth point (frame px), tempo (ms/beat)
const LV=[
 {name:'睡着了',f:[0,1,2,3,4,5,6,7],d:430,mouth:[239,175],bpm:0},
 {name:'悄悄话',f:[0,1,2,3,4,5,6,7],d:300,mouth:[239,165],bpm:90},
 {name:'小声哼歌',f:[0,1,2,3,4,5,6,7],d:300,mouth:[239,160],bpm:96},
 {name:'正常唱',f:[0,1,2,3,4,5,6,7],d:230,mouth:[239,160],bpm:112},
 {name:'放声唱',f:[0,1,2,3,4,5,6,7],d:160,mouth:[239,165],bpm:126},
 {name:'喇叭大喊',f:[0,1,2,3,4,5,6,7],d:95,mouth:[420,190],bpm:138},
];
const SAY=[
 ['呼……噜……','zzz……','（静音中，但它在打呼）'],
 ['（小小声）我跟你说哦……','嘘——别告诉别人','其实……我偷吃了饼干'],
 ['嗯～哼～哼～♪','哼哼哼～','嗯嗯～啦～'],
 ['啦啦啦～♪','狐兔小调～♪','今天也很开心～'],
 ['啊——啊——啊——！','我是舞台之星！！','高音来咯——！'],
 ['喂——！！！','大家好——！！','听得到吗——！！'],
];
const COL=['#f08a7a','#9cbf73','#f2c14e','#86b3e0','#d79be0'];
// ---------- state ----------
let vol=0,muted=true,lvl=0,prevL=0,lvT=0,fade=0,t0=null,now=0,last=0;
let sayI=0,loopN=0,beatAcc=0,ringAcc=0,noteAcc=0,shake=0;
const rings=[],parts=[];
const ITEMS=[ // x, groundY, height
 [298,174,74,0],[402,174,70,4],[880,174,70,7],[1008,174,74,1],
 [112,628,92,2],[222,632,80,3],[985,632,84,6],[1094,628,92,5]];
const items=ITEMS.map(([x,g,h,i])=>({x,g,h,i,y:0,vy:0,r:0,vr:0,sq:0}));
function levelOf(){if(muted)return 0;return vol<=15?1:vol<=40?2:vol<=65?3:vol<=88?4:5}
function setLevel(L){if(L===lvl)return;prevL=lvl;prevF=curFrame();lvl=L;lvT=now;fade=1;sayI=(sayI+1)%3;
  if(L===5){shake=12;burst(...mouth(),6,7)}
  document.getElementById('lv').textContent=LV[L].name;}
let prevF=0;
function curFrame(){const e=now-lvT,L=LV[lvl];return L.f[Math.floor(e/L.d)%L.f.length]}
function mouth(){return fxy(...LV[lvl].mouth)}
function burst(x,y,n,img){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=120+Math.random()*220;parts.push({img,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:0,max:.7,sz:28+Math.random()*16,rot:Math.random()*6,g:200})}}
// ---------- UI ----------
const volEl=document.getElementById('vol'),nEl=document.getElementById('n'),muteEl=document.getElementById('mute'),tip=document.getElementById('tip');
const ticks=[...document.querySelectorAll('.ticks span')];
function ui(){volEl.style.setProperty('--p',vol+'%');nEl.textContent=muted?'—':vol;muteEl.classList.toggle('on',muted);
 document.getElementById('wv').style.display=muted?'none':'';document.getElementById('mx').style.display=muted?'':'none';
 const L=levelOf();ticks.forEach((t,i)=>t.classList.toggle('on',L===i+1));}
function setVol(v){vol=Math.max(0,Math.min(100,Math.round(v)));volEl.value=vol;if(muted&&started)muted=false;ui();audioTarget()}
function setMute(m){muted=m;ui();audioTarget()}
let started=false;
function start(){if(started)return;started=true;tip.style.opacity=0;initAudio();muted=false;ui();audioTarget()}
volEl.addEventListener('input',()=>{start();setVol(+volEl.value)});
volEl.addEventListener('pointerdown',()=>start());
muteEl.addEventListener('click',()=>{if(!started){start();return}setMute(!muted)});
cv.addEventListener('pointerdown',()=>{if(!started){start();return}if(muted){setMute(false)}else{burst(...mouth(),5,7);hopAll(0.6)}});
// ---------- audio (Web Audio synth, all procedural) ----------
let AC=null,master,snoreG,noiseBuf,nextT=0,step=0,shaper;
function initAudio(){
 try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null;return}
 if(AC.state==='suspended')AC.resume();
 master=AC.createGain();master.gain.value=0;
 const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
 master.connect(comp);comp.connect(AC.destination);
 snoreG=AC.createGain();snoreG.gain.value=0;snoreG.connect(AC.destination);
 noiseBuf=AC.createBuffer(1,AC.sampleRate*1,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 shaper=AC.createWaveShaper();const c=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/512-1;c[i]=Math.tanh(x*4)}shaper.curve=c;shaper.connect(master);
 nextT=AC.currentTime+.08;setInterval(sched,40);
}
function audioTarget(){if(!AC)return;const L=levelOf(),t=AC.currentTime;
 const g=L===0?0:0.06+0.74*Math.pow(vol/100,1.6);master.gain.setTargetAtTime(g,t,.05);
 snoreG.gain.setTargetAtTime(L===0?0.05:0,t,.1);}
const MEL=[0,2,4,0,4,5,7,7,9,7,5,4,2,4,0,0];
const hz=(s,b)=>b*Math.pow(2,s/12);
function noise(t,dur,f,q,g,dest){const s=AC.createBufferSource();s.buffer=noiseBuf;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;const a=AC.createGain();
 a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(g,t+dur*.25);a.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(bp);bp.connect(a);a.connect(dest||master);s.start(t,Math.random()*.5);s.stop(t+dur+.05)}
function voice(t,f,dur,type,g,form,vib,dest){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);
 if(vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=5.6;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*vib,t+dur*.6);l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur+.1)}
 let n=o;for(const [ff,q] of form){const b=AC.createBiquadFilter();b.type=ff>0?'bandpass':'lowpass';b.frequency.value=Math.abs(ff);b.Q.value=q;n.connect(b);n=b}
 const a=AC.createGain();a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(g,t+.04);a.gain.setValueAtTime(g,t+dur*.7);a.gain.exponentialRampToValueAtTime(.001,t+dur);
 n.connect(a);a.connect(dest||master);o.start(t);o.stop(t+dur+.05)}
function sched(){if(!AC)return;const L=levelOf();
 while(nextT<AC.currentTime+.2){
  const bpm=L===0?60:LV[L].bpm,e=60/bpm/2,t=nextT,s=step%16,m=MEL[s];
  if(L===0){ if(s%8===0)noise(t,1.1,420,3,1,snoreG); if(s%8===4)noise(t,.7,900,4,.5,snoreG);}
  else if(L===1){ if([0,1,4,6,8,9,12].includes(s))noise(t,s%4===0?.16:.08,5200,1.6,.5);}
  else if(L===2){ if(s%2===0)voice(t,hz(m,262),e*2.1,'sine',.5,[[-700,.7]],.004);}
  else if(L===3){ voice(t,hz(m,392),e*(s%4===3?2:1.05),'triangle',.42,[[-2400,.7]],.008); if(s%4===0)voice(t,hz(m-12,262),e*3,'sine',.2,[[-800,.7]],0);}
  else if(L===4){ if(s%2===0){voice(t,hz(m+5,392),e*2.2,'sawtooth',.33,[[750,1.2],[-3200,.7]],.02);voice(t,hz(m+5,392)*1.005,e*2.2,'sawtooth',.25,[[1150,2],[-3200,.7]],.02);}
                  if(s%4===0)noise(t,.06,180,1,.6);}
  else { if(s%4===0){const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(560,t);o.frequency.exponentialRampToValueAtTime(330,t+.42);
      const b=AC.createBiquadFilter();b.type='bandpass';b.frequency.value=950;b.Q.value=.9;const a=AC.createGain();a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(.9,t+.03);a.gain.exponentialRampToValueAtTime(.001,t+.5);
      o.connect(b);b.connect(a);a.connect(shaper);o.start(t);o.stop(t+.55);noise(t,.3,1400,.8,.5,shaper);}
      if(s%2===1)noise(t,.05,160,1,.7);}
  nextT+=e;step++;}
}
function blip(f,g){if(!AC||levelOf()<3)return;const t=AC.currentTime;voice(t,f,.09,'sine',g,[[-5000,.7]],0)}
// ---------- sim ----------
function hopAll(k){items.forEach(it=>{if(it.y>-2){it.vy=-(260+Math.random()*420)*k;it.vr=(Math.random()-.5)*8*k;it.sq=.25*k}})}
function beat(){const L=lvl;if(L<2)return;const k=[0,0,.18,.42,.72,1.05][L];
 items.forEach(it=>{if(it.y>-1&&Math.random()<(L>=4?.95:.6)){it.vy=-(180+Math.random()*360)*k;it.vr=(Math.random()-.5)*(L>=4?9:3)*k;it.sq=.2*k}})}
function update(dt){
 const L=levelOf();setLevel(L);
 if(fade>0)fade=Math.max(0,fade-dt/0.14);
 const bpm=LV[lvl].bpm;
 if(bpm){beatAcc+=dt;const bl=60/bpm;if(beatAcc>=bl){beatAcc-=bl;beat()}}
 // rings
 const m=mouth();
 if(lvl>=1){const rate=[0,1.2,2,3.2,5,8][lvl]*(0.5+vol/100);ringAcc+=dt*rate;
   while(ringAcc>=1){ringAcc-=1;rings.push({x:m[0],y:m[1],r:lvl===1?14:24,life:0,max:lvl===1?.8:1.1+lvl*.12,c:COL[(Math.random()*5)|0],w:lvl===1?2:2+lvl*1.2,cone:lvl===5})}}
 for(const r of rings){r.life+=dt;r.r+=dt*(lvl===1?40:90+vol*3.2)}
 for(let i=rings.length-1;i>=0;i--)if(rings[i].life>rings[i].max)rings.splice(i,1);
 // particles: notes / Z / spit
 noteAcc+=dt;
 if(lvl===0&&noteAcc>1.1){noteAcc=0;const [x,y]=fxy(300,40);parts.push({img:4,x,y,vx:30,vy:-40,life:0,max:2.4,sz:30,rot:0,g:-6,sway:1})}
 if(lvl>=2&&lvl<=4&&noteAcc>[0,0,.7,.38,.2][lvl]){noteAcc=0;parts.push({img:Math.random()*4|0,x:m[0]+(Math.random()-.5)*60,y:m[1]-20,vx:(Math.random()-.5)*120*(lvl-1),vy:-(60+vol*1.6),life:0,max:1.8,sz:26+vol*.32,rot:(Math.random()-.5)*.6,g:-10,sway:1})}
 if(lvl===5&&noteAcc>.12){noteAcc=0;parts.push({img:Math.random()<.6?6:(Math.random()*4|0),x:m[0]+10,y:m[1]+(Math.random()-.5)*30,vx:380+Math.random()*320,vy:(Math.random()-.5)*260,life:0,max:1.2,sz:26+Math.random()*20,rot:Math.random()*6,g:120})}
 for(const p of parts){p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;if(p.sway)p.x+=Math.sin(p.life*5)*.6}
 for(let i=parts.length-1;i>=0;i--)if(parts[i].life>parts[i].max)parts.splice(i,1);
 // items
 for(const it of items){if(it.y<0||it.vy<0){it.vy+=1900*dt;it.y+=it.vy*dt;it.r+=it.vr*dt;
   if(it.y>=0){if(it.vy>320){it.sq=Math.min(.35,it.vy/2200);if(lvl>=4)parts.push({img:5,x:it.x+(Math.random()-.5)*30,y:it.g-8,vx:(Math.random()-.5)*60,vy:-30,life:0,max:.5,sz:30,rot:0,g:0});blip(900+it.i*90,.06)}
     it.y=0;it.vy=0;it.vr*=-.3}}
   it.r*=Math.pow(lvl>=5?.6:.02,dt);if(lvl>=5&&it.y>=0)it.r+=(Math.random()-.5)*.03;
   it.sq*=Math.pow(.004,dt)}
 shake=lvl===5?Math.max(shake*Math.pow(.05,dt),3+vol*.04):shake*Math.pow(.01,dt);
}
// ---------- draw ----------
function drawKit(){const L=lvl,fr=curFrame();
 const put=(k,f,a)=>{ctx.globalAlpha=a;ctx.drawImage(IMG['k_v'+k],f*FW,0,FW,FH,AX-M.ax*S,AY-M.ay*S,FW*S,FH*S)};
 ctx.save();ctx.globalAlpha=.18;ctx.fillStyle='#6b4a3a';ctx.beginPath();ctx.ellipse(AX+(L===5?-20:0),AY+4,135,18,0,0,6.28);ctx.fill();ctx.restore();
 if(fade>0)put(prevL,prevF,fade);put(L,fr,1-fade*.0);ctx.globalAlpha=1;}
function drawRings(){ctx.save();ctx.lineCap='round';
 for(const r of rings){const a=Math.max(0,1-r.life/r.max);ctx.strokeStyle=r.c;ctx.globalAlpha=a*.85;ctx.lineWidth=r.w*(0.6+a*.6);
  ctx.beginPath();if(r.cone)ctx.arc(r.x,r.y,r.r,-.6,.6);else if(lvl===1){ctx.setLineDash([3,7]);ctx.arc(r.x,r.y,r.r,0,6.28)}else{ctx.arc(r.x,r.y,r.r,-2.2,-.95);ctx.moveTo(r.x+Math.cos(-.75)*r.r,r.y+Math.sin(-.75)*r.r);ctx.arc(r.x,r.y,r.r,-.75,.6);ctx.moveTo(r.x+Math.cos(2.55)*r.r,r.y+Math.sin(2.55)*r.r);ctx.arc(r.x,r.y,r.r,2.55,3.9)}
  ctx.stroke();ctx.setLineDash([])}
 if(lvl===5){ // wind streaks blowing back over the ears
  ctx.strokeStyle='#fffaf2';ctx.lineWidth=4;for(let i=0;i<7;i++){const y=280+i*26+Math.sin(now/90+i)*6,x=(now*1.4+i*170)%520;ctx.globalAlpha=.55;ctx.beginPath();ctx.moveTo(760-x,y);ctx.lineTo(760-x-70-i*6,y+4);ctx.stroke()}}
 ctx.restore()}
function drawParts(){for(const p of parts){const im=IMG['fx'+p.img],a=Math.min(1,(p.max-p.life)/.4,p.life/.12);const s=p.sz/Math.max(im.width,im.height);
 ctx.save();ctx.globalAlpha=Math.max(0,a);ctx.translate(p.x,p.y);ctx.rotate(p.rot+(p.sway?Math.sin(p.life*4)*.25:0));ctx.drawImage(im,-im.width*s/2,-im.height*s/2,im.width*s,im.height*s);ctx.restore()}}
function drawItems(){for(const it of items){const im=IMG['it'+it.i],s=it.h/im.height,w=im.width*s,h=it.h;
 ctx.save();ctx.globalAlpha=.16;ctx.fillStyle='#6b4a3a';const hs=1/(1-it.y/180);ctx.beginPath();ctx.ellipse(it.x,it.g,w*.38*Math.min(1,hs),5,0,0,6.28);ctx.fill();ctx.restore();
 ctx.save();ctx.translate(it.x,it.g+it.y);ctx.rotate(it.r);ctx.scale(1+it.sq,1-it.sq);ctx.drawImage(im,-w/2,-h,w,h);ctx.restore()}}
function bubble(){const L=lvl;if(!started&&L===0)return;
 const txt=SAY[L][sayI%3],fs=L===0?22:Math.round(19+vol*.46),pad=fs*.55;ctx.font=`${fs}px wk,sans-serif`;
 const tw=ctx.measureText(txt).width,bw=tw+pad*2,bh=fs*1.25+pad*1.4;
 const m=mouth();let cx=L===5?m[0]+bw*.3:m[0]+150+bw/2,cy=L===5?m[1]-130-bh/2:LV[L]&&fxy(0,10)[1]-bh/2+20;
 const hw=L===5?bw*.64:bw/2;cx=Math.min(W-14-hw,Math.max(14+hw,cx));cy=Math.max(78+bh/2,cy);
 const j=L===5?3:L===4?1.2:0,jx=(Math.random()-.5)*j*2,jy=(Math.random()-.5)*j*2;
 const age=Math.min(1,(now-lvT)/180),pop=age<1?.6+.4*(1-Math.pow(1-age,3))*1.08:1;
 ctx.save();ctx.translate(cx+jx,cy+jy);ctx.scale(pop,pop);ctx.rotate(L===5?Math.sin(now/40)*.03:L===1?-.03:Math.sin(now/600)*.015);
 ctx.fillStyle=L===0?'#eef2f7':L===5?'#fff3c4':'#fffaf2';ctx.strokeStyle=L===5?'#e0604a':'#8a6250';ctx.lineWidth=L>=4?4:2.5;
 const tx=(m[0]-cx)/pop,ty=(m[1]-cy)/pop;
 if(L!==5){const bx=Math.max(-bw/2+18,Math.min(bw/2-40,tx*.25)),tip=[Math.max(-bw/2-30,tx*.55),Math.min(bh/2+60,Math.max(bh/2+18,ty*.5))];
  ctx.beginPath();ctx.moveTo(bx,bh/2-6);ctx.lineTo(tip[0],tip[1]);ctx.lineTo(bx+26,bh/2-6);ctx.closePath();ctx.fill();ctx.stroke()}
 ctx.beginPath();
 if(L===5){const n=16;for(let i=0;i<n*2;i++){const a=i/(n*2)*6.283,rr=i%2?1:1.14;ctx.lineTo(Math.cos(a)*bw*.55*rr,Math.sin(a)*bh*.62*rr)}ctx.closePath();
  ctx.moveTo(-bw*.42,bh*.4);ctx.lineTo(tx*.7,ty*.7);ctx.lineTo(-bw*.25,bh*.55)}
 else{ctx.roundRect(-bw/2,-bh/2,bw,bh,Math.min(bh/2,26))}
 if(L===1)ctx.setLineDash([6,6]);ctx.fill();ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle=L===5?'#c8402c':L===1?'#a08878':L===0?'#7b8fa6':'#7a4636';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,0,fs*.06);ctx.restore()}
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
 const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;ctx.save();ctx.translate(sx,sy);
 ctx.drawImage(IMG.bg,-8,-8,W+16,H+16);
