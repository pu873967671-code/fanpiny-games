function splitImg(im,cut,feather,keepTop){ // returns canvas with only top or bottom part, feathered at the cut (orig px)
  const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const g=c.getContext('2d');g.drawImage(im,0,0);

    const ho=at(hp),b1=-p['th'+s],b2=-p['sh'+s];T['th'+s]={o:ho,a:b1,im:th};const ko=add(ho,rot([0,TH],b1));T['sh'+s]={o:ko,a:b2,im:sn};
    T['foot'+s]=add(ko,rot([0,SHN],b2))}
  T.tail={o:at(J.tail),a:tr};
  const ha=T.head.a;T.earL={o:add(T.neck,rot(J.earL,ha)),a:ha};T.earR={o:add(T.neck,rot(J.earR,ha)),a:ha};return T}
// spring for secondary parts: [angle1,vel1,angle2,vel2] relative offsets driven by pivot acceleration
function spring(s,acc,dt,k1,k2,c,g,bias){const ax=acc[0];
  for(let n=0;n<2;n++){const i=n*2,k=n?k2:k1;const tq=-k*s[i]-c*s[i+1]+ax*g*(n?1.6:1)+(n?(-k*0.6*(s[i]-s[0])):0)+(bias||0);s[i+1]+=tq*dt;s[i]+=s[i+1]*dt;
    s[i]=Math.max(-0.9,Math.min(0.9,s[i]))}}
const BULBS=[[157,32],[200,55],[240,72],[290,90],[338,103],[385,113],[430,122],[480,125],[530,124],[578,118],[625,107],[664,92],[700,76],[145,105],[175,118],[210,130],[245,140],[280,145],[315,146],[345,138],[375,135]].map(([x,y])=>[x*1.435,y*1.435]);
const BC=['#ffd27a','#ff9ec4','#9ee8ff','#c6ff9e'];
function burst(n){for(let i=0;i<n;i++)S.confetti.push({x:S.x+(Math.random()-.5)*160,y:300,vx:(Math.random()-.5)*260,vy:-200-Math.random()*240,r:Math.random()*6.28,vr:(Math.random()-.5)*10,c:BC[i%4],life:1.6})}
let lastTs=null;const SC=0.37,FLOOR=552;
function loop(ts){requestAnimationFrame(loop);if(lastTs===null)lastTs=ts;let dt=Math.min(0.05,(ts-lastTs)/1000);lastTs=ts;if(dt<=0)dt=1/60;step(dt);draw()}
function step(dt){S.t+=dt;const C=CLIPS[S.clip];let p=sample(S.clip,S.t);
  if(S.fade>0&&S.prev){S.fade=Math.max(0,S.fade-dt/0.35);const u=1-S.fade;p=blend(S.prev,p,u*u*(3-2*u))}
  curPose=p;
  const bp=60/BPM[S.clip];const bt=S.t/bp;const nb=Math.floor(bt);if(nb!==S.beat){S.beat=nb;S.pulse=1;if(nb%4===0)burst(5)}S.pulse=Math.max(0,S.pulse-dt*3.2);
  if(S.clip==='walk'){const L=(TH+SHN)*SC,dur=C.n/C.fps,sp=Math.abs(C.adv)*L/dur;S.x+=S.dir*sp*dt;if(S.x>930){S.x=930;S.dir=-1}if(S.x<270){S.x=270;S.dir=1}}
  else S.x+=(600-S.x)*Math.min(1,dt*2.5);
  S.blinkT-=dt;if(S.blinkT<0){S.blink=0.13;S.blinkT=2.2+Math.random()*2.5}S.blink=Math.max(0,S.blink-dt);
  S.confetti=S.confetti.filter(q=>(q.life-=dt)>0);S.confetti.forEach(q=>{q.vy+=520*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.r+=q.vr*dt});
}
function rig(){const p=shape(curPose),T=fk(p);
  // ground: lowest foot touches floor, plus mocap lift for jumps
  const low=Math.max(T.footL[1],T.footR[1]);const L=(TH+SHN);
  const hipY=FLOOR-(low+6)*SC-p.lift*L*SC*0.9;const dirX=S.clip==='walk'?S.dir:1;
  const sway=S.clip==='walk'?0:p.rx*L*SC*0.5;return {p,T,hip:[S.x+sway,hipY],dirX}}
let R=null;
function draw(){ctx.clearRect(0,0,1200,675);if(stage.complete)ctx.drawImage(stage,0,0,1200,675);
  // night dim + beat light
  ctx.fillStyle='rgba(10,8,30,0.18)';ctx.fillRect(0,0,1200,675);
  ctx.save();ctx.globalCompositeOperation='lighter';
  BULBS.forEach(([x,y],i)=>{const on=((i+S.beat)%3===0)?1:0.35;const a=0.10+0.32*on*(0.4+0.6*S.pulse);const g=ctx.createRadialGradient(x,y,0,x,y,38);g.addColorStop(0,BC[(i+S.beat)%4]);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=a;ctx.fillStyle=g;ctx.fillRect(x-40,y-40,80,80)});
  // two sweeping beams
  const tt=S.t;for(const [ox,col,ph] of [[160,'rgba(255,170,220,',0],[1040,'rgba(150,220,255,',1.7]]){const tx=S.x+Math.sin(tt*1.3+ph)*220;ctx.globalAlpha=0.16+0.18*S.pulse;
    const g=ctx.createLinearGradient(ox,0,tx,560);g.addColorStop(0,col+'0.9)');g.addColorStop(1,col+'0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(ox-14,-10);ctx.lineTo(ox+14,-10);ctx.lineTo(tx+90,570);ctx.lineTo(tx-90,570);ctx.fill()}
  // spotlight follows
  ctx.globalAlpha=0.22+0.25*S.pulse;const sg=ctx.createRadialGradient(S.x,FLOOR,10,S.x,FLOOR,190);sg.addColorStop(0,'#ffe2a0');sg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=sg;ctx.save();ctx.translate(S.x,FLOOR);ctx.scale(1,0.32);ctx.translate(-S.x,-FLOOR);ctx.fillRect(S.x-200,FLOOR-200,400,400);ctx.restore();
  ctx.restore();ctx.globalAlpha=1;
  if(!curPose)return;R=rig();const {p,T,hip,dirX}=R;
  // shadow
  const air=p.lift;ctx.fillStyle='rgba(30,15,10,'+(0.35-0.2*Math.min(1,air*2))+')';ctx.beginPath();ctx.ellipse(hip[0],FLOOR-2,95*(1-0.3*Math.min(1,air*2)),16,0,0,7);ctx.fill();
  ctx.save();ctx.translate(hip[0],hip[1]);ctx.scale(SC*dirX,SC);
  // secondary: pivot accelerations in screen px (approx from head pivot motion)
  const hw=add(T.neck,[0,0]);const hp=[hip[0]+hw[0]*SC*dirX,hip[1]+hw[1]*SC];
  if(S.lastHead){const v=[(hp[0]-S.lastHead[0]),(hp[1]-S.lastHead[1])];if(S.lastV){const acc=[(v[0]-S.lastV[0])*dirX*60,(v[1]-S.lastV[1])*60];
    const dt=1/60;spring(S.spr.earL,acc,dt,60,45,7,0.9);spring(S.spr.earR,acc,dt,60,45,7,0.9);spring(S.spr.tail,acc,dt,40,30,5,-0.7,Math.sin(S.t*6.28*BPM[S.clip]/120)*6)}S.lastV=v}S.lastHead=hp;
  const put=(o,a,f)=>{ctx.save();ctx.translate(o[0],o[1]);ctx.rotate(a);f();ctx.restore()};
  // tail (behind): root segment + tip segment rotating about mid pivot
  const ts=S.spr.tail;put(T.tail.o,T.tail.a*0.5+0.15+ts[0],()=>{
    put([150-42,300-490],ts[2]*1.2,()=>{ctx.drawImage(SEG.tail1,-150,-300,SEG.tail1.width*2,SEG.tail1.height*2)});ctx.drawImage(SEG.tail0,-42,-490,SEG.tail0.width*2,SEG.tail0.height*2)});
  // legs
  for(const s of ['R','L']){put(T['sh'+s].o,T['sh'+s].a,()=>dpart(I[T['sh'+s].im],PIV.sh));put(T['th'+s].o,T['th'+s].a,()=>dpart(I[T['th'+s].im],PIV.th))}
  put(T.torso.o,T.torso.a,()=>dpart(I.torso,PIV.torso));
  // ears: hang down in world (gravity) blended with head, two rigid segments
  for(const [e,im,sp] of [['earL','earA',S.spr.earL],['earR','earB',S.spr.earR]]){const base=T[e].a*0.55+sp[0]+(e==='earL'?0.06:-0.06);
    put(T[e].o,base,()=>{put([0,200],sp[2]*1.3,()=>ctx.drawImage(SEG[im+'1'],-103,-248,SEG[im+'1'].width*2,SEG[im+'1'].height*2));ctx.drawImage(SEG[im+'0'],-103,-48,SEG[im+'0'].width*2,SEG[im+'0'].height*2)})}
  // head (expression swap)
  let face=S.face;if(S.blink>0&&(face==='head'||face==='h_smile'||face==='h_oh'))face='h_happy';
  put(T.head.o,T.head.a,()=>{if(face==='head')dpart(I.head,PIV.head);else{ctx.scale(1.0,1.0);dpart(I[face],PIV.h)}});
  // arms on top
  for(const s of ['R','L']){put(T['ua'+s].o,T['ua'+s].a,()=>dpart(I[T['ua'+s].im],PIV.ua));put(T['fa'+s].o,T['fa'+s].a,()=>dpart(I[T['fa'+s].im],PIV.fa))}
  ctx.restore();
  // confetti
  S.confetti.forEach(q=>{ctx.save();ctx.globalAlpha=Math.min(1,q.life);ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.fillStyle=q.c;ctx.fillRect(-5,-3,10,6);ctx.restore()});
  if(S.pop>0){S.pop-=1/60}
}
function hitPuppet(x,y){if(!R)return false;const hx=R.hip[0],hy=R.hip[1];return Math.abs(x-hx)<110&&y>hy-230&&y<FLOOR+10}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*1200/r.width,y=(e.clientY-r.top)*675/r.height;
  if(hitPuppet(x,y)){const i=FACES.indexOf(S.face);S.face=FACES[(i+1)%FACES.length];S.blink=0;S.blinkT=3;burst(10);S.spr.earL[1]+=4;S.spr.earR[1]-=4;S.spr.tail[1]+=5}});
window.__api={setClip,setFace:f=>{S.face=f},S};
</script></body></html>
