<script>
const META={"cw":900,"ch":640,"gx":450,"gy":600,"info":{"hungry_thin":[1.162,370,222],"nope_thin":[1.132,380,234],"eat_thin":[1.141,377,223],"sad_thin":[1.123,383,236],"eat_norm":[1.12,384,229],"sad_norm":[1.135,379,233],"eat_full":[1.132,380,238],"sad_full":[1.103,390,232],"eat_round":[1.117,385,251],"sad_round":[1.051,409,287],"max_round":[1.1,391,212]},"eye":{"hungry_thin":327.1,"nope_thin":321.6,"eat_thin":322.3,"sad_thin":326.8,"eat_norm":317.8,"sad_norm":328.4,"eat_full":321.5,"sad_full":320.8,"eat_round":308.2,"sad_round":310.8,"max_round":316.4},"fw":498,"fh":445,"ax":267,"ay":441,"h0":430,"fx":{"food0":[287,408],"food1":[311,370],"food2":[364,342],"food3":[330,313],"food4":[363,323],"food5":[347,361],"food6":[364,357],"food7":[356,335],"fx0":[444,351],"fx1":[427,308],"fx2":[440,366],"fx3":[333,350],"fx4":[444,350],"fx5":[419,368],"fx6":[389,346],"fx7":[225,234]}};
const KS=['hungry_thin','nope_thin','eat_thin','sad_thin','eat_norm','sad_norm','eat_full','sad_full','eat_round','sad_round','max_round'];
const SRC={bg:'bg.webp'};
for(const k of KS)SRC['k_'+k]='k_'+k+'.webp';
for(let i=0;i<8;i++){SRC['food'+i]='food_'+i+'.webp';SRC['fx'+i]='fx_'+i+'.webp';}
const IMG={};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=1200,H=675,DPR=Math.min(2,window.devicePixelRatio||1);
cv.width=W*DPR;cv.height=H*DPR;
const wrap=document.getElementById('wrap');
let FIT=1;function fit(){FIT=Math.min(innerWidth/W,innerHeight/H);wrap.style.transform=`translate(-50%,-50%) scale(${FIT})`;}
addEventListener('resize',fit);fit();
const M=META,FW=M.fw,FH=M.fh,S=0.86,AX=390,AY=606;
const MOUTH={thin:[-30,-230],norm:[-30,-234],full:[-30,-231],round:[-30,-244],lie:[-183,-168]};
const mouth=st=>{const m=MOUTH[st];return [AX+m[0]*S,AY+m[1]*S]};
// ---------- strength ----------
const COMMON=['password','123456','12345678','qwerty','abc123','111111','iloveyou','admin','000000','letmein','123123','woaini','5201314','monkey','dragon','football','666666','888888','qwertyuiop','1q2w3e'];
function rate(p){
 const r={len:p.length>=14,low:/[a-z]/.test(p),up:/[A-Z]/.test(p),num:/\d/.test(p),sym:/[^A-Za-z0-9]/.test(p)};
 const lw=p.toLowerCase();r.com=p.length>0&&!COMMON.some(c=>lw.includes(c)&&p.length<c.length+6);
 if(!p)return{lv:0,r};
 let pts=(p.length>=6)+(p.length>=10)+(p.length>=14)+Math.max(0,r.low+r.up+r.num+r.sym-1);
 if(/(.)\1\1/.test(p))pts--;
 if(/(0123|1234|2345|3456|4567|5678|6789|abcd|qwer|asdf)/i.test(p))pts--;
 if(!r.com)pts=Math.min(pts,1);
 const lv=pts<=1?1:pts<=3?2:pts==4?3:pts==5?4:5;
 return{lv:lv==5&&!(r.len&&r.low&&r.up&&r.num&&r.sym)?4:lv,r};
}
const STAGE=['thin','thin','norm','full','round','round'];
const LV=[['饿扁了','打几个字喂喂它吧'],['太弱了','它捂着嘴不肯吃'],['还行','勉强吃两口，正常体型'],['好吃！','吃饱饱了'],['圆滚滚','再强一点就撑满了'],['最强密码','撑到躺平拍肚子！']];
const BARC=['#efe0d1','#e9a28f','#f2c27a','#bcd27c','#8fc06c','#f49aa8'];
const SAY={
 0:['肚子咕咕叫…','喂我点密码嘛','好饿呀'],
 1:['咦～不要','这个不好吃！','太简单了，不吃','（捂嘴）'],
 2:['嗯，能吃','啊呜','嚼嚼'],
 3:['好吃！','再来一口','吃饱饱～'],
 4:['好撑…但还能吃','圆滚滚啦','嗝…'],
 5:['撑到躺平','嗝～满足','这密码太香了'],
 sad:['诶？我的饭…','呜…被拿走了','别删嘛'],
};
// ---------- animation ----------
let disp='thin',lv=0,cur=null,lastTs=0,clock=0,pop=0,bubble=null,particles=[],foods=[],blinkAt=2500,lieLoop=false;
function sheet(kind,st){if(kind==='max')return 'max_round';if(st==='thin'&&kind==='eat')return 'eat_thin';return kind+'_'+st}
function play(k,f,d,next){cur={k,f,d,i:0,t:0,next}}
function idle(){
 if(lv>=5){lieLoop=true;play('max_round',[3,4,5,6,7,4],[260,260,320,520,300,280],'loop');return}
 lieLoop=false;
 if(disp==='thin')play('hungry_thin',[0,0,1,1,2,3,4,0,5,6,0,0],[700,200,600,240,300,500,400,500,500,500,600,900],'loop');
 else play(sheet('eat',disp),[0],[1e9],null);
}
function say(t,ms=1600){bubble={t,until:clock+ms}}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function spark(x,y,n,img='fx5',up=-0.2){for(let i=0;i<n;i++)particles.push({img,x,y,vx:(Math.random()-.5)*0.5,vy:up-Math.random()*0.25,g:0.0004,life:900+Math.random()*500,age:0,s:0.10+Math.random()*0.08,rot:Math.random()*6})}
function crumbs(x,y){for(let i=0;i<7;i++)particles.push({img:'fx1',x,y,vx:(Math.random()-.5)*0.45,vy:-0.1-Math.random()*0.2,g:0.0016,life:700,age:0,s:0.06+Math.random()*0.05,rot:Math.random()*6,floor:AY-6})}
function heart(x,y){particles.push({img:'fx2',x,y,vx:(Math.random()-.5)*0.08,vy:-0.07,g:0,life:1600,age:0,s:0.13+Math.random()*0.07,rot:(Math.random()-.5)*.4,wob:Math.random()*6})}
// ---------- input ----------
const pw=document.getElementById('pw'),eye=document.getElementById('eye'),bars=[...document.querySelectorAll('#bar i')],lvEl=document.getElementById('lv');
let prev='';
eye.onclick=()=>{pw.type=pw.type==='password'?'text':'password';eye.textContent=pw.type==='password'?'显示':'隐藏';pw.focus()};
const mc=document.createElement('canvas').getContext('2d');
function caret(){const b=pw.getBoundingClientRect(),wb=wrap.getBoundingClientRect();mc.font='22px ui-monospace,Menlo,Consolas,monospace';
 const txt=pw.type==='password'?'•'.repeat(pw.value.length):pw.value;const tw=Math.min(mc.measureText(txt).width+txt.length*2,b.width/FIT-80);
 return [(b.left-wb.left)/FIT+16+tw,(b.top-wb.top)/FIT+26]}
function ui(R){bars.forEach((b,i)=>{b.style.background=i<R.lv?BARC[R.lv]:BARC[0];b.style.transform=i==R.lv-1?'scaleY(1.25)':''});
 lvEl.innerHTML=`<b>${LV[R.lv][0]}</b> · ${LV[R.lv][1]}`;
 document.querySelectorAll('li').forEach(li=>li.classList.toggle('ok',!!R.r[li.dataset.r]))}
pw.addEventListener('input',()=>{
 const v=pw.value,R=rate(v);ui(R);
 if(v.length>prev.length){for(let i=0;i<Math.min(3,v.length-prev.length);i++)feed(R.lv,i*90)}
 else if(v.length<prev.length){lv=R.lv;setDisp(STAGE[lv]);sad()}
 prev=v;
});
function feed(L,delay){
 const [sx,sy]=caret();const bad=L<=1;
 const img=bad?'fx6':pick(L==2?['food0','food1','food7']:L==3?['food2','food4','food3','food1']:['food5','food6','food3','food2']);
 foods.push({img,sx,sy,t:-delay,dur:520,L,bad,rot:Math.random()*6,vr:(Math.random()-.5)*0.02});
 if(!bad&&!(cur&&cur.k.startsWith('eat')&&cur.i<=1)&&!(lv>=5&&L>=5)){const st=disp;play(sheet('eat',st),[0,2],[90,1e9],null);cur.wait=true}
 if(bad&&!(cur&&cur.k==='nope_thin'&&cur.i<4))play('nope_thin',[0,1],[120,1e9],null),cur.wait=true;
}
function setDisp(st){if(st!==disp){disp=st;pop=1}}
function arrive(f){
 const tgt=STAGE[f.L];
 if(f.bad){lv=f.L;setDisp('thin');play('nope_thin',[3,3,4,5,5,6,6,7],[260,200,320,300,200,380,300,500],'idle');f.bounce=true;say(pick(SAY[1]));const [mx,my]=mouth('thin');spark(mx+70*S,my-150*S,1,'fx7',-0.05);return}
 lv=f.L;
 if(f.L>=5){setDisp('round');const [mx,my]=mouth('round');crumbs(mx,my);
   if(!lieLoop){play('max_round',[3,0,1,2,3,4,5],[120,200,220,240,300,300,500],'idle');say(pick(SAY[5]),2200);spark(AX-30*S,AY-300*S,4)}
   else{heart(mx,my-30);} return}
 setDisp(tgt);const [mx,my]=mouth(tgt);crumbs(mx,my);
 play(sheet('eat',tgt),[3,4,5,4,5,6,7,7],[150,130,130,130,130,180,260,300],'idle');
 if(Math.random()<.5)say(pick(SAY[f.L]));
 if(f.L>=3&&Math.random()<.5)heart(mx+40,my-40);
}
function sad(){
 if(lv>=5){idle();return}
 const st=disp;play('sad_'+st,[1,2,3,3,4,5,5,6,7],[160,200,260,320,360,300,300,260,400],'idle');say(pick(lv==0?['诶？我的饭…','呜…全没了']:SAY.sad));
 const [mx,my]=mouth(st);particles.push({img:'fx3',x:mx-48*S,y:my-50*S,vx:-0.02,vy:0.03,g:0.0005,life:900,age:0,s:0.16,rot:0});
 if(lv==0)setTimeout(()=>{},0);
}
// ---------- render ----------
function drawImg(k,x,y,s,rot=0,a=1){const im=IMG[k];if(!im)return;const w=im.width*s,h=im.height*s;ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.rotate(rot);ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore()}
function drawKit(){
 const k=cur.k,fr=cur.f[cur.i];const im=IMG['k_'+k];
 const p=pop>0?1+0.07*Math.sin((1-pop)*Math.PI*3)*pop:1;
 ctx.save();ctx.translate(AX,AY);ctx.scale(S*(2-p),S*p);
 // soft contact shadow
 ctx.fillStyle='rgba(110,70,50,.18)';ctx.beginPath();ctx.ellipse(0,-4,({thin:150,norm:175,full:205,round:245})[disp]||200,22,0,0,7);ctx.fill();
 ctx.drawImage(im,fr*FW,0,FW,FH,-M.ax,-M.ay,FW,FH);ctx.restore();
}
function drawBubble(){if(!bubble||clock>bubble.until)return;const st=lieLoop?'lie':disp;const [mx,my]=mouth(st);
 const x=mx-170,y=my-(lieLoop?190:300)*S;ctx.save();ctx.font='22px wk,sans-serif';const w=ctx.measureText(bubble.t).width+32;
 const a=Math.min(1,(bubble.until-clock)/250);ctx.globalAlpha=a;ctx.fillStyle='#fffaf2';ctx.strokeStyle='#d9b9a2';ctx.lineWidth=2;
 ctx.beginPath();ctx.roundRect(x-w/2,y-24,w,44,18);ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.moveTo(x+w/2-30,y+18);ctx.lineTo(x+w/2-6,y+36);ctx.lineTo(x+w/2-46,y+19);ctx.fill();
 ctx.fillStyle='#7a5240';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(bubble.t,x,y-1);ctx.restore()}
function tick(ts){
 const dt=Math.min(50,lastTs?ts-lastTs:16);lastTs=ts;clock+=dt;
 // anim
 if(cur){cur.t+=dt;const d=Array.isArray(cur.d)?cur.d[cur.i]:cur.d;
  if(cur.t>=d){cur.t=0;cur.i++;if(cur.i>=cur.f.length){if(cur.next==='loop')cur.i=0;else if(cur.next==='idle')idle();else cur.i=cur.f.length-1}}}
 if(cur.k==='max_round'&&lieLoop){const fr=cur.f[cur.i];if(fr==5&&cur.t<dt){const [mx,my]=mouth('lie');particles.push({img:'fx4',x:mx+10,y:my-20,vx:0.03,vy:-0.06,g:0,life:1200,age:0,s:0.22,grow:1,rot:0});if(Math.random()<.4)say(pick(['嗝～','嗝…满足','（拍肚子）']),1200)}
  if(Math.random()<dt/700){heart(AX+(Math.random()*260-110)*S,AY-200*S)}}
 // blink / idle chatter
 if(cur.k.startsWith('eat_')&&cur.f.length==1&&cur.next===null&&!cur.wait){if(clock>blinkAt){play(cur.k,[1,0],[150,1e9],null);blinkAt=clock+2200+Math.random()*2200}}
 if(lv==0&&(!bubble||clock>bubble.until+3500)&&clock>1200)say(pick(SAY[0]),1800);
 pop=Math.max(0,pop-dt/450);
 // foods
 for(const f of foods){f.t+=dt;if(f.bounce){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=0.0018*dt;f.rot+=0.01*dt;f.a=Math.max(0,1-(f.t-f.bt)/700);continue}
  if(f.t<0)continue;const u=Math.min(1,f.t/f.dur);const st=f.bad?'thin':(f.L>=5&&lieLoop?'lie':STAGE[f.L]);const [tx,ty]=mouth(st);
  f.x=f.sx+(tx-f.sx)*u;f.y=f.sy+(ty-f.sy)*u-Math.sin(u*Math.PI)*150;f.rot+=f.vr*dt;f.s=0.15-0.09*u*u;
  if(u>=1&&!f.done){f.done=true;arrive(f);if(f.bad){f.bounce=true;f.bt=f.t;f.vx=0.25;f.vy=-0.5}else f.gone=true}}
 foods=foods.filter(f=>!f.gone&&!(f.bounce&&f.a<=0));
 for(const p of particles){p.age+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt+(p.wob!=null?Math.sin(p.age/220+p.wob)*0.25:0);p.y+=p.vy*dt;if(p.floor&&p.y>p.floor){p.y=p.floor;p.vy*=-0.3;p.vx*=0.6}if(p.grow)p.s+=dt*0.00015}
 particles=particles.filter(p=>p.age<p.life);
 // draw
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.drawImage(IMG.bg,0,0,W,H);
 drawImg('fx0',AX-215,AY-42,0.30);
 drawKit();
 for(const f of foods)if(f.t>=0)drawImg(f.img,f.x,f.y,f.s,f.rot,f.a==null?1:f.a);
 for(const p of particles)drawImg(p.img,p.x,p.y,p.s,p.rot||0,Math.min(1,(p.life-p.age)/300));
 drawBubble();
 requestAnimationFrame(tick);
}
function boot(){idle();ui(rate(''));pw.focus();window.__api={lv:()=>lv,disp:()=>disp,cur:()=>cur.k};requestAnimationFrame(tick)}
let n=0;const keys=Object.keys(SRC);keys.forEach(k=>{const im=new Image();im.onload=()=>{if(++n==keys.length)boot()};im.onerror=()=>{console.error('img',k);if(++n==keys.length)boot()};im.src=SRC[k];IMG[k]=im});
</script></body></html>
