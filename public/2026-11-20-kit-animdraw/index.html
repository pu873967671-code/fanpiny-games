<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>狐兔小剧场 · Animated Drawings 动捕测试</title>
<style>
html,body{margin:0;height:100%;background:#2b2320;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;color:#fff3e4}
#wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;gap:12px;padding:10px;box-sizing:border-box}
canvas{width:min(96vw,900px,calc((100vh - 150px)*1.5));aspect-ratio:3/2;border-radius:18px;box-shadow:0 10px 40px #0008;background:#000}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:inherit;font-size:15px;border:0;border-radius:999px;padding:9px 16px;background:#f6dcc0;color:#5a3524;cursor:pointer;box-shadow:0 3px 0 #b98a68}
button.on{background:#ff9f6e;color:#fff;box-shadow:0 3px 0 #c4643a}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #b98a68}
small{opacity:.6;font-size:12px}
</style></head><body>
<div id="wrap">
<canvas id="cv" width="1200" height="800"></canvas>
<div class="row" id="moves"></div>
<div class="row" id="chars"></div>
<small>Meta AnimatedDrawings（MIT）· 一张狐兔全身画 + 手标 22 个关节点 + CMU/FAIR 动捕 BVH</small>
</div>
<script>
const SRC=/*ASSETS*/{stage:'web/stage.webp',kit_b_dab:'web/kit_b_dab.webp',kit_b_jumping:'web/kit_b_jumping.webp',kit_b_wave_hello:'web/kit_b_wave_hello.webp',kit_b_zombie:'web/kit_b_zombie.webp',kit_a_dab:'web/kit_a_dab.webp',kit_a_wave_hello:'web/kit_a_wave_hello.webp'}/*END*/;
const META=/*META*/{"kit_a_dab": {"n": 120, "cols": 10, "w": 312, "h": 300, "fps": 12}, "kit_a_wave_hello": {"n": 84, "cols": 10, "w": 312, "h": 300, "fps": 12}, "kit_b_dab": {"n": 120, "cols": 10, "w": 260, "h": 300, "fps": 12}, "kit_b_jumping": {"n": 63, "cols": 10, "w": 260, "h": 300, "fps": 12}, "kit_b_wave_hello": {"n": 84, "cols": 10, "w": 260, "h": 300, "fps": 12}, "kit_b_zombie": {"n": 120, "cols": 10, "w": 260, "h": 300, "fps": 12}}/*ENDMETA*/;
const MOVES=[['dab','Dab 摆拍'],['jumping','跳跳'],['wave_hello','打招呼'],['zombie','僵尸走']];
const CHARS=[['kit_b','A 字站姿'],['kit_a','T 字站姿（长耳）']];
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const img={};for(const k in SRC){if(!META[k]&&k!=='stage')continue;img[k]=new Image();img[k].src=SRC[k];}
let ch='kit_b',mv='dab',t0=performance.now(),fade=0;
function key(){return META[ch+'_'+mv]?ch+'_'+mv:ch+'_dab'}
function ui(){
  const m=document.getElementById('moves');m.innerHTML='';
  for(const [k,l] of MOVES){const b=document.createElement('button');b.textContent=l;b.dataset.m=k;
    if(!META[ch+'_'+k]){b.disabled=true;b.style.opacity=.35}
    if(k===mv)b.className='on';b.onclick=()=>{mv=k;t0=performance.now();fade=1;ui()};m.appendChild(b)}
  const c=document.getElementById('chars');c.innerHTML='';
  for(const [k,l] of CHARS){if(!META[k+'_dab'])continue;const b=document.createElement('button');b.textContent=l;b.dataset.c=k;
    if(k===ch)b.className='on';b.onclick=()=>{ch=k;if(!META[ch+'_'+mv])mv='dab';t0=performance.now();fade=1;ui()};c.appendChild(b)}
}
ui();
function draw(now){
  cx.clearRect(0,0,1200,800);
  if(img.stage.complete)cx.drawImage(img.stage,0,0,1200,800);
  const k=key(),M=META[k],im=img[k];
  if(M&&im.complete&&im.naturalWidth){
    const f=Math.floor((now-t0)/1000*M.fps)%M.n;
    const sx=(f%M.cols)*M.w,sy=Math.floor(f/M.cols)*M.h;
    const H=360,W=M.w*H/M.h,x=600-W/2,y=655-H;
    // soft floor shadow
    cx.save();cx.globalAlpha=.25;cx.fillStyle='#4a2a14';cx.beginPath();cx.ellipse(600,650,W*.32,16,0,0,7);cx.fill();cx.restore();
    cx.drawImage(im,sx,sy,M.w,M.h,x,y,W,H);
  }
  if(fade>0){cx.fillStyle=`rgba(255,240,210,${fade*.5})`;cx.fillRect(0,0,1200,800);fade=Math.max(0,fade-.08)}
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script></body></html>
