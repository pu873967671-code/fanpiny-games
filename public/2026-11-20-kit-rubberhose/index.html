<script>
(()=>{
const META={"dance":{"w":523,"h":427,"ground":425,"cx":252.3},"react":{"w":446,"h":418,"ground":415,"cx":217.9},"lever":[75.9,293.0],"ui":[[376,360],[376,360],[410,354],[249,340],[386,406],[386,406],[343,358],[392,406]],"fx":[[127,418],[398,235],[281,325],[341,310],[366,352],[342,313],[340,291],[191,306]],"bg":[1672,941]};
const SRC={bg:'bg.webp',dance:'kit_dance.webp',react:'kit_react.webp'};
for(let i=0;i<8;i++){SRC['u'+i]='ui_'+i+'.webp';SRC['x'+i]='fx_'+i+'.webp';}
const W=1200,H=675,cv=document.getElementById('c'),g=cv.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);
const wrap=document.getElementById('wrap');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H)*0.98;wrap.style.transform=`translate(${-W*s/2}px,${-H*s/2}px) scale(${s})`;}
addEventListener('resize',fit);fit();
const IM={};let left=0;
for(const k in SRC){left++;const im=new Image();im.onload=()=>{if(--left===0)start();};im.src=SRC[k];IM[k]=im;}
const L=/*LAYOUT*/{kit:[250,642,400],gram:[505,560,195],btn:[620,650,150],tog:[800,650,125],clock:[962,650,185],knob:[738,552,118],slider:[1100,604,330]};
const R=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
// ---------- state
let T=0,last=null,music=false,bpm=112,beatPos=0,beatN=0,wild=.45,lastInput=0,combo=0,comboT=-9;
const parts=[],texts=[];
function body(o){return Object.assign({ang:0,av:0,sy:1,syv:0,hop:0,hv:0,jit:0},o);}
const W_={};
function mk(id,key,lay,extra){const [x,y,h]=lay;const im=IM[key];const w=h*im.width/im.height;W_[id]=body(Object.assign({id,key,x,y,h,w,ph:R(-.08,.08)},extra||{}));}
// kit
const kit=body({x:L.kit[0],y:L.kit[1],h:L.kit[2],re:-1,reT:0,reDur:0,sleep:false,flip:1});
// ---------- audio
let AC=null,master=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type,v,f2,when){if(!AC)return;const t=AC.currentTime+(when||0),o=AC.createOscillator(),gn=AC.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(v||.2,t+.008);gn.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+d+.05);}
const MEL=[392,440,392,330,349,392,262,294, 330,349,392,523,494,440,392,0];
const BAS=[131,196,147,196,131,196,175,196];
function beatSound(n){if(!AC)return;const v=.5+wild*.6;tone(BAS[n%8],.22,'triangle',.22*v);if(n%2)tone(523,.07,'square',.035*v),tone(659,.07,'square',.03*v);
 const m=MEL[n%16];if(m)tone(m*2,.18,'square',.045*v);const m2=MEL[(n*2+1)%16];if(m2&&wild>.5)tone(m2*2,.12,'square',.03*v,null,30/bpm);}
// ---------- particles
function pop(key,x,y,o){parts.push(Object.assign({key,x,y,vx:R(-120,120),vy:R(-320,-160),g:520,rot:R(-.5,.5),vr:R(-3,3),life:0,dur:R(1,1.5),s:R(.7,1.1),size:46,sway:0},o||{}));}
function say(txt,x,y,col){texts.push({txt,x,y,life:0,dur:1.1,col:col||'#c8352e'});}
// ---------- reactions
function react(i,dur,hop){kit.re=i;kit.reT=0;kit.reDur=dur;kit.sleep=false;if(hop)kit.hv=-hop;kit.syv-=4;}
function poke(o,a,s,h){o.av+=a||0;o.syv+=s||0;if(h)o.hv-=h;}
// ---------- controls
function setMusic(on){music=on;const tg=W_.tog;poke(tg,0,-5,0);tone(on?880:440,.06,'square',.08);tone(on?1320:330,.08,'square',.06,null,.05);
 if(on){beatPos=0;beatN=0;poke(W_.gram,0,-6,160);for(let i=0;i<3;i++)note(i*.1);react(7,.55,260);say('开 场 ！',W_.gram.x,W_.gram.y-W_.gram.h-30,'#2a7f74');}
 else{react(0,.01,0);say('嘘…',W_.gram.x,W_.gram.y-W_.gram.h-30,'#2a7f74');}}
function note(){const gm=W_.gram;pop(Math.random()<.6?'x2':'x3',gm.x-gm.w*.18,gm.y-gm.h*.85,{vx:R(-60,40),vy:R(-110,-70),g:-20,dur:R(1.8,2.6),size:R(36,48),sway:R(2,3.5),vr:0,rot:0});}
function pressBtn(){const b=W_.btn;b.down=true;b.pressT=0;poke(b,R(-1,1),-9,0);tone(180,.25,'sine',.3,90);tone(520,.12,'square',.05,260);
 let onBeat=false;if(music){const f=beatPos%1;onBeat=f<.16||f>.84;}
 for(let i=0;i<(onBeat?7:4);i++)pop(onBeat?'x4':(i%2?'x4':'x6'),b.x,b.y-b.h*.7,{size:onBeat?54:40});
 if(music&&onBeat){combo++;comboT=T;say(combo>1?'完美！×'+combo:'完美！',b.x,b.y-b.h-40);react(7,.5,300);for(let i=0;i<2;i++)pop('x5',kit.x+R(-60,60),kit.y-kit.h*.8,{size:44});tone(784,.1,'square',.06);tone(1046,.14,'square',.06,null,.07);
   for(const k in W_)poke(W_[k],0,-3,60);}
 else{if(music){combo=0;say('啪！',b.x,b.y-b.h-40,'#c8352e');react(4,.7,0);}else{react(3,1,90);say('啵！',b.x,b.y-b.h-40);}}}
let ringT=-9;
function ring(){const c=W_.clock;ringT=T;c.syv-=6;for(let i=0;i<4;i++)pop('x7',c.x+R(-50,50),c.y-c.h*.8,{size:30});say('铃铃铃！',c.x,c.y-c.h-36,'#c8352e');
 if(kit.sleep||kit.re===6){react(1,.6,520);kit.after=[2,1.1];}else react(2,1.6,120);
 for(const k in W_)if(k!=='clock')poke(W_[k],R(-6,6),-4,140);}
function clickKit(){react(4,.9,200);for(let i=0;i<3;i++)pop('x5',kit.x+R(-50,50),kit.y-kit.h*.75,{size:40});tone(660,.08,'square',.06);tone(880,.1,'square',.05,null,.08);}
// knob
let knobAng=-135+270*.45,spin=0,spinT=0;
function knobSet(a){const d=a-knobAng;knobAng=clamp(a,-135,135);wild=(knobAng+135)/270;W_.knob.av+=d*.02;}
// slider
function sliderGeo(){const s=W_.slider;const top=s.y-s.h*.88,bot=s.y-s.h*.12;return [top,bot];}
function setBpm(y){const [t,b]=sliderGeo();const u=clamp((b-y)/(b-t),0,1);bpm=Math.round(70+u*110);}
function sliderY(){const [t,b]=sliderGeo();return b-(bpm-70)/110*(b-t);}
// ---------- input
let drag=null;
function hitW(o,x,y){return x>o.x-o.w*.5&&x<o.x+o.w*.5&&y>o.y-o.h&&y<o.y;}
function down(x,y){ac();lastInput=T;
 const s=W_.slider,hy=sliderY();if(Math.abs(x-s.x)<55&&y>hy-55&&y<hy+55||(Math.abs(x-s.x)<40&&y>s.y-s.h&&y<s.y)){drag={k:'slider'};W_.slider.grab=1;setBpm(y);tone(300,.05,'square',.05);return;}
 const k=W_.knob;if(Math.hypot(x-k.x,y-(k.y-k.h*.5))<k.h*.6){drag={k:'knob',a0:Math.atan2(y-(k.y-k.h*.5),x-k.x),moved:0};poke(k,0,-3,0);return;}
 if(hitW(W_.btn,x,y)){pressBtn();drag={k:'btn'};return;}
 if(hitW(W_.tog,x,y)){setMusic(!music);return;}
 if(hitW(W_.gram,x,y)){setMusic(!music);return;}
 if(hitW(W_.clock,x,y)){ring();return;}
 if(Math.abs(x-kit.x)<kit.h*.32&&y>kit.y-kit.h&&y<kit.y){clickKit();return;}
 pop('x6',x,y,{vy:-60,g:0,dur:.6,size:50,vx:0});tone(200,.06,'triangle',.06);}
function move(x,y){if(!drag)return;lastInput=T;
 if(drag.k==='slider'){const b0=bpm;setBpm(y);if(b0!==bpm&&bpm%6===0)tone(200+bpm*2,.03,'square',.03);}
 if(drag.k==='knob'){const k=W_.knob,a=Math.atan2(y-(k.y-k.h*.5),x-k.x);let d=a-drag.a0;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;drag.a0=a;drag.moved+=Math.abs(d);
   knobSet(knobAng+d*180/Math.PI);spin+=Math.abs(d);if(Math.abs(d)>.05)tone(600+wild*600,.02,'square',.025);
   if(spin>7&&kit.re!==5){react(5,2.2,0);say('晕～',kit.x+60,kit.y-kit.h-10,'#7a3fa0');for(const kk in W_)poke(W_[kk],R(-14,14),0,0);spin=0;}}}
function up(){if(!drag)return;if(drag.k==='knob'&&drag.moved<.05){knobSet(knobAng>=130?-135:knobAng+54);tone(500+wild*500,.05,'square',.05);}
 if(drag.k==='btn')W_.btn.down=false;if(drag.k==='slider'){W_.slider.grab=0;poke(W_.slider,0,-4,0);}drag=null;}
function pt(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);down(...pt(e));});
cv.addEventListener('pointermove',e=>move(...pt(e)));
addEventListener('pointerup',up);addEventListener('pointercancel',up);
window.__api={click:(x,y)=>{down(x,y);up();},down,move,up,music:()=>music,phase:()=>beatPos%1,nap:()=>{lastInput=-99;kit.re=-1;kit.sleep=true;}};
// ---------- physics + draw
function spring(o,dt,targ){o.av+=(-(o.ang-targ)*90-o.av*9)*dt;o.ang+=o.av*dt;o.syv+=(-(o.sy-1)*260-o.syv*13)*dt;o.sy+=o.syv*dt;o.hv+=1800*dt;o.hop+=o.hv*dt;if(o.hop>0){o.hop=0;if(o.hv>200)o.syv-=o.hv*.012;o.hv=0;}}
function sway(ph){ // rubber-hose loop: swing through centre on each beat, stretch at the extremes
 const p=beatPos+ph;return {a:Math.sin(Math.PI*p),b:Math.abs(Math.sin(Math.PI*p)),c:Math.pow(Math.abs(Math.cos(Math.PI*p)),6)};}
function drawW(o,key,extraAng){const im=IM[key||o.key];const sy=o.sy,sx=1+(1-sy)*.7;g.save();g.translate(o.x,o.y+o.hop);g.rotate((o.ang+(extraAng||0))*Math.PI/180);g.scale(sx,sy);g.drawImage(im,-o.w/2,-o.h,o.w,o.h);g.restore();}
function shadow(x,y,w,s){g.save();g.fillStyle='rgba(40,20,10,.22)';g.beginPath();g.ellipse(x,y+2,w*.42*s,9*s,0,0,7);g.fill();g.restore();}
function start(){
 mk('gram','u7',L.gram);mk('btn','u0',L.btn);mk('tog','u2',L.tog);mk('clock','u4',L.clock);mk('knob','u6',L.knob);mk('slider','x0',L.slider);
 W_.tog.lev=-32;W_.tog.lv=0;W_.slider.hy=0;
 requestAnimationFrame(frame);}
function frame(ts){requestAnimationFrame(frame);if(last===null)last=ts;let dt=Math.min(.05,(ts-last)/1000);last=ts;T+=dt;step(dt);draw();}
function step(dt){
 if(music){const prev=Math.floor(beatPos);beatPos+=dt*bpm/60;const n=Math.floor(beatPos);if(n!==prev){beatN=n;beatSound(n);if(n%2===0||wild>.6)note();
   for(const k in W_)W_[k].syv-=1.5+wild*3;kit.syv-=1+wild*2;}}
 else beatPos+=dt*.35; // slow idle breathing phase
 const amp=music?4+wild*16:1.2;
 for(const k in W_){const o=W_[k];const s=sway(o.ph);let targ=s.a*amp*(k==='slider'?.4:1);
   if(k==='clock'&&T-ringT<1.6){targ+=Math.sin(T*70)*9;o.hop=Math.min(o.hop,-Math.abs(Math.sin(T*35))*10);}
   spring(o,dt,targ);if(music){o.sy+=(-(s.b)*.0)*dt;o.hop=Math.min(o.hop,-s.b*(6+wild*16)*(k==='slider'?.2:1));}}
 const tg=W_.tog,lt=music?32:-32;tg.lv+=(-(tg.lev-lt)*220-tg.lv*12)*dt;tg.lev+=tg.lv*dt;
 if(W_.btn.down!==undefined){W_.btn.pressT=(W_.btn.pressT||0)+dt;if(!drag&&W_.btn.pressT>.18)W_.btn.down=false;}
 // kit
 kit.reT+=dt;if(kit.re>=0&&kit.reT>kit.reDur){if(kit.after){const a=kit.after;kit.after=null;react(a[0],a[1],0);}else kit.re=-1;}
 if(!music&&kit.re<0&&T-lastInput>9)kit.sleep=true;
 if(music)kit.sleep=false;
 const ks=sway(0);spring(kit,dt,music&&kit.re<0?ks.a*(3+wild*5):0);if(music&&kit.re<0)kit.hop=Math.min(kit.hop,-ks.b*(10+wild*26));
 if(kit.sleep&&Math.random()<dt*.9)texts.push({txt:'z',x:kit.x+40,y:kit.y-kit.h*.82,life:0,dur:2,col:'#5a4a7a',z:1});
 if(spin>0)spin=Math.max(0,spin-dt*2.5);
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt+(p.sway?Math.sin(p.life*p.sway*2)*40*dt:0);p.y+=p.vy*dt;p.rot+=p.vr*dt;if(p.life>p.dur)parts.splice(i,1);}
 for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.life+=dt;if(t.z){t.y-=24*dt;t.x+=Math.sin(t.life*3)*12*dt;}else t.y-=30*dt;if(t.life>t.dur)texts.splice(i,1);}
 if(!music&&!kit.sleep&&kit.re<0&&T-lastInput>3.5&&Math.random()<dt*.15)react(3,1.1,100); // idle: points at the switch, hinting
}
function draw(){
 const bg=IM.bg,sc=Math.max(W/bg.width,H/bg.height);g.drawImage(bg,(W-bg.width*sc)/2,(H-bg.height*sc)/2,bg.width*sc,bg.height*sc);
 if(music){g.save();g.globalAlpha=.06+.05*Math.pow(Math.abs(Math.cos(Math.PI*beatPos)),8);g.fillStyle='#fff3c0';g.fillRect(0,0,W,H);g.restore();}
 // slider (track + handle)
 const s=W_.slider;shadow(s.x,s.y,s.w,1);drawW(s);
 {const hy=sliderY(),hm=IM.x1,hh=74,hw=hh*hm.width/hm.height;const bounce=music?Math.sin(Math.PI*beatPos*2)*3:0;
  g.save();g.translate(s.x,hy+bounce);g.rotate((s.ang*.6+(music?Math.sin(Math.PI*beatPos)*6*wild:0))*Math.PI/180);const q=s.grab?1.12:1;g.scale(q*(1+(1-s.sy)*.5),q*s.sy);g.drawImage(hm,-hw/2,-hh/2,hw,hh);g.restore();
  g.save();g.font='22px wk,sans-serif';g.fillStyle='#3a2418';g.textAlign='center';g.fillText(bpm+' 拍',s.x,s.y+22);g.restore();}
 // knob
 const k=W_.knob;shadow(k.x,k.y,k.w,.8);drawW(k,null,knobAng);
 // back-to-front
 for(const id of ['gram','btn','tog','clock']){const o=W_[id];shadow(o.x,o.y,o.w,1+o.hop/200);
   if(id==='tog'){const lm=IM.u3,lh=o.h*.95,lw=lh*lm.width/lm.height,pv=META.lever;const sx=lw/lm.width;
     g.save();g.translate(o.x,o.y+o.hop);g.rotate(o.ang*Math.PI/180);g.scale(1+(1-o.sy)*.7,o.sy);g.translate(0,-o.h*.6);g.rotate(o.lev*Math.PI/180);g.drawImage(lm,-pv[0]*sx,-pv[1]*sx,lw,lh);g.restore();drawW(o);continue;}
   const key=id==='btn'&&o.down?'u1':id==='clock'&&T-ringT<1.6?'u5':null;drawW(o,key);}
 // kit
 drawKit();
 for(const p of parts){const im=IM[p.key];const a=p.life<.15?p.life/.15:clamp((p.dur-p.life)/.4,0,1);const sz=p.size*p.s*(p.life<.12?.4+p.life/.2:1);
   g.save();g.globalAlpha=a;g.translate(p.x,p.y);g.rotate(p.rot+(p.sway?Math.sin(p.life*p.sway)*.4:0));const w=sz*im.width/Math.max(im.width,im.height),h=sz*im.height/Math.max(im.width,im.height);g.drawImage(im,-w/2,-h/2,w,h);g.restore();}
 for(const t of texts){const a=clamp((t.dur-t.life)/.35,0,1),sc2=t.z?.7+t.life*.4:(t.life<.15?.5+t.life/.3:1);g.save();g.globalAlpha=a;g.translate(t.x,t.y);g.scale(sc2,sc2);g.rotate(Math.sin(t.life*12)*.08);
   g.font=(t.z?'30px':'40px')+' wk,sans-serif';g.textAlign='center';g.lineWidth=7;g.strokeStyle='#fffaf0';g.strokeText(t.txt,0,0);g.fillStyle=t.col;g.fillText(t.txt,0,0);g.restore();}
}
function drawKit(){let strip='dance',fi=0;
 if(kit.re>=0){strip='react';fi=kit.re;}
 else if(kit.sleep){strip='react';fi=6;}
 else if(music){fi=Math.floor(beatPos*2)%8;if(fi<0)fi+=8;}
 else{strip='react';fi=0;}
 const m=META[strip],im=IM[strip],S=kit.h/META.dance.h*(strip==='react'?(META.rscale||1):1);
 let sy=kit.sy,bob=0;if(kit.sleep)bob=Math.sin(T*1.6)*3,sy*=1+Math.sin(T*1.6)*.015;if(!music&&!kit.sleep&&kit.re<0)sy*=1+Math.sin(T*2.2)*.012;
 let lift=0;if(strip==='react'&&fi===1)lift=-Math.sin(clamp(kit.reT/kit.reDur,0,1)*Math.PI)*40;
 g.save();g.fillStyle='rgba(40,20,10,.22)';g.beginPath();g.ellipse(kit.x,kit.y+2,110*(1+kit.hop/300),14,0,0,7);g.fill();g.restore();
 g.save();g.translate(kit.x,kit.y+kit.hop+bob+lift);g.rotate(kit.ang*Math.PI/180+(fi===5&&strip==='react'?Math.sin(T*6)*.08:0));g.scale(1+(1-sy)*.6,sy);
 g.drawImage(im,fi*m.w,0,m.w,m.h,-m.cx*S,-m.ground*S,m.w*S,m.h*S);g.restore();}
})();

</script></body></html>
